<script>
let D, К, И, ДНИ, СОБ, В_ПРОДАЖЕ, ПИСЬМО;
function применитьДанные(d) {
  D = d; К = D.кабинет; И = К.итог; ДНИ = К.дни;
  СОБ = К.события; В_ПРОДАЖЕ = СОБ.filter(e => e.в_продаже);
  ПИСЬМО = D.письма ? D.письма.отчёты[D.письма.отчёты.length - 1] : null;
}

const ч = n => Math.round(n).toLocaleString('ru-RU').replace(/,/g, ' ');
const р = n => ч(n) + '\u00a0₽';   // неразрывный пробел: «₽» не уходит на новую строку
const пр = (x, z = 1) => (x * 100).toFixed(z).replace('.', ',') + '\u00a0%';
const эл = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c;
  if (h !== undefined) e.innerHTML = h; return e; };

/* ---------- плитки ---------- */
function плитки() {
  const посл = ДНИ[ДНИ.length - 1], дней = ДНИ.length;
  const сетыР = И.сумма_еды + (И.сумма_ужинов || 0), сетыШт = И.еды + (И.ужинов || 0);   // 15.10.2026, Ал: ужин — в сетах
  const всегоДней = (() => {
    const a = ДНИ[0].ключ, b = посл.ключ;
    return Math.round((new Date(b) - new Date(a)) / 86400000) + 1;
  })();
  // 14.10.2026: темп и загрузка — по ПЛАТНЫМ (пригласительные промопоказов давали «163 места/сутки»)
  const плат = d => d.платных !== undefined ? d.платных : d.мест;
  const темп = ДНИ.reduce((a, d) => a + плат(d), 0) / всегоДней;
  const темп7 = ДНИ.slice(-7).reduce((a, d) => a + плат(d), 0) / Math.min(7, дней);
  const темп7всех = ДНИ.slice(-7).reduce((a, d) => a + d.мест, 0) / Math.min(7, дней);
  // 14.10.2026: средние — по платным местам (пригласительные по 0 ₽ размывали цену и чек)
  const срЦена = И.ср_цена_платных || И.ср_цена, платных = И.платных || И.продано;
  const дельтаЦены = срЦена - D.цена_места_в_модели;
  // В модели место и сет — две отдельные позиции: 9 500 + 1 900 = 11 400.
  // Поэтому сет прибавляется не к 9 500, а сравнивается уже с полным билетом.
  const сетНаМесто = платных ? И.сумма_еды / платных : 0;
  const чек = срЦена + сетНаМесто;
  const дельтаЧека = чек - D.цена_билета_в_модели;
  // 15.10.2026 (аудит): цель — 80 % плана 276 мест на показ (221), как во вкладке «Прогноз» (было 80 % квоты 301)
  // 16.10.2026, Ал: «переводи на цель 276» — цель 100 % плана (276 на показ), безубыточность (249) — второй отметкой
  const плН = И.платных !== undefined ? И.платных : И.продано;
  const цель = D.мест_в_зале * (И.событий_в_продаже || 0), надо = Math.max(0, цель - плН);
  const цельБУ = Math.round(D.мест_в_зале * (D.цель_загрузки || 249 / 276)) * (И.событий_в_продаже || 0), надоБУ = Math.max(0, цельБУ - плН);
  // 09.10.2026: билеты за 0 ₽ — отдельной группой (только внутренняя версия: в партнёрской блока нет)
  const Б = К.бесплатные, нольЗа = ключи => Б ? Object.values(Б).reduce((a, г) =>
    a + ключи.reduce((x, к) => x + (г.по_дням[к] || 0), 0), 0) : 0;
  const ноль = Б ? Object.values(Б).reduce((a, г) => a + г.мест, 0) : 0;
  const ноль7 = нольЗа(ДНИ.slice(-7).map(d => d.ключ)), нольВчера = нольЗа([посл.ключ]);
  const k = [
    ['Мест продано', ч(И.продано),
     `<span class="${посл.мест ? 'up' : 'dim'}">+${ч(посл.мест)} за ${посл.дата}</span> · квота ${ч(И.квота)}` +
     (ноль ? `<br>платных ${ч(И.продано - ноль)} · <span class="gold">за 0 ₽ ${ч(ноль)}</span>` : '')],
    ...(И.кабинет ? [['Билетов, как в кабинете', ч(И.кабинет.билетов),
      `места + сеты + пригл. · ${р(И.кабинет.сумма)}<br>как в отчёте «По каналам продаж»` +
      (И.кабинет.событий_с_отчётом < И.кабинет.событий_в_продаже ? `<br><span class="dim">отчёт есть по ${И.кабинет.событий_с_отчётом} из ${И.кабинет.событий_в_продаже} показов</span>` : '')]] : []),
    // 14.10.2026: проект целиком, как «Финансы → Организаторы» в кабинете (только внутренняя версия)
    ...(И.проект ? [['Проект целиком, нетто', р(И.проект.сумма_нетто),
      `${ч(И.проект.нетто)} бил. · все события<br>` +
      `возвраты <span class="down">${ч(И.проект.возвращено)} · ${р(И.проект.сумма_возвратов)}</span><br>` +
      `<span class="gold">штрафы ${р(И.проект.сумма_штрафов)}</span> · комиссии ${р(И.проект.комиссия)}`]] : []),
    // 15.10.2026, Ал: «Авторский ужин» — это сеты (разовая ошибка первых продаж), отдельно не показываем
    ['Выручка по местам', р(И.сумма), `с сетами <b>${р(И.сумма + сетыР)}</b> · сеты ${р(сетыР)}`],
    ['Средняя цена места', ч(срЦена) + ' <small>₽</small>',
     // в партнёрской версии модели нет — только факт (26.09.2026, решение Ала)
     (D.цена_места_в_модели ? `<span class="${дельтаЦены < 0 ? 'down' : 'up'}">${дельтаЦены < 0 ? '−' : '+'}${ч(Math.abs(дельтаЦены))} ₽ к модели ${ч(D.цена_места_в_модели)}</span> · ` : '') + `без сета · по ${ч(платных)} платным местам`],
    ['Сеты в деньгах', р(сетыР),
     `${ч(сетыШт)} сетов · ${пр(сетыР / (И.сумма + сетыР))} выручки`],
    ['Средний чек на человека', ч(чек) + ' <small>₽</small>',
     (D.цена_билета_в_модели ? `<span class="${дельтаЧека < 0 ? 'down' : 'up'}">${дельтаЧека < 0 ? '−' : '+'}${ч(Math.abs(дельтаЧека))} ₽ к модели ${ч(D.цена_билета_в_модели)}</span> · ` : '') + `место + сет ${ч(сетНаМесто)}`],
    ['Сетов продано', ч(сетыШт), (() => {
      // цвет закреплён за видом меню, а не за местом в списке
      const поМеню = { 'мясное': '#ff5468', 'рыбное': '#eceaf2', 'вегетарианское': '#57c98a' };
      const цвет = имя => поМеню[имя.replace(' меню', '').toLowerCase()] || '#6f6880';
      const меню = Object.entries(К.меню).sort((a, b) => b[1] - a[1]);
      const доля = v => И.еды ? 100 * v / И.еды : 0;
      const пц = v => доля(v) < 1 ? '<1 %' : Math.round(доля(v)) + ' %';
      const полоса = меню.map(([k, v]) =>
        `<i style="width:${доля(v)}%;background:${цвет(k)}"></i>`).join('');
      const легенда = меню.map(([k, v]) =>
        `<span><u style="background:${цвет(k)}"></u>${k.replace(' меню', '').toLowerCase()}` +
        ` <b>${ч(v)}</b> <span class="dim">${пц(v)}</span></span>`).join('');
      return `<div class="edabar">${полоса}</div><div class="edaleg">${легенда}</div>` +
        `<div class="gold" style="margin-top:7px">сет берут к ${пр(И.выкуп_платных !== undefined ? И.выкуп_платных : И.выкуп)} платных мест</div>`;
    })()],
    ['Загрузка блока', пр(плН / Math.max(1, цель), 1),
     `платные от плана ${ч(D.мест_в_зале)} мест на показ · с пригл. ${пр(И.загрузка, 1)} квоты<br>до цели 100 % ещё <b>${ч(надо)}</b> платных` +
     (темп7 > 0 ? ` · при нынешнем темпе ${ч(Math.ceil(надо / темп7))} дн.` : '') +
     `<br>до безубыточности (${Math.round(D.цель_загрузки * 100)} %) ещё ${ч(надоБУ)}` +
     `<br>свободно ${ч(И.свободно)}` + (И.кабинет && И.кабинет.придержано !== undefined ? ` · <span class="gold">придержано ${ч(И.кабинет.придержано)}</span>` : ` · у агента ${ч(И.агент)}`)],
    ['Темп продаж', темп7.toFixed(1).replace('.', ',') + ' <small>мест/сутки</small>',
     `платные, 7 дней · с начала ${темп.toFixed(1).replace('.', ',')}` +
     (темп7всех > темп7 ? `<br><span class="dim">с пригл. ${темп7всех.toFixed(1).replace('.', ',')}</span>` : '')],
    ['Событий в продаже', ч(И.событий_в_продаже) + ' <small>из ' + ч(D.показов_по_договору) + '</small>',
     `заведено в системе ${ч(И.событий_всего)} · остальные ещё не открыты`],
  ];
  const box = document.getElementById('kpis');
  k.forEach(([t, v, d], i) => { const c = эл('div', 'kpi');
    c.append(эл('div', 't', t), эл('div', 'v', v), эл('div', 'd', d)); box.append(c);
    if (i === 0 && ноль) box.append(карточкаНоль(Б, ноль, нольВчера, посл)); });
  box.style.setProperty('--n', Math.ceil(box.querySelectorAll(':scope > .kpi').length / 2));
  полосаВозвратов(box, посл);
  document.getElementById('sub').innerHTML =
    `Выгрузка кабинета Yandex Tickets от <b>${К.собрано}</b> · продажи с <b>${К.первая_продажа}</b> ` +
    `по <b>${К.последняя_продажа}</b> · ${ч(И.возврат)} возвратов мест и ${ч(И.возврат_еды)} сетов учтены`;
}

/* ---------- карточка «Билеты за 0 ₽» (09.10.2026, Ал: не исключать, а выделить группой) ---------- */
function карточкаНоль(Б, ноль, нольВчера, посл) {
  const ИМЯ = { перенос: 'перенос · сотрудники', без_продавца: 'без продавца', агент: 'агент за 0 ₽' };
  const ПОДСКАЗКА = {
    перенос: 'Выписаны сотрудниками кабинета без агента — похоже на перенос гостей с отменённых показов. Подтвердить у КК.',
    без_продавца: 'Ни агента, ни сотрудника в выгрузке — в основном пригласительные на промопоказы 12.10 и 14.10 (Ал, 14.10).',
    агент: 'Продажа через агента со скидкой 100 % (промокод?).' };
  const с = эл('div', 'kpi kpi0');
  const строки = Object.entries(Б).filter(([, г]) => г.мест).map(([к, г]) => {
    const столы = г.столы.slice(0, 4).map(([т]) => т.replace('Стол ', '')).join(', ');
    const кто = Object.keys(г.кто || {}).filter(x => x && x !== '—').join(', ');
    const подск = `${ПОДСКАЗКА[к] || ''}\n${г.заказов} заказов · ${Object.keys(г.показы).length} показов` +
      (г.сетов ? ` · ${г.сетов} сетов` : '') + (столы ? ` · столы ${столы}` : '') + (кто ? `\n${кто}` : '');
    return `<div class="g0" title="${подск}"><span>${ИМЯ[к] || к}</span><b>${ч(г.мест)}</b></div>`; }).join('');
  с.append(эл('div', 't', 'Билеты за 0 ₽'),
    эл('div', 'v', ч(ноль) + ' <small>мест · ' + пр(ноль / И.продано) + '</small>'),
    эл('div', 'd', (нольВчера ? `<span class="gold">+${ч(нольВчера)} за ${посл.дата}</span> · ` : '') +
      `входят в «Мест продано»` + строки));
  return с;
}

// Отдельной полосой, а не карточкой: деталей много, карточка растягивала весь ряд

    ячейка(`<span class="down">−${р(всего)}</span>`, `вернули всего: ${ч(билетов)} билетов (${ч(о.мест + з.мест)} мест · ${ч(о.сетов + з.сетов)} сетов)`,
      `отмена ${р(о.сумма)} · зрители ${р(з.сумма)}`) +
    ячейка(ч(В.отменённые.length), 'показов отменено', шт(о) + ' возвращено', '',
      'Отменённые показы: ' + В.отменённые.join(', ')) +
    ячейка(`<span class="gold">${р(ж.сумма)}</span>`, 'ещё вернуть по отменённым', шт(ж)) +
    ячейка(шт(н), 'выдано за 0 ₽ без агента', (Object.keys(н.кто || {}).filter(Boolean).length ? 'вручную: ' + Object.keys(н.кто).filter(Boolean).join(', ') : 'выписаны в кабинете вручную') +
      (В.снято_за_ноль && В.снято_за_ноль.мест ? ` · снято ещё ${шт(В.снято_за_ноль)}` : ''), '',
      н.кто ? 'Билеты за 0 ₽, выписанные сотрудниками кабинета без агента. Похоже на перенос зрителей отменённых показов — подтвердить у КК.' : '') +
    (ком || комЖ ? ячейка(р(ком + комЖ), 'Вопрос к КК: комиссия Яндекса удержана?',
      `${р(ком)} по возвращённым + ${р(комЖ)} по отменённым`, 'vz-q',
      'Комиссия Яндекса: 8 % с продаж через Афишу, 4 % через виджет. Удерживает ли её Яндекс при возврате по отмене показа — ' +
      'зависит от договора КК с Яндексом. Запросить у КК пункт договора и акт сверки за сентябрь.') : '') +
    `</div>`;
  box.after(п);
}

/* ---------- таблица ---------- */
function таблица(колонки, ряды, итог) {
  const s = эл('div', 'scroll'), t = эл('table'), thead = эл('thead'), tr = эл('tr');
  колонки.forEach((k, i) => { const th = эл('th', k.подсказка ? 'tip' : '', k.имя);
    if (k.подсказка) th.title = k.подсказка;          // пояснение столбца — при наведении
    if (k.цвет) th.style.color = k.цвет;               // 15.10.2026: цвет потока (билеты / сеты / бар)
    th.onclick = () => сортировать(t, i, k.числовая !== false); tr.append(th); });
  thead.append(tr); t.append(thead);
  const tb = эл('tbody');
  ряды.forEach(r => { const tr = эл('tr', r.класс);
    (r.ячейки || r).forEach((c, i) => { const td = эл('td', c && c.класс, c && c.html !== undefined ? c.html : c);
      if (колонки[i] && колонки[i].цвет && !(c && c.класс)) td.style.color = колонки[i].цвет;
      if (c && c.title) td.title = c.title;   // подсказка при наведении (14.10.2026)
      tr.append(td); });
    tb.append(tr); });
  t.append(tb);
  if (итог) { const tf = эл('tbody'), tr = эл('tr', 'total');
    итог.forEach((c, i) => { const td = эл('td', '', c); if (колонки[i] && колонки[i].цвет) td.style.color = колонки[i].цвет; tr.append(td); });
    tf.append(tr); t.append(tf); }
  s.append(t); return s;
}
function сортировать(t, i, числовая) {
  const tb = t.tBodies[0], ряды = [...tb.rows];
  const было = t.tHead.rows[0].cells[i].classList.contains('sorted');
  [...t.tHead.rows[0].cells].forEach(th => th.classList.remove('sorted', 'asc'));
  const знач = tr => { const s = tr.cells[i].textContent.replace(/\s|₽|%/g, '').replace(',', '.');
    return числовая ? (parseFloat(s) || 0) : tr.cells[i].textContent; };
  ряды.sort((a, b) => было ? (знач(a) > знач(b) ? 1 : -1) : (знач(a) < знач(b) ? 1 : -1));
  t.tHead.rows[0].cells[i].classList.add(было ? 'asc' : 'sorted');
  ряды.forEach(r => tb.append(r));
}

/* ---------- график «Загрузка показов» (14.10.2026, Ал): столбец — показ, высота — проданные места по каналам ---------- */
function графикЗагрузки() {
  const пок = СОБ.filter(e => !e.отмена && !e.служебное && (e.в_продаже || e.прошёл) && e.места.квота)
    .sort((a, b) => (a.дата.split('.').reverse().join('') + a.время).localeCompare(b.дата.split('.').reverse().join('') + b.время));
  if (!пок.length) return эл('div');
  const кан = e => e.места.по_каналам && Object.keys(e.места.по_каналам).length ? e.места.по_каналам
    : {'Яндекс Афиша': e.места.платно || 0, 'пригласительные': e.места.пригл || 0};
  const итого = {};
  пок.forEach(e => Object.entries(кан(e)).forEach(([к, v]) => итого[к] = (итого[к] || 0) + v));
  // пригласительные — всегда верхним слоем, платные каналы снизу по убыванию
  const каналы = Object.keys(итого).filter(к => к !== 'пригласительные').sort((a, b) => итого[b] - итого[a]);
  if (итого['пригласительные']) каналы.push('пригласительные');
  let запас = 0; const цвет = {};
  каналы.forEach(к => цвет[к] = ЦВЕТ_ИСТОЧНИКА[к] || ['#b0a4ff', '#ffb38a', '#f58fb0', '#8fd694'][запас++ % 4]);
  // 15.10.2026, Ал: база плана — бизнес-план 276 мест, 80 % = 221; схема зала 301 — верх оси
  const квота = Math.max(...пок.map(e => e.места.квота)), цель = Math.round(D.мест_в_зале * D.цель_загрузки);
  const шаг = 50, max = Math.ceil(квота / шаг) * шаг;
  const ось = 52, верх = 30, bw = 44, h = 230, w = ось + пок.length * bw + 64;
  const явкаЕсть = пок.some(e => e.кабинет && e.кабинет.явка);
  const низ = 40 + (каналы.length + (явкаЕсть ? 1 : 0)) * 12 + 4;   // место под счётчик каналов и «пришло»
  const Y = v => верх + h - v / max * h;
  let svg = `<div class="scroll"><svg viewBox="0 0 ${w} ${верх + h + низ}" style="width:${w}px;max-width:none;height:${верх + h + низ}px">`;
  for (let v = 0; v <= max; v += шаг)
    svg += `<line x1="${ось - 4}" x2="${w}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v ? '#2a2338' : '#3a3248'}"/>` +
      `<text x="${ось - 7}" y="${Y(v) + 3.5}" font-size="10.5" fill="#b9b2c6" text-anchor="end">${v}</text>`;
  svg += `<line x1="${ось}" x2="${w}" y1="${Y(квота)}" y2="${Y(квота)}" stroke="#d8d2e2" stroke-dasharray="4 3" opacity=".55"/>` +
    `<text x="${w - 4}" y="${Y(квота) - 4}" font-size="10.5" fill="#d8d2e2" text-anchor="end">схема зала ${квота}</text>` +
    // 15.10.2026, Ал: обе линии — план 276 (бизнес-план) и схема 301
    `<line x1="${ось}" x2="${w}" y1="${Y(D.мест_в_зале)}" y2="${Y(D.мест_в_зале)}" stroke="#efeaf4" stroke-width="1.2"/>` +
    `<text x="${w - 4}" y="${Y(D.мест_в_зале) - 4}" font-size="10.5" font-weight="700" fill="#efeaf4" text-anchor="end">цель 100 % = ${D.мест_в_зале} (бизнес-план)</text>` +
    `<line x1="${ось}" x2="${w}" y1="${Y(цель)}" y2="${Y(цель)}" stroke="#f0c34e" stroke-width="1.5"/>` +
    `<text x="${w - 4}" y="${Y(цель) - 4}" font-size="10.5" fill="#f0c34e" text-anchor="end">безубыточность ${Math.round(D.цель_загрузки * 100)} % плана (${D.мест_в_зале}) = ${цель}</text>`;
  каналы.forEach((c, j) => svg += `<rect x="${ось - 14}" y="${верх + h + 34 + j * 12}" width="9" height="9" rx="2" fill="${цвет[c]}"/>`);
  if (явкаЕсть) svg += `<text x="${ось - 4}" y="${верх + h + 46 + каналы.length * 12}" font-size="10.5" font-weight="700" fill="#57c98a" text-anchor="end">пришло</text>`;
  пок.forEach((e, i) => {
    const x = ось + i * bw + 5, ширина = bw - 10, к = кан(e);
    const всего = Object.values(к).reduce((a, v) => a + v, 0), плат = всего - (к['пригласительные'] || 0);
    const подпись = `${e.дата} ${e.время}: ${всего} мест из ${e.места.квота}` + (e.пометка ? ` · ${e.пометка}` : '') +
      '\n' + каналы.filter(c => к[c]).map(c => `${ИМЯ_ИСТОЧНИКА[c] || c}: ${к[c]}`).join('\n') +
      `\nзагрузка по платным ${пр(плат / e.места.квота, 1)}`;
    svg += `<g><title>${подпись.replace(/</g, '&lt;')}</title>`;
    let y = верх + h;
    каналы.forEach(c => { const v = к[c] || 0; if (!v) return;
      const hh = v / max * h; y -= hh;
      svg += `<rect x="${x}" y="${y}" width="${ширина}" height="${hh}" fill="${цвет[c]}"${e.прошёл ? ' opacity=".45"' : ''}/>`; });   // 15.10: бледный только столбец, цифры яркие
    // 15.10.2026, Ал: над столбцом — «платные/пригласительные», под ними — всего мест
    svg += (к['пригласительные'] ? `<text x="${x + ширина / 2}" y="${Y(всего) - 17}" font-size="10.5" font-weight="700" fill="#eceaf2" text-anchor="middle">${плат}<tspan fill="#e2e27a">/${к['пригласительные']}</tspan></text>` : '') +
      `<text x="${x + ширина / 2}" y="${Y(всего) - 4}" font-size="11" font-weight="700" fill="#eceaf2" text-anchor="middle">${всего}</text>` +
      `<text x="${x + ширина / 2}" y="${верх + h + 14}" font-size="10.5" font-weight="600" fill="#eceaf2" text-anchor="middle">${e.дата.slice(0, 5)}</text>` +
      `<text x="${x + ширина / 2}" y="${верх + h + 26}" font-size="9.5" fill="#b9b2c6" text-anchor="middle">${e.время}</text>` +
      // 14.10.2026, Ал: под каждым показом — сколько мест продал каждый канал, цифрой цвета канала
      каналы.map((c, j) => `<text x="${x + ширина / 2}" y="${верх + h + 42 + j * 12}" font-size="10.5" font-weight="800" fill="${цвет[c]}" text-anchor="middle"${к[c] ? '' : ' opacity=".25"'}>${к[c] || '·'}</text>`).join('') +
      // 15.10.2026, Ал: сколько пришло (вход по билетам и приглашениям) — для прошедших показов
      (e.кабинет && e.кабинет.явка ? `<text x="${x + ширина / 2}" y="${верх + h + 46 + каналы.length * 12}" font-size="10.5" font-weight="800" fill="#57c98a" text-anchor="middle">${e.кабинет.явка.пришло + e.кабинет.явка.пришло_по_приглашениям}</text>` : '') +
      `</g>`;
  });
  // 14.10.2026, Ал: под названием каждого продавца — счётчик «итого за весь период»
  const всего = каналы.reduce((a, c) => a + итого[c], 0);
  const счётчик = c => `<div style="display:flex;flex-direction:column;gap:2px;padding:8px 12px;margin:0 10px 8px 0;border:1px solid #2a2338;border-radius:10px;min-width:120px">` +
    `<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#cfc8da">` +
    `<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${цвет[c]}"></span>${ИМЯ_ИСТОЧНИКА[c] || c}</span>` +
    `<b style="font-size:20px;color:${цвет[c]}">${ч(итого[c])}</b>` +
    `<span style="font-size:11px;color:#f3dfb4">${пр(итого[c] / всего, 0)} всех мест</span></div>`;
  return блокГрафика(`<h3 style="margin:6px 0 4px">Загрузка показов</h3>` +
    `<div class="hint">Над столбцом — платные/пригласительные и под ними всего мест. Золотая линия — точка безубыточности: ${Math.round(D.цель_загрузки * 100)} % плана (${D.мест_в_зале} мест по бизнес-плану), пунктир сверху — схема зала. Под столбцом — сколько мест на показ продал каждый канал; внизу под каждым продавцом — итог за весь период. «Пришло» — вход по билетам и приглашениям. Бледные — прошедшие показы. Наведите на столбец — разбивка.</div>` +
    svg + '</svg></div><div style="display:flex;flex-wrap:wrap;margin-top:8px">' +
    каналы.map(счётчик).join('') + '</div>', w);
}

/* ---------- график «Продажа сетов» (15.10.2026, Ал): справа от «Загрузки показов», тот же вид ---------- */
// блок графика шириной со свой график — чтобы два графика вставали рядом (15.10.2026)
const блокГрафика = (html, w) => { const d = эл('div', '', html); d.style.cssText = `width:${w}px;max-width:100%;flex:0 0 auto`; return d; };
function графикСетов() {
  const пок = СОБ.filter(e => !e.отмена && !e.служебное && (e.в_продаже || e.прошёл) && e.места.квота)
    .sort((a, b) => (a.дата.split('.').reverse().join('') + a.время).localeCompare(b.дата.split('.').reverse().join('') + b.время));
  if (!пок.length) return эл('div');
  // 15.10.2026, Ал: «Авторский ужин» = сеты (ошибка первых продаж) — четвёртой полосой, вид меню в кабинете не разделён
  const ВИДЫ = [['мясное', '#ff5468'], ['рыбное', '#eceaf2'], ['вегетарианское', '#57c98a'], ['ужин', '#b0a4ff']];
  const штВида = (e, в) => в === 'ужин' ? ((e.ужин && e.ужин.продано) || 0) : (e.еда[в] || 0);
  const ось = 40, верх = 30, bw = 34, h = 230, w = ось + пок.length * bw + 12;

  for (let v = 0; v <= max; v += 50)
    svg += `<line x1="${ось - 4}" x2="${w}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v ? '#2a2338' : '#3a3248'}"/>` +
      `<text x="${ось - 7}" y="${Y(v) + 3.5}" font-size="10.5" fill="#b9b2c6" text-anchor="end">${v}</text>`;
  ВИДЫ.forEach(([, c], j) => svg += `<rect x="${ось - 14}" y="${верх + h + 34 + j * 12}" width="9" height="9" rx="2" fill="${c}"/>`);

  пок.forEach((e, i) => {

    let y = верх + h;

      `<text x="${x + ширина / 2}" y="${верх + h + 14}" font-size="10.5" font-weight="600" fill="#eceaf2" text-anchor="middle">${e.дата.slice(0, 5)}</text>` +

      (выкуп != null ? `<text x="${x + ширина / 2}" y="${верх + h + 46 + ВИДЫ.length * 12}" font-size="10.5" font-weight="800" fill="#f0c34e" text-anchor="middle">${выкуп}%</text>` : '') + `</g>`;
  });

  const счётчик = ([в, c, n]) => `<div style="display:flex;flex-direction:column;gap:2px;padding:8px 12px;margin:0 10px 8px 0;border:1px solid #2a2338;border-radius:10px;min-width:110px">` +
    `<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#e0dae8"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${c}"></span>${в}</span>` +
    `<b style="font-size:20px;color:${c}">${ч(n)}</b><span style="font-size:11px;color:#cfc8da">${пр(n / Math.max(1, всеСеты), 0)} сетов</span></div>`;

    svg + '</svg></div><div style="display:flex;flex-wrap:wrap;margin-top:8px">' + итого.map(счётчик).join('') + '</div>', w);
}

      'в графике площадки); без оплаты — закрыто в iiko без оплаты (угощения и неоплаченные счета); явка — проход по билетам (СКД). Отчёт появляется после показа, со следующим сбором.'));
  if (!пок.length) { p.append(эл('div', 'note', 'Данных iiko по показам пока нет.')); return; }

      ((и.вне_iiko || []).some(x => x.тип === 'фри-продукт') ? `<div class="hint" style="margin-top:4px">Фри-продукт — для нас бесплатно, сумма — оценка поставщика: ${р((и.вне_iiko || []).filter(x => x.тип === 'фри-продукт').reduce((a, x) => a + (x.сумма || 0), 0))}. ` +
        `Договорённость бар-менеджера Романа с поставщиком: фри-продукт на 2 представительских мероприятия — это 1-е.</div>` : '') +
      ((и.без_оплаты || []).length ? `<div class="hint" style="margin:8px 0 2px">Без оплаты — по чекам</div>` +
        и.без_оплаты.map(x => стр(`чек ${x.чек} · стол ${x.стол} · ${x.время}`, р(x.сумма), x.кассир) +
          `<div class="hint" style="margin:-2px 0 6px">${x.позиции}</div>`).join('') +
        `<div class="hint" style="margin-top:4px">Причину iiko не хранит: «без оплаты» — только признак (угощение или неоплаченный счёт). Кто и за что — по столу и кассиру.</div>` : '')), ПОТОК.бар) +
    `</div>` + ((s.пометка || '').includes('промопоказ') ? '<div class="hint" style="margin-top:12px">Промопоказ — без плана продаж.</div>' : (() => { const П = планШоу(s);
      return `<div style="margin-top:14px"><div style="font-weight:700;margin-bottom:6px;color:#efeaf4">План / факт</div>` +
        таблицаПланФакт([['Платные гости', П.гости, купили, false, false, true], ['Билеты (места)', П.билеты, м.сумма, true],
          ['Сеты (счёт КК + на шоу)', П.сеты, С.отКК * ЦЕНА_СЕТА_КК + С.нашоуР, true], ['Бар', П.бар, идёт ? null : и.бар, true],
          // 16.10.2026, Ал: общий счётчик сборов и в карточке показа; безубыточность — сборы при 249 платных
          ['Всего сборов (билеты + сеты + бар)', П.билеты + П.сеты + П.бар, идёт ? null : м.сумма + С.отКК * ЦЕНА_СЕТА_КК + С.нашоуР + и.бар, true, false, true],
          ['Бар на гостя в зале', П.чек, идёт ? null : Math.round(и.бар / Math.max(1, людей)), true, true]]) +
        `<div class="hint" style="margin-top:4px">План: ${ч(П.гости)} гостей (100 % по бизнес-плану; схема зала ${ч(s.места.квота)}) · место ${р(D.цена_места_в_модели || 9500)} · сет ${р(ЦЕНА_СЕТА_КК)} (счёт КК) на каждого гостя · бар ${р(ПЛАН_ЧЕК_БАРА)} на гостя в зале. Безубыточность — ${ч(Math.round(П.гости * D.цель_загрузки))} <b>платных гостей</b> (${Math.round(D.цель_загрузки * 100)} %, модель КК с нашими затратами); пригласительные в план не идут. Бар на гостя — на всех в зале (СКД).</div></div>`; })()) +
    // 16.10.2026, Ал: отдельная кнопка «Касса iiko — все данные»: оплаты, кассиры, по столам, официанты план/факт
    (и.по_оплате && и.кассиры ? `<details style="margin-top:12px"><summary style="cursor:pointer;color:#f0c34e;font-weight:700">iiko подробно</summary>` +
      `<div style="display:flex;flex-wrap:wrap;gap:22px;margin-top:8px">` +
      блок('Оплаты', Object.entries(и.по_оплате).map(([т, v]) => стр(т, р(v))).join('') +
        стр('Скидки при оплате', р(и.скидки)) + стр('Сервисный сбор', р(и.сервис)) +
        стр('Возвраты', р(и.возвраты)) + стр('Сторно', р(и.сторно)) + стр('Удалено позиций', ч(и.удалено))) +
      блок('Кассиры (оплачено)', Object.entries(и.кассиры || {}).map(([к, v]) => стр(к, р(v))).join('')) +
      `</div>` + кассаIikoСтолы(s, и) + `</details>` : '');
  return d;
}

// 16.10.2026, Ал: бар по столам и официанты план/факт. Стол кабинета = tableNum iiko (VIP — те же номера).
// План бара стола = гостей за столом (платные + пригл.) × ПЛАН_ЧЕК_БАРА. Официант → столы: отчёты-продаж/официанты_по_столам.csv
function кассаIikoСтолы(s, и) {
  const ГС = (s.места && s.места.по_столам) || {}, БС = и.по_столам || {};
  const номера = [...new Set([...Object.keys(ГС), ...Object.keys(БС)])];
  if (!номера.length) return '';
  const гостей = т => (ГС[т] || [0, 0])[0] + (ГС[т] || [0, 0])[1];
  const бар = т => (БС[т] || {}).бар || 0, бо = т => (БС[т] || {}).без_оплаты || 0, чк = т => (БС[т] || {}).чеков || 0;
  const стрТ = (имя, г, пг, б, б0, к, жирн) => { const план = г * ПЛАН_ЧЕК_БАРА, пр_ = план ? Math.round(б / план * 100) : null;
    const цв = пр_ == null ? '' : пр_ >= 100 ? 'color:#57c98a' : 'color:#ff7a8a';
    return `<tr${жирн ? ' style="font-weight:800"' : ''}><td>${имя}</td><td class="num">${ч(г)}${пг ? ` <span class="dim">(${ч(пг)} пригл.)</span>` : ''}</td>` +
      `<td class="num">${р(б)}</td><td class="num">${г ? р(Math.round(б / г)) : '—'}</td><td class="num">${план ? р(план) : '—'}</td>` +
      `<td class="num" style="${цв}">${пр_ == null ? '—' : пр_ + ' %'}</td><td class="num">${б0 ? р(б0) : '—'}</td><td class="num">${ч(к)}</td></tr>`; };
  const шапка = имя => `<thead><tr><th>${имя}</th><th class="num">Гостей</th><th class="num">Бар</th><th class="num">На гостя</th><th class="num">План бара</th><th class="num">Выполнение</th><th class="num">Без оплаты</th><th class="num">Чеков</th></tr></thead>`;
  const пг = т => (ГС[т] || [0, 0])[1];
  const сорт = [...номера].sort((a, b) => бар(b) - бар(a) || гостей(b) - гостей(a));
  const итог = стрТ('ИТОГО', сорт.reduce((a, т) => a + гостей(т), 0), сорт.reduce((a, т) => a + пг(т), 0), сорт.reduce((a, т) => a + бар(т), 0),
    сорт.reduce((a, т) => a + бо(т), 0), сорт.reduce((a, т) => a + чк(т), 0), true);
  let h = `<div style="margin-top:14px;font-weight:800">По столам</div><div class="hint">Гости — из кабинета билетов, бар и чеки — из iiko по номеру стола. План бара стола — гостей × ${р(ПЛАН_ЧЕК_БАРА)}. ` +
    `Столы без гостей по билетам (бар, 505, 601, 703 и т. п.) — гости без мест или стойка.</div>` +
    `<div class="scroll"><table class="кп-столы">${шапка('Стол')}<tbody>${сорт.map(т => стрТ(/^\d+$/.test(т) ? 'стол ' + т : т, гостей(т), пг(т), бар(т), бо(т), чк(т))).join('')}${итог}</tbody></table></div>`;
  if (D.версия === 'партнёры') return h;   // официанты и QR — только наши данные
  // 16.10.2026, Ал: заказы гостей через QR-меню на столе (FoodPicasso) — это наша клиентская база
  const Q = D.qr && (D.qr.показы || {})[s.дата.slice(6, 10) + '-' + s.дата.slice(3, 5) + '-' + s.дата.slice(0, 2) + ' ' + s.время];
  if (Q) { const г = Object.values(ГС).reduce((a, v) => a + v[0] + v[1], 0);
    const стр = (п, з, доп) => `<div style="display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #2a2338"><span>${п}</span><span style="text-align:right"><b>${з}</b>${доп ? '<br><span style="font-size:11.5px;color:#f3dfb4">' + доп + '</span>' : ''}</span></div>`;
    h += `<div style="margin-top:14px;font-weight:800">Заказы через QR-меню на столе (FoodPicasso)</div>` +
      `<div class="hint">Гость сканирует код на тейбл-тенте и заказывает сам — мы получаем его имя и телефон. В iiko такие заказы идут от «Пользователь iikoTransport». ` +
      `Контакты — в отчёты-продаж/гости_qr/база.csv (персональные данные, на сайт не выкладываются). Всего гостей в базе FoodPicasso: <b>${ч(D.qr.клиентов_в_базе || 0)}</b>.</div>` +
      стр('Заказов по QR', ч(Q.заказов), Q.гостей ? ч(Q.гостей) + ' гостей оставили телефон' : '') +
      стр('Сумма', р(Q.сумма), и.бар ? String(Math.round(Q.сумма / и.бар * 1000) / 10).replace('.', ',') + ' % бара' : '') +
      стр('Доля гостей с контактом', г ? String(Math.round(Q.гостей / г * 1000) / 10).replace('.', ',') + ' %' : '—', 'из ' + ч(г) + ' гостей на шоу') +
      (Object.keys(Q.столы || {}).length ? стр('Столы', Object.entries(Q.столы).map(([т, x]) => т + ' (' + x.заказов + ')').join(', ')) : '') +
      ((Q.позиции || []).length ? стр('Чаще заказывали', Q.позиции.slice(0, 5).map(([п, n]) => п + ' ×' + n).join(', ')) : ''); }
  // 16.10.2026: столы официанта — из iiko (OLAP, официант заказа); файл официанты_по_столам.csv — если нужно другое закрепление / настоящие имена
  let О = (D.официанты || {})[s.дата + ' ' + s.время], изIiko = false;
  if (!О && и.официанты && Object.keys(и.официанты).length) {
    const чей = {};   // стол → официант с наибольшей суммой по нему
    Object.entries(и.официанты).forEach(([имя, o]) => Object.entries(o.столы || {}).forEach(([т, v]) => { if (!чей[т] || v > чей[т][1]) чей[т] = [имя, v]; }));
    О = {}; Object.entries(чей).forEach(([т, [имя]]) => (О[имя] = О[имя] || []).push(т)); изIiko = true;
  }
  h += `<div style="margin-top:14px;font-weight:800">Официанты — план / факт</div>`;
  if (!О) return h + `<div class="hint">Данных об официантах нет. Можно задать вручную: <b>отчёты-продаж/официанты_по_столам.csv</b> — ` +
    `дата;время;официант;столы через запятую, например <code>15.10.2026;20:00;Иванова Анна;1,2,3,4</code>.</div>`;
  h += `<div class="hint">${изIiko ? 'Кто обслуживал стол — из iiko (официант заказа). Имена в iiko — логины зон («Официант 1»…); настоящие имена на смену — в файле отчёты-продаж/официанты_по_столам.csv. ' +
    '«Пользователь iikoTransport» — заказы гостей из приложения по коду на столе.' : 'Закрепление столов — из файла отчёты-продаж/официанты_по_столам.csv.'} Бар — без сетов, купленных на шоу.</div>`;
  const ряды = Object.entries(О).map(([имя, ст]) => [имя, ст.map(String), ст.reduce((a, т) => a + гостей(т), 0)]);
  const занято = new Set(ряды.flatMap(r => r[1])), ничьи = номера.filter(т => !занято.has(т) && (бар(т) || гостей(т) || бо(т) || чк(т)));
  const стрО = (имя, ст, жирн) => стрТ(имя + (ст ? `<div class="dim" style="font-size:11.5px">столы ${ст.join(', ')}</div>` : ''),
    ст ? ст.reduce((a, т) => a + гостей(т), 0) : 0, ст ? ст.reduce((a, т) => a + пг(т), 0) : 0,
    ст ? ст.reduce((a, т) => a + бар(т), 0) : 0, ст ? ст.reduce((a, т) => a + бо(т), 0) : 0, ст ? ст.reduce((a, т) => a + чк(т), 0) : 0, жирн);
  h += `<div class="scroll"><table class="кп-официанты">${шапка('Официант')}<tbody>` +
    ряды.sort((a, b) => b[1].reduce((x, т) => x + бар(т), 0) - a[1].reduce((x, т) => x + бар(т), 0)).map(r => стрО(r[0], r[1])).join('') +
    (ничьи.length ? стрО('не закреплены', ничьи) : '') + `</tbody></table></div>`;
  return h;
}

// 16.10.2026, Ал: «разобраться с неплатильщиками — объяснения от менеджеров, а они — от своих сотрудников».
// Чеки без оплаты из iiko (официант зоны — OLAP) + таблица объяснений менеджеров (без_оплаты.py). Только внутренняя версия.
function панельБезОплаты(p) {
  const Б = D.без_оплаты;
  p.append(эл('h2', '', 'Без оплаты — объяснения менеджеров'));
  if (!Б || !Б.чеки) { p.append(эл('div', 'hint', 'Данных нет — вкладка только во внутренней версии.')); return; }
  // сеты промопоказа (бесплатные сеты гостям 12.10) — известны, в итоги разбора не идут
  const ПР = Б.чеки.filter(x => x.тип === 'сеты промопоказа'), Ч = Б.чеки.filter(x => x.тип !== 'сеты промопоказа'), сум = f => Ч.reduce((a, x) => a + f(x), 0);
  const всего = сум(x => x.сумма), объ = сум(x => x.статус === 'объяснено' ? x.сумма : 0), прос = Ч.filter(x => x.статус === 'просрочено'), ждём = Ч.filter(x => x.статус === 'ждём');
  p.append(эл('div', 'hint', `Каждый чек, закрытый в iiko без оплаты, менеджер смены объясняет: тип, кто разрешил, что произошло и со слов какого сотрудника. ` +
    `Срок — ${Б.срок_часов} ч после конца показа. Объяснения берём из: <b>${Б.источник}</b>. Типы: ${Б.типы}.` +
    (ПР.length ? ` Сеты промопоказа (${ч(ПР.length)} чека, ${р(ПР.reduce((a, x) => a + x.сумма, 0))}) — бесплатные сеты гостям по плану, в итоги не входят.` : '')));
  const kpi = эл('div', 'kpis');
  [['Без оплаты всего', р(всего), ч(Ч.length) + ' чеков'], ['Объяснено', р(объ), всего ? Math.round(объ / всего * 100) + ' % суммы' : '—'],
   ['Ждём объяснения', ч(ждём.length) + ' <small>чеков</small>', р(ждём.reduce((a, x) => a + x.сумма, 0))],
   ['Просрочено', `<span style="color:${прос.length ? '#ff5a5a' : '#57c98a'}">${ч(прос.length)}</span> <small>чеков</small>`, р(прос.reduce((a, x) => a + x.сумма, 0))]]
    .forEach(([t, v, d]) => { const c = эл('div', 'kpi'); c.append(эл('div', 't', t), эл('div', 'v', v), эл('div', 'd', d)); kpi.append(c); });
  p.append(kpi);
  // по сотрудникам (официант зоны из iiko)
  const пс = {};
  Ч.forEach(x => { const к = x['официант (iiko)'] || x.кассир || '—'; const o = пс[к] = пс[к] || {ч: 0, с: 0, о: 0, п: 0}; o.ч++; o.с += x.сумма; if (x.статус === 'объяснено') o.о++; if (x.статус === 'просрочено') o.п++; });
  p.append(эл('h2', '', 'По сотрудникам'));
  p.append(таблица([{имя: 'Сотрудник (iiko)', числовая: false}, {имя: 'Чеков'}, {имя: 'Сумма'}, {имя: 'Объяснено'}, {имя: 'Просрочено'}],
    Object.entries(пс).sort((a, b) => b[1].с - a[1].с).map(([к, o]) => ({класс: o.п ? 'warn' : '', ячейки: [к, ч(o.ч), р(o.с), ч(o.о), o.п ? {класс: 'down', html: ч(o.п)} : {класс: 'zero', html: '0'}]})),
    ['ИТОГО', ч(Ч.length), р(всего), ч(Ч.filter(x => x.статус === 'объяснено').length), ч(прос.length)]));
  // каждый чек
  p.append(эл('h2', '', 'Каждый чек'));
  const ЦВ = {объяснено: '#57c98a', ждём: '#f0c34e', просрочено: '#ff5a5a'};
  p.append(таблица([{имя: 'Показ', числовая: false}, {имя: 'Чек', числовая: false}, {имя: 'Время', числовая: false}, {имя: 'Стол', числовая: false},
    {имя: 'Сумма'}, {имя: 'Сотрудник (iiko)', числовая: false}, {имя: 'Статус', числовая: false}, {имя: 'Тип', числовая: false},
    {имя: 'Объяснение', числовая: false}, {имя: 'Кто разрешил / со слов / менеджер', числовая: false}],
    [...Ч].sort((a, b) => ({просрочено: 0, ждём: 1, объяснено: 2}[a.статус] - {просрочено: 0, ждём: 1, объяснено: 2}[b.статус]) || b.сумма - a.сумма).map(x => ({ячейки: [
      {класс: 'nowrap', html: x.показ}, x.чек, x.время, x.стол, р(x.сумма), x['официант (iiko)'] || x.кассир,
      {html: `<b style="color:${ЦВ[x.статус]}">${x.статус}</b>${x.статус !== 'объяснено' ? `<div class="dim" style="font-size:11.5px">до ${x['срок объяснения']}</div>` : ''}`},
      x.тип || '—', {html: `<div style="max-width:320px;white-space:normal">${x.объяснение || '—'}<div class="dim" style="font-size:11.5px">${x.позиции}</div></div>`},
      [x.кто_разрешил, x.со_слов, x.менеджер].filter(Boolean).join(' / ') || '—']})),
    ['ИТОГО', '', '', '', р(всего), '', '', '', '', '']));
}

function панельСобытий(p) {
  p.append(эл('h2', '', 'Продажи по событиям, включая сеты'),
    эл('div', 'hint', 'Все события, заведённые в билетной системе. Сеты — три меню-сектора по 276 позиций на показ: мясное, рыбное, вегетарианское.'),
    (() => { const ряд = эл('div', '', ''); ряд.style.cssText = 'display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start';
      ряд.append(графикЗагрузки(), графикСетов()); return ряд; })());
  const кол = [{имя: 'Показ', числовая: false}, {имя: 'Квота мест'}, {имя: 'Продано', подсказка: 'Платные места (без пригласительных)'},
    {имя: 'Пригл.', подсказка: 'Пригласительные — места по 0 ₽'}, {имя: 'Загрузка', подсказка: 'По платным местам'},
    {имя: 'Выручка мест'}, {имя: 'Ср. цена'}, {имя: 'Сетов'}, {имя: 'Мясн.'}, {имя: 'Рыбн.'},
    {имя: 'Выручка сетов'}, {имя: 'Выкуп сетов'}, {имя: 'Свободно'}, {имя: 'У агента'}, {имя: 'Возвраты'},
    {имя: 'Билетов (каб.)'}, {имя: 'Придержано'}, {имя: 'Явка'}];   // 15.10.2026, Ал: «Ужинов» убрана — ужин в сетах
  // 15.10.2026, Ал: «Авторский ужин» = сеты к местам (разовая ошибка первых продаж) → в «Сетов» и «Выручка еды»
  const ужШ = s => (s.ужин && s.ужин.продано) || 0, ужР = s => (s.ужин && s.ужин.сумма) || 0;
  // 15.10.2026, Ал: выручка по каждому шоу — билеты + сеты + ужин (кабинет) + бар (iiko, чеки вечера показа)
  const естьБар = СОБ.some(s => s.iiko);
  if (естьБар) кол.push({имя: 'Бар', подсказка: 'Оплачено гостями в iiko за вечер показа (без сетов). Угощения — при наведении'},
    {имя: 'Выручка шоу', подсказка: 'Места + сеты (с ужином) из кабинета + бар (iiko)'});
  const выручкаШоу = s => s.места.сумма + s.еда.сумма + ((s.ужин && s.ужин.сумма) || 0) + (s.iiko ? s.iiko.бар : 0);
  const макс = Math.max(...СОБ.map(s => s.загрузка), 0.0001);
  const ряды = СОБ.map(s => ({
    класс: s.в_продаже ? '' : 'нет',
    ячейки: [
      `${s.дата} <span class="dim">${s.время}</span>` + (s.пометка ? `<span class="tag gold">${s.пометка}</span>` : '') + (s.отмена ? '<span class="tag down">отменён</span>' : прошёл(s) ? '<span class="tag">прошёл</span>' : s.в_продаже ? '' : '<span class="tag">не в продаже</span>'),
      ч(s.места.квота),
      (s.места.платно !== undefined ? s.места.платно : s.места.продано) ? ч(s.места.платно !== undefined ? s.места.платно : s.места.продано) : {класс: 'zero', html: '0'},
      s.места.пригл ? {класс: 'gold', html: ч(s.места.пригл)} : {класс: 'zero', html: '—'},
      бар(s.загрузка / макс, пр(s.загрузка, 1)),
      s.места.сумма ? р(s.места.сумма) : {класс: 'zero', html: '—'},
      s.места.продано ? ч(s.ср_цена) : {класс: 'zero', html: '—'},
      s.еда.продано + ужШ(s) ? ч(s.еда.продано + ужШ(s)) : {класс: 'zero', html: '0'},
      s.еда.мясное ? ч(s.еда.мясное) : {класс: 'zero', html: '—'},
      s.еда.рыбное ? ч(s.еда.рыбное) : {класс: 'zero', html: '—'},
      s.еда.сумма + ужР(s) ? р(s.еда.сумма + ужР(s)) : {класс: 'zero', html: '—'},
      s.места.продано ? пр(s.выкуп, 0) : {класс: 'zero', html: '—'},
      ч(s.места.свободно), s.места.агент ? ч(s.места.агент) : {класс: 'zero', html: '0'},
      s.места.возврат ? {класс: 'down', html: ч(s.места.возврат)} : {класс: 'zero', html: '0'},
      s.кабинет ? {html: ч(s.кабинет.итого_билетов), title: `в кабинете: показ ${s.кабинет.показ_билетов} + ужин ${s.кабинет.ужин_билетов} · ${р(s.кабинет.итого_сумма)}`} : {класс: 'zero', html: '—'},
      s.кабинет && s.кабинет.придержано_всего ? {html: ч(s.кабинет.придержано_всего), title: Object.entries(s.кабинет.придержано).map(([к, v]) => к + ': ' + v).join(', ')} : {класс: 'zero', html: '—'},
      s.кабинет && s.кабинет.явка ? {html: ч(s.кабинет.явка.пришло + s.кабинет.явка.пришло_по_приглашениям),
        title: `пришло по билетам ${s.кабинет.явка.пришло} из ${s.кабинет.явка.продано}, по приглашениям ${s.кабинет.явка.пришло_по_приглашениям} из ${s.кабинет.явка.приглашений}`} : {класс: 'zero', html: '—'},
      ...(естьБар ? [
        s.iiko ? {html: р(s.iiko.бар) + (s.iiko.смешано && s.iiko.смешано.length ? ' <span class="tag down">смешано</span>' : ''),
          title: `чеков ${s.iiko.чеков} · угощения ${р(s.iiko.угощения)} · окно ${s.iiko.окно}` + (s.iiko.смешано && s.iiko.смешано.length ? '\nв этот день ещё: ' + s.iiko.смешано.join('; ') : '')} : {класс: 'zero', html: '—'},
        s.iiko ? {html: '<b>' + р(выручкаШоу(s)) + '</b>'} : {класс: 'zero', html: '—'}] : []),
    ]}));
  const итог = [`ИТОГО ${И.событий_в_продаже} в продаже`, ч(И.квота), ч(И.платных !== undefined ? И.платных : И.продано), ч(И.за_ноль || 0), пр(И.платных !== undefined && И.квота ? И.платных / И.квота : И.загрузка, 1),
    р(И.сумма), ч(И.ср_цена_платных || И.ср_цена), ч(И.еды + (И.ужинов || 0)),
    ч(К.меню['Мясное меню'] || 0), ч(К.меню['Рыбное меню'] || 0),
    р(И.сумма_еды + (И.сумма_ужинов || 0)), пр(И.выкуп_платных !== undefined ? И.выкуп_платных : И.выкуп, 0), ч(И.свободно), ч(И.агент), ч(И.возврат),
    И.кабинет ? ч(И.кабинет.билетов) : '—', И.кабинет && И.кабинет.придержано !== undefined ? ч(И.кабинет.придержано) : '—', '',
    ...(естьБар ? [р(СОБ.reduce((a, s) => a + (s.iiko ? s.iiko.бар : 0), 0)), р(СОБ.filter(s => s.iiko).reduce((a, s) => a + выручкаШоу(s), 0))] : [])];
  p.append(таблица(кол, ряды, итог));
  const пл = s => s.места.платно !== undefined ? s.места.платно : s.места.продано;   // 14.10.2026: по платным
  const топ = [...В_ПРОДАЖЕ].sort((a, b) => пл(b) - пл(a))[0];
  const пусто = В_ПРОДАЖЕ.filter(s => !пл(s)).length;
  p.append(эл('div', 'note',
    `Лучший показ — <b>${топ.дата} ${топ.время}</b>: ${пл(топ)} платных мест на ${р(топ.места.сумма)}. ` +
    `Без единой платной продажи — <b>${пусто}</b> из ${И.событий_в_продаже} показов в продаже. ` +
    `Столбец «У агента» — места, отданные агенту: это ещё не продажа, но и не свободный остаток. ` +
    `«Придержано» — служебные квоты кабинета (Склад, «НЕ выводить в продажу»): их никто не продаёт. ` +
    `«Билетов (каб.)» — как считает кабинет: места + сеты + пригласительные. «Явка» — прошло по СКД.`));
}

/* ---------- 2. дни ---------- */
function график(точки, подписи, цвет, подпись) {
  const w = 100, h = 34, макс = Math.max(...точки), мин = Math.min(...точки, 0);
  const шаг = точки.length > 1 ? w / (точки.length - 1) : 0;
  const y = v => макс === мин ? h / 2 : h - 4 - (v - мин) / (макс - мин) * (h - 10);
  const d = точки.map((v, i) => `${i ? 'L' : 'M'}${(i * шаг).toFixed(2)},${y(v).toFixed(2)}`).join(' ');
  return `<div style="margin:6px 0 2px"><div style="color:#cfc8da;font-size:12px">${подпись}</div>
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:104px;overflow:visible">
      <path d="${d} L${w},${h} L0,${h} Z" fill="${цвет}" opacity=".13"/>
      <path d="${d}" fill="none" stroke="${цвет}" stroke-width="1" vector-effect="non-scaling-stroke"/>
      ${точки.map((v, i) => `<circle cx="${(i*шаг).toFixed(2)}" cy="${y(v).toFixed(2)}" r="1" fill="${цвет}"/>`).join('')}
    </svg>
    <div style="display:flex;justify-content:space-between;color:#f3dfb4;font-size:11px">
      <span>${подписи[0]}</span><span>${подписи[подписи.length-1]} · ${ч(точки[точки.length-1])}</span></div></div>`;
}
// 15.10.2026, Ал (вариант Д7): по неделям — сколько платных мест надо было продать по плану и сколько продали.
// План недели (16.10.2026, Ал: цель 276 = 100 %): каждый показ в продаже идёт к 276 платным ровно — от его первой продажи до его даты (как красная черта «План против факта»).
function неделиПротивПлана(p) {
  const ПН = D.по_неделям || {}, ПП = D.первая_продажа || {};
  if (!В_ПРОДАЖЕ.length) return;
  const клч = t => t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
  const пнд = t => { const x = new Date(t); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return клч(x); };
  const сег = new Date(D.сегодня + 'T00:00:00'), сегН = пнд(сег), цель = D.мест_в_зале, цельБУ = Math.round(D.мест_в_зале * D.цель_загрузки);
  const план = {}, планДо = {}, факт = {}, пригл = {};
  В_ПРОДАЖЕ.forEach(e => { const к = e.дата + ' ' + e.время;
    Object.entries(ПН[к] || {}).forEach(([н, [пл, пг]]) => { факт[н] = (факт[н] || 0) + пл; пригл[н] = (пригл[н] || 0) + пг; });
    if (!ПП[к]) return;
    const н0 = new Date(ПП[к] + 'T00:00:00'), дс = new Date(e.дата.split('.').reverse().join('-') + 'T00:00:00'), дл = Math.round((дс - н0) / 86400000) + 1;
    for (let t = new Date(н0); t <= дс; t.setDate(t.getDate() + 1)) { const н = пнд(t); план[н] = (план[н] || 0) + цель / дл; if (t <= сег) планДо[н] = (планДо[н] || 0) + цель / дл; } });
  const недели = [...new Set([...Object.keys(план), ...Object.keys(факт)])].sort();
  if (!недели.length) return;
  const дм = k => k.slice(8) + '.' + k.slice(5, 7);
  const долг = Math.round(недели.filter(н => н <= сегН).reduce((a, н) => a + (планДо[н] || 0) - (факт[н] || 0), 0));
  const W = 900, H = 220, шаг = (W - 60) / недели.length, мх = Math.max(...недели.map(н => Math.max(план[н] || 0, факт[н] || 0))) * 1.15, Y = v => 20 + H - v / мх * H;
  let g = `<svg width="${W}" height="${H + 84}">`;
  for (let v = 0; v <= мх; v += 100) g += `<line x1="40" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2a2338"/><text x="34" y="${Y(v) + 4}" font-size="10" fill="#f3dfb4" text-anchor="end">${v}</text>`;
  недели.forEach((н, i) => { const cx = 50 + i * шаг, w = шаг * 0.34, пл = Math.round(план[н] || 0), ф = факт[н] || 0, буд = н > сегН, пд = Math.round(планДо[н] || 0);
    g += `<rect x="${cx}" y="${Y(пл)}" width="${w}" height="${20 + H - Y(пл)}" fill="#b6ecc4" opacity="${буд ? .45 : 1}" rx="2"><title>${дм(н)}: план ${пл}</title></rect>` +
      (буд ? '' : `<rect x="${cx + w + 2}" y="${Y(ф)}" width="${w}" height="${20 + H - Y(ф)}" fill="#ff9a3c" rx="2"><title>${дм(н)}: продано платных ${ф}</title></rect>`) +
      `<text x="${cx + w / 2}" y="${Y(пл) - 4}" font-size="10" fill="#b6ecc4" text-anchor="middle">${пл}</text>` +
      (буд ? '' : `<text x="${cx + w + 2 + w / 2}" y="${Y(ф) - 4}" font-size="11" font-weight="700" fill="#efeaf4" text-anchor="middle">${ф}</text>`) +
      `<text x="${cx + w}" y="${H + 38}" font-size="11" fill="#cfc8da" text-anchor="middle">${дм(н)}</text>` +
      (буд ? `<text x="${cx + w}" y="${H + 53}" font-size="10" fill="#b6ecc4" text-anchor="middle">впереди</text>`
        : `<text x="${cx + w}" y="${H + 53}" font-size="10" fill="${ф >= пд ? '#57c98a' : '#ff5a5a'}" text-anchor="middle">${ф >= пд ? '+' : '−'}${Math.abs(ф - пд)}${н === сегН ? ' к сегодня' : ''}</text>`) +
      (пригл[н] ? `<text x="${cx + w}" y="${H + 68}" font-size="10" fill="#ffd0a1" text-anchor="middle">+${пригл[н]} пригл.</text>` : ''); });
  g += '</svg>';
  p.append(эл('h3', '', 'Неделя: продали против плана'),
    эл('div', 'hint', `<span style="color:#b6ecc4">■</span> план недели — сколько платных мест надо было продать, чтобы каждый из ${В_ПРОДАЖЕ.length} показов в продаже ровно дошёл до цели ${цель} — 100 % бизнес-плана (от его первой продажи до его даты; безубыточность — ${цельБУ}) · ` +
      `<span style="color:#ff9a3c">■</span> продано платных на эти показы · снизу — отклонение от плана и <span style="color:#ffd0a1">пригласительные</span> (в план не идут). ` +
      `Накопленный недобор на сегодня — <b style="color:${долг > 0 ? '#ff5a5a' : '#57c98a'}">${долг > 0 ? '−' : '+'}${ч(Math.abs(долг))}</b> мест; бледные — недели впереди.`),
    эл('div', 'scroll', g));
}

function панельДней(p) {
  p.append(эл('h2', '', 'Продажи по дням, включая сеты'),
    эл('div', 'hint', 'Реальные даты продажи каждого билета — вся история с открытия продаж, а не суточные снимки.'));
  неделиПротивПлана(p);   // 15.10.2026, Ал (вариант Д7): вместо трёх мини-графиков — неделя: продали против плана
  const кол = [{имя: 'День продаж', числовая: false}, {имя: 'Мест'}, {имя: 'Выручка мест'}, {имя: 'Сетов'},
    {имя: 'Выручка сетов'}, {имя: 'Возвраты'}, {имя: 'Мест всего'}, {имя: 'Выручка всего'}];
  const ряды = ДНИ.map(d => [
    d.дата, d.мест ? ч(d.мест) : {класс: 'zero', html: '0'},
    d.сумма ? р(d.сумма) : {класс: 'zero', html: '—'},
    d.еды ? ч(d.еды) : {класс: 'zero', html: '0'},
    d.сумма_еды ? р(d.сумма_еды) : {класс: 'zero', html: '—'},
    d.возвратов ? {класс: 'down', html: ч(d.возвратов)} : {класс: 'zero', html: '0'},
    ч(d.накоп_мест), р(d.накоп_сумма)]);
  p.append(таблица(кол, ряды));
  // 15.10.2026 (аудит): по платным — блоки пригласительных (11.10: 355 «мест») не продажи
  const пД = d => d.платных !== undefined ? d.платных : d.мест;
  const лучший = [...ДНИ].sort((a, b) => пД(b) - пД(a))[0];
  const посл7 = ДНИ.slice(-7).reduce((a, d) => a + пД(d), 0) / Math.min(7, ДНИ.length);
  p.append(эл('div', 'note',
    `Лучший день по платным — <b>${лучший.дата}</b>: ${пД(лучший)} платных мест на ${р(лучший.сумма)}. ` +
    `Последние 7 дней — <b>${посл7.toFixed(1).replace('.', ',')}</b> платных места в сутки, ` +
    `это ${(посл7 / И.событий_в_продаже).toFixed(2).replace('.', ',')} на показ в продаже. ` +
    `Сколько нужно, чтобы выйти на цель 100 % (${D.мест_в_зале} на показ) и на безубыточность (${Math.round(D.мест_в_зале * D.цель_загрузки)}), — во вкладке «Прогноз и темп продаж».`));
}

/* ---------- 3. цены ---------- */
let режим = 'продано';
function панельЦен(p) {
  p.append(эл('h2', '', 'Разбивка по событиям и ценам'),
    эл('div', 'hint', 'Проданное по ценам — из выгрузки кабинета. Квота и остаток по ценам берутся из письма оператора: у непроданных билетов в выгрузке нет номинала.'));
  const sw = эл('div', 'switch');
  const режимы = [['продано', 'Продано'], ['сумма', 'Выручка']];
  if (ПИСЬМО) режимы.push(['квота', 'Квота'], ['свободно', 'Свободно']);
  режимы.forEach(([k, имя]) => { const b = эл('button', режим === k ? 'on' : '', имя);
    b.onclick = () => { режим = k; p.innerHTML = ''; панельЦен(p); }; sw.append(b); });
  p.append(sw);

  const изПисьма = {};
  if (ПИСЬМО) ПИСЬМО.показы.forEach(s => { изПисьма[s.дата + ' ' + s.время] = s; });
  const цены = [...new Set([].concat(
    ...СОБ.map(e => e.цены.map(c => c.цена)),
    ...(ПИСЬМО ? ПИСЬМО.показы.map(s => s.цены.map(c => c.цена)) : [])))].sort((a, b) => a - b);
  const изПисьмаРежим = режим === 'квота' || режим === 'свободно';
  const строки = изПисьмаРежим ? СОБ.filter(e => изПисьма[e.дата + ' ' + e.время]) : СОБ;

  const значение = (e, ц) => {
    if (изПисьмаРежим) {
      const s = изПисьма[e.дата + ' ' + e.время]; if (!s) return 0;
      const c = s.цены.find(x => x.цена === ц); return c ? c[режим] : 0;
    }
    const c = e.цены.find(x => x.цена === ц); return c ? c[режим] : 0;
  };
  const макс = Math.max(...строки.map(e => Math.max(...цены.map(ц => значение(e, ц)))), 1);
  const кол = [{имя: 'Показ', числовая: false}, ...цены.map(c => ({имя: ч(c)})), {имя: 'Итого'}, {имя: 'Сеты'}];
  const ряды = строки.map(e => ({
    класс: e.в_продаже ? '' : 'нет',
    ячейки: [
      `${e.дата} <span class="dim">${e.время}</span>`,
      ...цены.map(ц => { const v = значение(e, ц);
        if (!v) return {класс: 'zero', html: '—'};
        const a = (0.10 + 0.55 * v / макс).toFixed(2);
        return {html: `<span style="background:rgba(255,47,109,${a});padding:2px 7px;border-radius:5px">` +
                      `${режим === 'сумма' ? р(v) : ч(v)}</span>`}; }),
      режим === 'сумма' ? р(e.места.сумма) : ч(цены.reduce((a, ц) => a + значение(e, ц), 0)),
      {класс: 'gold', html: режим === 'сумма' ? р(e.еда.сумма) : ч(e.еда[режим === 'квота' ? 'квота' : режим === 'свободно' ? 'свободно' : 'продано'])},
    ]}));
  const по = ц => строки.reduce((a, e) => a + значение(e, ц), 0);
  const итог = ['ИТОГО', ...цены.map(ц => режим === 'сумма' ? р(по(ц)) : ч(по(ц))),
    режим === 'сумма' ? р(строки.reduce((a, e) => a + e.места.сумма, 0)) : ч(цены.reduce((a, ц) => a + по(ц), 0)),
    режим === 'сумма' ? р(строки.reduce((a, e) => a + e.еда.сумма, 0))
      : ч(строки.reduce((a, e) => a + e.еда[режим === 'квота' ? 'квота' : режим === 'свободно' ? 'свободно' : 'продано'], 0))];
  p.append(таблица(кол, ряды, итог));

  const прод = цены.map(ц => ({ц, n: СОБ.reduce((a, e) => a + ((e.цены.find(c => c.цена === ц) || {}).продано || 0), 0)}));
  const топ = [...прод].filter(x => x.ц > 0).sort((a, b) => b.n - a.n).slice(0, 3).filter(x => x.n);   // 15.10.2026: 0 ₽ — пригласительные
  const мёртвые = прод.filter(x => !x.n);
  p.append(эл('div', 'note',
    `Лучше всего уходят уровни <b>${топ.map(x => ч(x.ц) + ' ₽ (' + x.n + ')').join(', ')}</b>. ` +
    (мёртвые.length ? `Ни одной продажи на уровнях ${мёртвые.map(x => ч(x.ц)).join(', ')} ₽. ` : '') +
    (() => { const цП = И.ср_цена_платных || И.ср_цена, пП = И.платных || И.продано, чек = цП + И.сумма_еды / Math.max(1, пП);   // 15.10.2026 (аудит): по платным, как шапка
    return !D.цена_места_в_модели ? `Средняя цена платного места — <b>${ч(цП)} ₽</b>, с сетом средний чек <b>${ч(чек)} ₽</b>.` :
    `Средняя цена платного места — <b>${ч(цП)} ₽</b> против ${ч(D.цена_места_в_модели)} ₽ в модели: ` +
    `на ${ч(И.квота)} мест блока это разница в <b>${р((D.цена_места_в_модели - цП) * И.квота)}</b> при полной продаже. ` +
    `Сет сюда не входит ни в факте, ни в модели: зритель платит две отдельные позиции, ` +
    `${ч(D.цена_места_в_модели)} за место и ${ч(D.цена_сета_в_модели)} за сет, полный билет ${ч(D.цена_билета_в_модели)} ₽. ` +
    `С сетом средний чек выходит <b>${ч(чек)} ₽</b> — сравнивать его нужно с ${ч(D.цена_билета_в_модели)} ₽: ` +
    `разрыв ${р(D.цена_билета_в_модели - чек)} на место.`; })()));
}

/* ---------- 4. прогноз и темп ---------- */
function панельПрогноза(p) {
  // 16.10.2026, Ал: «переводи на цель 276» — цель 100 % (276 платных на показ), безубыточность (БУ) — второй отметкой
  const ЦЕЛЬ = 1, БУ = D.цель_загрузки || 249 / 276, ДЕНЬ = 86400000;
  const СЕГОДНЯ = new Date(D.сегодня + 'T00:00:00');
  const дата = s => new Date(s.split('.').reverse().join('-') + 'T00:00:00');
  const дробь = (x, z = 1) => x.toFixed(z).replace('.', ',');

  // темп: с начала продаж и в скользящих окнах — видно, ускоряемся мы или затухаем
  const днейПродаж = Math.round((дата(ДНИ[ДНИ.length-1].дата) - дата(ДНИ[0].дата)) / ДЕНЬ) + 1;
  // 15.10.2026 (аудит): темп — по ПЛАТНЫМ местам; блоки пригласительных промопоказов (264 + 270 + 270) давали «148,7 места/день»
  const плД = d => d.платных !== undefined ? d.платных : d.мест;
  const срез = n => ДНИ.slice(-n).reduce((a, d) => a + плД(d), 0) / Math.min(n, ДНИ.length);
  const темпВсего = ДНИ.reduce((a, d) => a + плД(d), 0) / днейПродаж, темп7 = срез(7), темп14 = срез(14);

  // по каждому показу: свой дедлайн и свой нужный темп. Суммарный нужный темп —
  // это сумма по показам, а не общая цель делённая на общий срок: у каждого показа
  // своя дата, и ближние съедают темп быстрее дальних.
  const строки = В_ПРОДАЖЕ.map(e => {
    const квота = e.места.квота, продано = e.места.продано;
    const цель = Math.round(D.мест_в_зале * ЦЕЛЬ), цельБУ = Math.round(D.мест_в_зале * БУ);   // 16.10.2026: цель 276, безубыточность 249
    const пригл = e.места.пригл || 0, платно = продано - пригл;   // 15.10.2026, Ал: пригласительные учитываем, но отдельно
    const нужно = Math.max(0, цель - платно), нужноБУ = Math.max(0, цельБУ - платно);   // пригласительные план не закрывают
    const дней = Math.max(0, Math.round((дата(e.дата) - СЕГОДНЯ) / ДЕНЬ));
    const нужныйТемп = дней > 0 ? нужно / дней : нужно, нужныйТемпБУ = дней > 0 ? нужноБУ / дней : нужноБУ;
    // 15.10.2026, Ал: прогноз по премьере (добор с того же дня до показа), а не «средний темп × дни» — покупают ближе к дате
    const ДК = докупка();
    const прогноз = Math.min(квота - пригл, ДК ? платно + ДК.добор(дней) : платно + (платно / днейПродаж) * дней);   // 16.10.2026: прогноз платных
    return {e, квота, продано, платно, пригл, цель, нужно, цельБУ, нужноБУ, нужныйТемпБУ, дней, нужныйТемп, прогноз, загр: прогноз / D.мест_в_зале,   // 15.10.2026: от плана 276, как цель 221 (было от квоты 301)
      // сравниваем платные с платными: в «Продано» есть пригласительные, у кривой премьеры — нет
      отст: ДК && дней > 0 && ДК.платные[e.дата + ' ' + e.время] != null ? ДК.платные[e.дата + ' ' + e.время] - ДК.было(дней) : null};
  }).sort((a, b) => a.дней - b.дней);

  const сум = f => строки.reduce((a, r) => a + f(r), 0);
  const квотаВ = сум(r => r.квота), проданоВ = сум(r => r.продано);
  const цельВ = сум(r => r.цель), нужноВ = сум(r => r.нужно);
  const нужныйТемпВ = сум(r => r.нужныйТемп), прогнозВ = сум(r => r.прогноз);
  const цельБУВ = сум(r => r.цельБУ), нужноБУВ = сум(r => r.нужноБУ), нужныйТемпБУВ = сум(r => r.нужныйТемпБУ);
  const разрыв = темп7 > 0 ? нужныйТемпВ / темп7 : 0;
  const хватитДней = темп7 > 0 ? нужноВ / темп7 : 0;

  p.append(эл('h2', '', 'Прогноз: сколько нужно продавать в день'),
    эл('div', 'hint', `Цель — 100 % бизнес-плана: ${ч(D.мест_в_зале)} платных на каждый показ; безубыточность — ${ч(Math.round(D.мест_в_зале * БУ))} (${пр(БУ, 0)}, модель КК с нашими затратами). ` +
      `У каждого показа своя дата, поэтому нужный темп считается по нему отдельно и суммируется: ` +
      `ближние показы «съедают» темп быстрее дальних. Дата отсчёта — ${D.сегодня.split('-').reverse().join('.')}.`));

  const kpi = эл('div', 'kpis');
  [['Нужно продавать', дробь(нужныйТемпВ) + ' <small>мест/день</small>',
    `чтобы каждый показ вышел на ${ч(D.мест_в_зале)} (100 %) · на безубыточность — ${дробь(нужныйТемпБУВ)} в день`],
   ['Продаём сейчас', дробь(темп7) + ' <small>платных мест/день</small>',
    `за 7 дней · за 14 дней ${дробь(темп14)} · с начала ${дробь(темпВсего)}`],
   ['Разрыв', разрыв ? '×' + дробь(разрыв) : '—',
    разрыв > 1 ? `нужно ускориться в ${дробь(разрыв)} раза` : 'темпа достаточно'],
   ['Осталось продать', ч(нужноВ) + ' <small>мест</small>',
    `до цели ${ч(цельВ)} (100 %) · до безубыточности ${ч(нужноБУВ)} · продано ${ч(проданоВ)} из квоты ${ч(квотаВ)}`],
   ['Прогноз по премьере', пр(прогнозВ / (D.мест_в_зале * строки.length), 1),
    `${ч(Math.round(прогнозВ))} платных против цели ${ч(цельВ)} · безубыточность ${ч(цельБУВ)}`],
   ['Хватит ли времени', темп7 > 0 ? ч(Math.ceil(хватитДней)) + ' <small>дней</small>' : '—',
    `столько нужно при нынешнем темпе на весь остаток`],
  ].forEach(([t, v, d]) => { const c = эл('div', 'kpi');
    c.append(эл('div', 't', t), эл('div', 'v', v), эл('div', 'd', d)); kpi.append(c); });
  p.append(kpi);

  // ── план против факта, накопительно ──
  // 15.10.2026, Ал: вместо двух графиков (разные шкалы, не сравнить) — одна полоса: продано / где надо быть сегодня / цель (вариант П3, бирюза + светло-жёлтый)
  // 15.10.2026, Ал «откуда эти цифры?»: продано и цель — по одним и тем же показам в продаже; «надо быть сегодня» — сумма ровных
  // линий каждого показа от его первой продажи до его даты (раньше: все места с начала против линии до ближайшего показа)
  const ПП = D.первая_продажа || {}, сегД = new Date(D.сегодня + 'T00:00:00');
  const дК = s => new Date(s.slice(6, 10) + '-' + s.slice(3, 5) + '-' + s.slice(0, 2) + 'T00:00:00');
  const фС = проданоВ, плС = Math.round(строки.reduce((a, r) => { const п = ПП[r.e.дата + ' ' + r.e.время];
    if (!п) return a;   // продаж ещё не было — линия не началась
    const н = new Date(п + 'T00:00:00'), прошло = (сегД - н) / ДЕНЬ + 1, всего = (дК(r.e.дата) - н) / ДЕНЬ + 1;
    return a + r.цель * Math.min(1, прошло / Math.max(1, всего)); }, 0)), отст = плС - фС;
  const плВ = строки.reduce((a, r) => a + r.платно, 0), приглВ = фС - плВ;
  const W3 = 860, X3 = v => Math.min(W3, v / Math.max(1, цельВ) * W3);
  p.append(эл('h2', '', 'План против факта'),
    эл('div', 'hint', `<span style="color:#9ee6d8">■</span> платные · <span style="color:#4fa596">■</span> пригласительные — на ${строки.length} показов в продаже · <span style="color:#f6e7a8">■</span> осталось до цели · ` +
      '<span style="color:#ff3b3b">красная черта</span> — где надо быть сегодня, если каждый показ идёт к своей цели ровно: от его первой продажи до его даты. ' +
      `Цель — 100 % бизнес-плана: ${ч(D.мест_в_зале)} платных × ${строки.length} показов; <span style="color:#b98cff">фиолетовый пунктир</span> — безубыточность ${ч(цельБУВ)} (${пр(БУ, 0)}, модель КК с нашими затратами).`),
    эл('div', 'scroll', `<svg width="${W3 + 20}" height="112"><rect x="0" y="30" width="${W3}" height="34" fill="#f6e7a8" rx="6"/>` +
      `<rect x="0" y="30" width="${X3(фС)}" height="34" fill="#4fa596" rx="6"><title>пригласительные ${ч(приглВ)}</title></rect>` +
      `<rect x="0" y="30" width="${X3(плВ)}" height="34" fill="#9ee6d8" rx="6"><title>платные ${ч(плВ)}</title></rect>` +
      `<line x1="${X3(цельБУВ)}" x2="${X3(цельБУВ)}" y1="26" y2="68" stroke="#b98cff" stroke-width="3" stroke-dasharray="6 4"/>` +
      `<text x="${X3(цельБУВ) - 6}" y="104" font-size="12" font-weight="700" fill="#b98cff" text-anchor="end">безубыточность ${ч(цельБУВ)}</text>` +
      `<line x1="${X3(плС)}" x2="${X3(плС)}" y1="22" y2="72" stroke="#ff3b3b" stroke-width="3"/>` +
      `<text x="${Math.max(120, X3(фС) - 8)}" y="53" font-size="15" font-weight="700" fill="#10302b" text-anchor="end">${ч(фС)} · ${пр(фС / Math.max(1, цельВ), 0)}</text>` +
      `<text x="${X3(плС) - 6}" y="16" font-size="12" fill="#efeaf4" text-anchor="end">надо быть сегодня: ${ч(плС)}</text>` +
      `<text x="${W3}" y="88" font-size="12" font-weight="700" fill="#f0c34e" text-anchor="end">цель 100 % ${ч(цельВ)}</text>` +
      `<text x="${W3 / 2}" y="88" font-size="12" fill="#efeaf4" text-anchor="middle">платные ${ч(плВ)} · пригласительные ${ч(приглВ)}</text>` +
      `<text x="0" y="88" font-size="12" fill="${отст > 0 ? '#ff5a5a' : '#57c98a'}">${отст > 0 ? 'отстаём на ' + ч(отст) + ' мест' : 'идём с опережением на ' + ч(-отст) + ' мест'}</text></svg>`));

  // ── таблица по показам ──
  пригласительныеПротивПлана(p, строки);   // 15.10.2026, Ал: лимит пригласительных по бизнес-плану
  столбикиПрогноза(p, строки, D.мест_в_зале);   // 16.10.2026: цель 276; безубыточность — внутри функции
  p.append(эл('h2', '', 'По каждому показу'),
    эл('div', 'hint', 'Отсортировано по близости даты. «Нужный темп» — сколько мест в день должен ' +
      'набирать именно этот показ начиная с сегодня. Цель, «Не хватает», «Нужный темп», «Прогноз» и «Успеваем» — только по платным местам: ' +
      'пригласительные план не закрывают. «Прогноз» — платные сейчас + сколько платных мест премьера добрала ' +
      'с того же дня до показа. «К премьере» — больше (+) или меньше (−) мест, чем было у премьеры за столько же дней (платные).'));
  const лимП = лимитПриглНаШоу();   // 16.10.2026, Ал (вариант В): null в партнёрской версии
  const кол = [{имя: 'Показ', числовая: false}, {имя: 'Дней до'}, {имя: 'Квота'}, {имя: 'Продано', подсказка: 'Все места: платные + пригласительные'}, {имя: 'Платные'}, {имя: 'Пригл.', подсказка: 'Пригласительные за 0 ₽'},
    ...(лимП != null ? [{имя: 'Пригл. сверх лимита', подсказка: `Лимит пригласительных по бизнес-плану — ${лимП} на шоу (блок «Пригласительные против бизнес-плана»)`}] : []),
    {имя: 'Цель 100 %', подсказка: `${ч(D.мест_в_зале)} платных на показ — бизнес-план`}, {имя: 'Не хватает', подсказка: `Платных мест до цели ${ч(D.мест_в_зале)}`}, {имя: `До безуб. ${Math.round(БУ * 100)} %`, подсказка: `Платных мест до безубыточности ${Math.round(D.мест_в_зале * БУ)} (модель КК с нашими затратами)`}, {имя: 'Нужный темп', подсказка: 'Платных мест в день'}, {имя: 'Прогноз', подсказка: 'Платные места к дню показа'},
    {имя: 'К премьере', подсказка: 'Платные места показа минус платные места премьеры за столько же дней до показа'},
    {имя: 'Загрузка прогноза', подсказка: `Прогноз платных ÷ ${D.мест_в_зале} мест по бизнес-плану (безубыточность ${Math.round(БУ * 100)} % = ${Math.round(D.мест_в_зале * БУ)})`}, {имя: 'Успеваем', числовая: false, подсказка: 'да — прогноз дотягивает до цели 276; к безуб. — только до безубыточности; нет — ни до того, ни до другого'}];
  const максТемп = Math.max(...строки.map(r => r.нужныйТемп), 0.0001);
  const ряды = строки.map(r => {
    const успеваем = r.прогноз >= r.цель, кБУ = r.прогноз >= r.цельБУ;
    return {класс: успеваем || кБУ ? '' : 'warn', ячейки: [
      {класс: 'nowrap', html: `${r.e.дата} <span class="dim">${r.e.время}</span>`},
      ч(r.дней), ч(r.квота), ч(r.продано), ч(r.платно), r.пригл ? ч(r.пригл) : {класс: 'zero', html: '0'},
      ...(лимП != null ? [r.пригл > лимП ? {класс: 'down', html: '+' + ч(r.пригл - лимП)} : {класс: 'zero', html: '—'}] : []),
      ч(r.цель), ч(r.нужно), r.нужноБУ ? ч(r.нужноБУ) : {класс: 'up', html: '✓'},
      бар(r.нужныйТемп / максТемп, дробь(r.нужныйТемп)),
      ч(Math.round(r.прогноз)),
      r.отст == null ? '—' : {класс: r.отст >= 0 ? 'up' : 'down', html: (r.отст >= 0 ? '+' : '−') + ч(Math.abs(r.отст))},
      пр(r.загр, 1),
      {класс: успеваем ? 'up' : кБУ ? 'gold' : 'down', html: успеваем ? 'да' : кБУ ? 'к безуб.' : 'нет'}]};
  });
  const сверхВ = лимП != null ? сум(r => Math.max(0, r.пригл - лимП)) : 0;
  p.append(таблица(кол, ряды, ['ИТОГО', '', ч(квотаВ), ч(проданоВ), ч(сум(r => r.платно)), ч(сум(r => r.пригл)),
    ...(лимП != null ? [сверхВ ? '+' + ч(сверхВ) : '—'] : []), ч(цельВ), ч(нужноВ), ч(нужноБУВ),
    дробь(нужныйТемпВ), ч(Math.round(прогнозВ)), '', пр(прогнозВ / (D.мест_в_зале * строки.length), 1), '']));

  // ── эффект рекламных кампаний ──
  const среднийДень = ДНИ.reduce((a, d) => a + плД(d), 0) / ДНИ.length;   // 15.10.2026 (аудит): по платным, как темп
  p.append(эл('h2', '', 'Что дают рекламные кампании'),
    эл('div', 'hint', `Средний день даёт ${дробь(среднийДень)} платных мест. Всплеск — день, где платные продажи ` +
      `в полтора раза выше среднего: такие дни и есть след сработавшей рекламы. ` +
      `Сравнивайте даты запуска кампаний с этими пиками.`));
  const колД = [{имя: 'День', числовая: false}, {имя: 'Мест'}, {имя: 'Выручка'},
    {имя: 'К среднему'}, {имя: 'Накоплено'}, {имя: 'Отметка', числовая: false}];
  const рядыД = [...ДНИ].reverse().map(d => {
    const отн = среднийДень > 0 ? плД(d) / среднийДень : 0;
    const всплеск = отн >= 1.5, тихо = плД(d) === 0;
    return {класс: всплеск ? 'good' : '', ячейки: [
      {класс: 'nowrap', html: d.дата}, d.мест !== плД(d) ? {html: `${ч(плД(d))} <span class="dim">+${ч(d.мест - плД(d))} пригл.</span>`} : ч(d.мест), р(d.сумма),
      {класс: отн >= 1 ? 'up' : 'down', html: '×' + дробь(отн)},
      ч(d.накоп_мест),
      {класс: всплеск ? 'up' : (тихо ? 'down' : 'dim'),
       html: всплеск ? 'всплеск' : (тихо ? 'ноль' : '')}]};
  });
  p.append(таблица(колД, рядыД));

  // ── горизонт всего проекта ──
  const цельПроекта = D.показов_по_договору * D.мест_в_зале * ЦЕЛЬ;
  const неОткрыто = D.показов_по_договору - И.событий_в_продаже;
  p.append(эл('h2', '', 'Горизонт всего проката'),
    эл('div', 'hint', 'Выше — только показы, уже открытые в продажу. По договору их ' +
      `${ч(D.показов_по_договору)}, зал ${ч(D.мест_в_зале)} мест.`));
  const колГ = [{имя: 'Показатель', числовая: false}, {имя: 'Значение'}, {имя: 'Комментарий', числовая: false}];
  p.append(таблица(колГ, [
    ['Цель по всему прокату', ч(Math.round(цельПроекта)) + ' мест',
     `${ч(D.показов_по_договору)} показов × ${ч(D.мест_в_зале)} × ${пр(ЦЕЛЬ, 0)}`],
    ['Безубыточность проката', ч(Math.round(D.показов_по_договору * D.мест_в_зале * БУ)) + ' мест',   // 16.10.2026: модель КК с нашими затратами
     `${ч(D.показов_по_договору)} показов × ${ч(Math.round(D.мест_в_зале * БУ))} (${пр(БУ, 0)})`],
    ['Продано платных', ч(И.платных !== undefined ? И.платных : И.продано) + ' мест', пр((И.платных !== undefined ? И.платных : И.продано) / цельПроекта, 2) + ' от цели проката · пригласительные в план не идут'],
    ['Открыто в продажу', ч(И.событий_в_продаже) + ' показов',   // 15.10.2026 (аудит): было «заведено событий» (вкл. отменённые и промо)
     `не открыто ещё ${ч(неОткрыто)} — их квота в расчёте темпа не участвует`],
    ['Потенциал открытых показов', ч(квотаВ) + ' мест',
     `это ${пр(квотаВ / (D.показов_по_договору * D.мест_в_зале), 1)} всей ёмкости проката`],
  ]));
}

const ПОЯСНЕНИЯ = {
  фон: 'Фон — сколько мест в день продавалось без рекламы: среднее за 7 календарных дней до выхода, без дней других кампаний и всплесков.',
  в_дни: 'В дни выхода — места, проданные в сами дни публикации.',
  после: 'После — места в хвосте после выхода: рассылка и push +2 дня, контекст +1, остальное +3. Отложенный отклик.',
  сверх: 'Сверх фона — сколько мест добавила реклама: места за всё окно минус фон × дней окна. Если дни общие с другой кампанией — делятся поровну.',
  кратность: 'Кратность — во сколько раз продажи в окне выше фона. ×1 — как обычно, ×2 — вдвое больше.',
