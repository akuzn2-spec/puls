    эл('div', 'hint', `Бизнес-план: ${ч(шоу)} шоу × ${ч(М.зал)} мест в продаже, безубыточность — ${ч(М.цель)} гостей на шоу, и все они платят: ` +
      `пригласительных в модели нет. Один платный гость приносит место + сет от КК ${р(ЦЕНА_СЕТА_КК)} + бар ${р(ПЛАН_ЧЕК_БАРА)}; ` +
      `пригласительный — бар ${р(БАР_ПРИГЛ)} по плану (факт 15.10 по столам iiko — ${р(БАР_ПРИГЛ_ФАКТ_1510)}) и стоит нам ${р(ЗАТРАТЫ_ПРИГЛ)} (себестоимость сета и велком по модели). ` +
      `План в деньгах — ${р(М.деньгиПлан)} на шоу. ` +
      (промо.length ? `Промопоказы ${промо.map(e => e.дата.slice(0, 5)).join(' и ')} входят в ${шоу} шоу и прошли без платных гостей: их план — ${ч(промо.length * М.цель)} платных — ` +
        `добираем на остальных ${ч(шоу - промо.length)} шоу, это +${добор} платных на шоу и на столько же меньше пригласительных.` : '')));
  p.append(таблица([{имя: 'Цена места', числовая: false}, {имя: 'Платных на шоу', подсказка: 'Сколько платных гостей нужно на шоу, чтобы выйти на деньги безубыточности'},

    {имя: 'Сверх лимита'}, {имя: 'Сет и велком', подсказка: 'Пригласительные × (себестоимость сета 1 333 ₽ + велком 100 ₽) — за наш счёт'}],

    ['ИТОГО', ч(сейчас.reduce((a, r) => a + r.платно, 0)), ч(сумП), ч(лимФ * сейчас.length),
      сверх.length ? '+' + ч(сверх.reduce((a, r) => a + r.пригл - лимФ, 0)) : '—', р(сумП * ЗАТРАТЫ_ПРИГЛ)]));

    `Сейчас: ${ч(сумП)} пригласительных на ${сейчас.length} показов, в среднем ${String(Math.round(сумП / Math.max(1, сейчас.length) * 10) / 10).replace('.', ',')} на показ` +

function столбикиПрогноза(p, строки, цель) {
  const ДК = докупка();
  if (!ДК || !строки.length) return;
  const R = строки.map(r => ({м: r.e.дата.slice(0, 5), в: r.e.время, s: r.продано, пл: r.платно, пг: r.пригл, f: Math.round(r.прогноз) + r.пригл, fп: Math.round(r.прогноз)}));   // 16.10.2026: прогноз — платные
  const W = 900, ВH = 240, шаг = (W - 60) / R.length, макс = Math.ceil(Math.max(цель, ...R.map(r => r.f)) * 1.1 / 50) * 50, Y = v => ВH - v / макс * ВH;
  let g = `<svg width="${W}" height="${ВH + 58}"><g transform="translate(0,14)">`;
  for (let v = 0; v <= макс; v += 50) g += `<line x1="40" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2a2338"/><text x="34" y="${Y(v) + 4}" font-size="11" fill="#f3dfb4" text-anchor="end">${v}</text>`;
  R.forEach((r, i) => { const x = 50 + i * шаг + шаг * 0.2, w = Math.min(70, шаг * 0.6);
    g += `<rect x="${x}" y="${Y(r.f)}" width="${w}" height="${Math.max(0, Y(r.s) - Y(r.f))}" fill="#b6ecc4"><title>${r.м} ${r.в}: ожидаемый добор ${r.f - r.s}</title></rect>` +
      `<rect x="${x}" y="${Y(r.s)}" width="${w}" height="${Math.max(0, Y(r.пл) - Y(r.s))}" fill="#ffd0a1"><title>${r.м} ${r.в}: пригласительные ${r.пг}</title></rect>` +
      `<rect x="${x}" y="${Y(r.пл)}" width="${w}" height="${ВH - Y(r.пл)}" fill="#ff9a3c"><title>${r.м} ${r.в}: платные ${r.пл}</title></rect>` +
      `<text x="${x + w / 2}" y="${Y(r.f) - 6}" font-size="12" font-weight="700" fill="#efeaf4" text-anchor="middle">${r.fп}</text>` +
      (ВH - Y(r.пл) >= 16 ? `<text x="${x + w / 2}" y="${ВH - 6}" font-size="11" font-weight="700" fill="#1a1422" text-anchor="middle">${r.пл}</text>` : '') +
      (Y(r.пл) - Y(r.s) >= 10 ? `<text x="${x + w / 2}" y="${(Y(r.s) + Y(r.пл)) / 2 + 3.5}" font-size="10" font-weight="700" fill="#5a3410" text-anchor="middle">+${r.пг}</text>` : '') +
      `<text x="${x + w / 2}" y="${ВH + 16}" font-size="12" fill="#cfc8da" text-anchor="middle">${r.м}</text>` +
      `<text x="${x + w / 2}" y="${ВH + 30}" font-size="11" fill="#7d7590" text-anchor="middle">${r.в}</text>`; });
  const цБУ = Math.round(D.мест_в_зале * (D.цель_загрузки || 249 / 276));   // 16.10.2026: цель 276 — сплошная, безубыточность — пунктир
  g += `<line x1="40" x2="${W}" y1="${Y(цель)}" y2="${Y(цель)}" stroke="#f0c34e" stroke-width="2"/><text x="${W - 4}" y="${Y(цель) - 6}" font-size="11" font-weight="700" fill="#f0c34e" text-anchor="end">цель 100 % · ${цель}</text>` +
    `<line x1="40" x2="${W}" y1="${Y(цБУ)}" y2="${Y(цБУ)}" stroke="#b98cff" stroke-width="2" stroke-dasharray="6 4"/><text x="${W - 4}" y="${Y(цБУ) + 14}" font-size="11" font-weight="700" fill="#b98cff" text-anchor="end">безубыточность ${Math.round(D.цель_загрузки * 100)} % · ${цБУ}</text></g></svg>`;
  p.append(эл('h2', '', `Дойдёт ли показ до цели ${цель} (100 %) и до безубыточности`),
    эл('div', 'hint', '<span style="color:#ff9a3c">■</span> платные (цифра внизу) · <span style="color:#ffd0a1">■</span> пригласительные (+N) · <span style="color:#b6ecc4">■</span> ожидаемый добор — сколько платных мест премьера ' +
      ДК.эталон.s.дата.slice(0, 5) + ` (${ДК.итого}) добрала с того же дня до показа; цифра сверху — прогноз платных мест. Золотая линия — цель 100 % (${цель} платных); <span style="color:#b98cff">фиолетовый пунктир</span> — безубыточность (модель КК с нашими затратами): ${Math.round(D.цель_загрузки * 100)} % = ${Math.round(D.мест_в_зале * D.цель_загрузки)}.`),
    эл('div', 'scroll', g));

// 15.10.2026, Ал (шаг 2 «Как покупают»): тепловая карта «день недели × час покупки» по каналам

  const Т = D.тепло || {};

  const ИМЕНА = {'Все': 'Все каналы', 'Афиша': 'Яндекс Афиша', 'womanmusical.ru': 'виджет КК (womanmusical.ru)',
    'metelitsaclub1.ru': 'наш виджет (metelitsaclub1.ru)', 'Афиша.ру': 'Афиша.ру', 'Кассир': 'Кассир'};
  const дни = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'], часы = [...Array(24).keys()];
  const сум = м => м.flat().reduce((a, v) => a + v, 0);
  const каналы = Object.keys(Т).filter(к => сум(Т[к]) > 0);
  // 15.10.2026, Ал: вместо тепловой карты «день × час» — 10 лучших окон по 3 часа (вариант Т3)
  p.append(эл('h3', '', 'Когда покупают — 10 лучших окон по 3 часа'),
    эл('div', 'hint', '<span style="color:#ff9a3c">■</span> три лучших окна · <span style="color:#b6ecc4">■</span> следующие семь. ' +
      'Платные места (включая позже возвращённые — момент покупки был) по времени покупки, МСК; окна в один день не пересекаются. ' +

  const рис = к => {
    const м = Т[к], всего = сум(м);
    кн.querySelectorAll('.ткн').forEach(b => b.classList.toggle('on', b.dataset.k === к));
    // лучшие окна по 3 часа (без пересечений в один день)
    const окна = [];
    м.forEach((ряд, д) => часы.slice(0, 22).forEach(ч => окна.push({д, ч, v: ряд[ч] + ряд[ч + 1] + ряд[ч + 2]})));

        `<rect x="150" y="${y}" width="${w}" height="20" fill="${i < 3 ? '#ff9a3c' : '#b6ecc4'}" rx="3"><title>${дни[о.д]} ${о.ч}:00–${о.ч + 3}:00 · ${ИМЕНА[к]}: ${о.v} мест</title></rect>` +
        `<text x="${156 + w}" y="${y + 15}" font-size="12" font-weight="700" fill="#efeaf4">${о.v} мест · ${пр(о.v / Math.max(1, всего), 0)}</text>`; });
    поле.innerHTML = g + '</svg>';
    const доля = (a, b) => м.reduce((s, r) => s + r.slice(a, b).reduce((x, v) => x + v, 0), 0) / Math.max(1, всего);
    // 15.10.2026 (аудит): делим на число таких дней в периоде продаж, а не на 5 и 2
    let нБ = 0, нВ = 0; for (let д = new Date(ДНИ[0].ключ + 'T00:00:00'); д <= new Date(ДНИ[ДНИ.length - 1].ключ + 'T00:00:00'); д.setDate(д.getDate() + 1)) (д.getDay() % 6 ? нБ++ : нВ++);
    const будни = м.slice(0, 5).flat().reduce((a, v) => a + v, 0) / Math.max(1, нБ), вых = м.slice(5).flat().reduce((a, v) => a + v, 0) / Math.max(1, нВ);
    вывод.innerHTML = `<b>${ИМЕНА[к]}, ${ч(всего)} мест.</b> ` + (всего < 30 ? 'Мало покупок — окна неустойчивы, смотреть как намёк. ' : '') +
      `Утро 8–12 — ${пр(доля(8, 12), 0)}, день 12–18 — ${пр(доля(12, 18), 0)}, вечер 18–24 — ${пр(доля(18, 24), 0)}, ночь 0–8 — ${пр(доля(0, 8), 0)}. ` +
      `В среднем за один будний день ${String(Math.round(будни * 10) / 10).replace('.', ',')} мест, за один выходной ${String(Math.round(вых * 10) / 10).replace('.', ',')}.`;
  };
  if (каналы.length > 1) каналы.forEach(к => { const b = эл('button', 'ткн', `${ИМЕНА[к] || к} · ${ч(сум(Т[к]))}`); b.dataset.k = к; b.onclick = () => рис(к); кн.append(b); });

// 15.10.2026, Ал (шаг 3 «Как покупают»): размер компании — доля заказов против доли выручки + таблица
function размерКомпании(p) {
  const К0 = D.компании || {};
  const гр = [['1', n => n === 1, 'один'], ['2', n => n === 2, 'пара'], ['3', n => n === 3, 'трое'], ['4', n => n === 4, 'четверо'], ['5+', n => n >= 5, 'компания 5+']]
    .map(([м, f, имя]) => { const x = Object.entries(К0).filter(([n]) => f(+n)).reduce((a, [, v]) => [a[0] + v[0], a[1] + v[1], a[2] + v[2]], [0, 0, 0]);
      return {м, имя, з: x[0], мест: x[1], руб: x[2]}; });
  const З = гр.reduce((a, x) => a + x.з, 0), В = гр.reduce((a, x) => a + x.руб, 0), М = гр.reduce((a, x) => a + x.мест, 0);
  if (!З) return;
  const W = 900, ВH = 200, шаг = (W - 60) / гр.length, w = Math.min(60, шаг * 0.3), макс = Math.ceil(Math.max(...гр.map(x => Math.max(x.з / З, x.руб / В))) * 10) / 10, Y = v => ВH - v / макс * ВH;
  let g = `<svg width="${W}" height="${ВH + 56}"><g transform="translate(0,16)">`;
  for (let v = 0; v <= макс + 1e-9; v += 0.1) g += `<line x1="40" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2a2338"/><text x="34" y="${Y(v) + 4}" font-size="11" fill="#f3dfb4" text-anchor="end">${Math.round(v * 100)}%</text>`;
  гр.forEach((x, i) => { const cx = 50 + i * шаг + шаг / 2;
    [[x.з / З, '#ff9a3c', 'заказов', -w - 3], [x.руб / В, '#b6ecc4', 'выручки', 3]].forEach(([v, ц, что, dx]) => {
      g += `<rect x="${cx + dx}" y="${Y(v)}" width="${w}" height="${ВH - Y(v)}" fill="${ц}"><title>${x.м} мест: ${пр(v, 0)} ${что}</title></rect>` +
        `<text x="${cx + dx + w / 2}" y="${Y(v) - 6}" font-size="12" font-weight="700" fill="#efeaf4" text-anchor="middle">${пр(v, 0)}</text>`; });
    g += `<text x="${cx}" y="${ВH + 18}" font-size="12" fill="#cfc8da" text-anchor="middle">${x.м} ${x.м === '1' ? 'место' : 'места'}</text>` +
      `<text x="${cx}" y="${ВH + 32}" font-size="11" fill="#7d7590" text-anchor="middle">${x.имя}</text>`; });
  g += '</g></svg>';
  p.append(эл('h3', '', 'Размер компании — сколько заказов и сколько денег'),
    эл('div', 'hint', '<span style="color:#ff9a3c">■</span> доля заказов · <span style="color:#b6ecc4">■</span> доля выручки за билеты. ' +
      `Все платные заказы, включая позже возвращённые: ${ч(З)} заказов, ${ч(М)} мест, ${р(В)}.`), эл('div', 'scroll', g));
  p.append(таблица([{имя: 'Мест в заказе', числовая: false}, {имя: 'Заказов'}, {имя: 'Мест'}, {имя: 'Выручка'},
    {имя: 'Ср. заказ'}, {имя: 'Ср. цена места', подсказка: 'Выручка ÷ места: дороже — значит, берут лучшие столы'}, {имя: 'Доля выручки'}],
    гр.map(x => [{html: `${x.м} <span class="dim">${x.имя}</span>`}, ч(x.з), ч(x.мест), р(x.руб), р(x.руб / Math.max(1, x.з)),
      р(x.руб / Math.max(1, x.мест)), {html: '<b>' + пр(x.руб / В, 0) + '</b>'}]),
    ['ИТОГО', ч(З), ч(М), р(В), р(В / З), р(В / М), '100 %']));
  const пара = гр[1], от4 = гр.slice(3), от4з = от4.reduce((a, x) => a + x.з, 0), от4в = от4.reduce((a, x) => a + x.руб, 0), от4м = от4.reduce((a, x) => a + x.мест, 0);
  p.append(эл('div', 'note', `<b>Пары</b> — ${пр(пара.з / З, 0)} заказов и ${пр(пара.руб / В, 0)} выручки, место в среднем ${р(пара.руб / пара.мест)}. ` +
    `<b>Компании от 4 мест</b> — всего ${пр(от4з / З, 0)} заказов, но ${пр(от4в / В, 0)} выручки, место ${р(от4в / Math.max(1, от4м))}` +
    (от4в / Math.max(1, от4м) > пара.руб / пара.мест ? ' — дороже, чем у пар: берут столы получше. ' : '. ') +
    `<b>Один</b> — ${пр(гр[0].з / З, 0)} заказов, ${пр(гр[0].руб / В, 0)} выручки. Один заказ компании 4+ приносит как ${(от4в / Math.max(1, от4з) / (пара.руб / пара.з)).toFixed(1).replace('.', ',')} заказа пары.`));

function профильКаналов(p) {
  const П0 = D.профиль;

  const ИМЕНА = {'Афиша': 'Яндекс Афиша', 'womanmusical.ru': 'виджет КК (womanmusical.ru)', 'metelitsaclub1.ru': 'наш виджет (metelitsaclub1.ru)',
    'Афиша.ру': 'Афиша.ру', 'Кассир': 'Кассир', 'Все': 'ВСЕ КАНАЛЫ'};
  const м = y => y.дни[Math.floor(y.дни.length / 2)];

function панельЗапросов(p) {
  const З = D.запросы || [], сег = D.сегодня;
  const срок = s => s && s.length === 10 ? s.slice(6) + '-' + s.slice(3, 5) + '-' + s.slice(0, 2) : '';
  const просрочен = z => ['ждём', 'не отправлено'].includes(z.статус) && срок(z.срок) && срок(z.срок) < сег;
  const счёт = {}; З.forEach(z => { счёт[z.статус] = (счёт[z.статус] || 0) + 1; });
  const просроч = З.filter(просрочен).length;
  p.append(эл('h2', '', 'Запросы партнёрам'),
    эл('div', 'hint', 'Что мы запросили у Яндекса, Красного Квадрата и у себя, чтобы научиться продавать самим. ' +
      'Правится в файле <code>отчёты-продаж/запросы-партнёрам.csv</code> (статусы: не отправлено, ждём, получено, отказ).'));
  p.append(эл('div', 'note', Object.entries(счёт).map(([k, v]) => `${k}: <b>${v}</b>`).join(' · ') +
    (просроч ? ` · <span class="down">просрочено: <b>${просроч}</b></span>` : '')));
  const цвет = {получено: 'up', отказ: 'down', ждём: 'gold', 'не отправлено': 'dim'};
  const ряды = З.map(z => ({класс: просрочен(z) ? 'prosr' : '', ячейки: [
    z.дата_запроса, z.кому, z.что, {класс: 'dim', html: z.зачем || ''},
    просрочен(z) ? {класс: 'down', html: z.срок + ' · просрочен'} : (z.срок || ''),
    {класс: цвет[z.статус] || '', html: z.статус || ''}, z.ответ || '']}));
  p.append(таблица([{имя: 'Дата', числовая: false}, {имя: 'Кому', числовая: false}, {имя: 'Что', числовая: false},
    {имя: 'Зачем', числовая: false}, {имя: 'Срок', числовая: false}, {имя: 'Статус', числовая: false},
    {имя: 'Ответ', числовая: false}], ряды));
  p.lastChild.classList.add('txt');           // текстовая таблица: влево и с переносом, иначе колонки уезжают
}

const прошёл = s => { const [д, м, г] = s.дата.split('.'); const т = new Date(); т.setHours(0, 0, 0, 0); return new Date(+г, +м - 1, +д) < т; };
function панельКаналов(p) {
  p.append(эл('h2', '', 'Каналы по показам — как в кабинете'),

      'в скобках — из них мест. Пригласительные — билеты по 0 ₽. Авторский ужин — отдельное событие на ту же дату.'));
  const сКаб = СОБ.filter(s => s.кабинет && s.кабинет.каналы && !s.отмена && (s.в_продаже || прошёл(s)));
  if (!сКаб.length) { p.append(эл('div', 'note', 'Отчёты по событиям ещё не собраны.')); return; }
  const все = {}; сКаб.forEach(s => Object.entries(s.кабинет.каналы).forEach(([к, x]) => { все[к] = (все[к] || 0) + x.мест + x.сетов; }));
  const имена = Object.keys(все).filter(к => все[к] > 0).sort((a, b) => все[b] - все[a]);   // каналы без продаж не показываем
  const коротко = к => к.replace(/\[\d+\/\d+\] Субагент: /, '').replace(/ — МД .*/, '')
    .replace('Яндекс Виджет (лендинг мероприятия)', 'Виджет лендинг').replace('Яндекс Виджет (сайт площадки)', 'Виджет сайт').replace('Яндекс Виджет', 'Виджет');
  const кол = [{имя: 'Показ', числовая: false}, ...имена.map(к => ({имя: коротко(к)})), {имя: 'Пригласит.'},
    {имя: 'Ужин'}, {имя: 'Итого билетов'}, {имя: 'Сумма'}, {имя: 'Мест (зрит.)'}, {имя: 'Придержано'}, {имя: 'Явка'}];
  const ряды = сКаб.map(s => { const к = s.кабинет; return {
    класс: прошёл(s) ? 'нет' : '',
    ячейки: [`${s.дата} <span class="dim">${s.время}</span>` + (прошёл(s) ? '<span class="tag">прошёл</span>' : ''),
      ...имена.map(и => { const x = к.каналы[и]; return x && (x.мест + x.сетов) ? {html: `${ч(x.мест + x.сетов)} <span class="dim">(${ч(x.мест)})</span>`, title: `${x.мест} мест + ${x.сетов} сетов · ${р(x.сумма)}`} : {класс: 'zero', html: '—'}; }),
      (к.приглашения.мест + к.приглашения.сетов) ? {html: `${ч(к.приглашения.мест + к.приглашения.сетов)} <span class="dim">(${ч(к.приглашения.мест)})</span>`} : {класс: 'zero', html: '—'},
      к.ужин_билетов ? ч(к.ужин_билетов) : {класс: 'zero', html: '—'},
      {html: `<b>${ч(к.итого_билетов)}</b>`}, р(к.итого_сумма), ч(s.места.продано),
      к.придержано_всего ? ч(к.придержано_всего) : {класс: 'zero', html: '—'},
      к.явка ? ч(к.явка.пришло + к.явка.пришло_по_приглашениям) : {класс: 'zero', html: '—'}]}; });
  const ИК = И.кабинет || {каналы: {}};
  const итог = ['ИТОГО в продаже', ...имена.map(и => ИК.каналы[и] ? ч(ИК.каналы[и].мест + ИК.каналы[и].сетов) : '—'),

const ПАМЯТЬ = 'очмж_пароль_внутр';   // у каждой версии свой ключ: обе на одном домене и иначе затирали пароль друг другу
const СРОК = 30 * 24 * 60 * 60 * 1000;   // пароль помнится на устройстве месяц
const б64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
// 15.10.2026: учёт просмотров (кто из партнёров смотрит) — журнал на нашем хостинге, во внутренней версии вкладка «Кто смотрит».
// Устройство — случайный номер в браузере; «от» — имя из личной ссылки ?от=имя, запоминается на устройстве.
const ВЕРСИЯ = 'н', СЧЁТ = 'https://puls.metelitsaclub1.ru/v.php';
function устройство() {
  try { let d = localStorage.getItem('очмж_уст');
    if (!d) { d = Array.from(crypto.getRandomValues(new Uint8Array(3)), b => b.toString(16).padStart(2, '0')).join(''); localStorage.setItem('очмж_уст', d); }
    return d; } catch (e) { return ''; }
}
function кто() {
  try { const о = new URLSearchParams(location.search).get('от');
    if (о) { localStorage.setItem('очмж_от', о); return о; }
    return localStorage.getItem('очмж_от') || ''; } catch (e) { return ''; }
}
function отметить(событие) {
  try { const п = СЧЁТ + '?' + new URLSearchParams({e: событие, v: ВЕРСИЯ, o: кто(), d: устройство(), w: screen.width + 'x' + screen.height, h: location.hostname});
    if (!(navigator.sendBeacon && navigator.sendBeacon(п))) fetch(п, {mode: 'no-cors', keepalive: true}); } catch (e) {}
}
отметить('экран');
async function расшифровать(пароль) {
  const км = await crypto.subtle.importKey('raw', new TextEncoder().encode(пароль),
    'PBKDF2', false, ['deriveKey']);
  const ключ = await crypto.subtle.deriveKey(
    {name: 'PBKDF2', salt: б64(ШИФР.соль), iterations: ШИФР.итераций, hash: 'SHA-256'},
    км, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const открыто = await crypto.subtle.decrypt({name: 'AES-GCM', iv: б64(ШИФР.iv)},
    ключ, б64(ШИФР.данные));
  // 10.10.2026: данные сжаты gzip до шифрования (шифротекст не сжимается) — 1,9 МБ → ~0,1 МБ
  if (ШИФР.сжато === 'gzip') {
    const поток = new Blob([открыто]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(поток).text());
  }
  return JSON.parse(new TextDecoder().decode(открыто));
}

// Пароль лежит только в браузере того, кто его ввёл: на сервер не уходит,
// другим устройствам не виден. Через месяц отчёт спросит его снова.
function запомнить(пароль) {
  try { localStorage.setItem(ПАМЯТЬ, JSON.stringify({п: пароль, до: Date.now() + СРОК})); } catch (e) {}
}
function вспомнить() {
  try {
    const с = JSON.parse(localStorage.getItem(ПАМЯТЬ) || 'null');
    if (с && с.до > Date.now() && с.п) return с.п;
    localStorage.removeItem(ПАМЯТЬ);
  } catch (e) {}
  return null;
}
function забыть() { try { localStorage.removeItem(ПАМЯТЬ); } catch (e) {} }

async function войти(пароль, авто) {
  применитьДанные(await расшифровать(пароль));
  document.getElementById('lock').remove();
  // ключ чтения журнала просмотров — SHA-256 пароля внутренней версии (на сервер уходит только он)
  if (ВЕРСИЯ === 'н') window.КЛЮЧ_ПРОСМОТРОВ = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',
    new TextEncoder().encode(пароль))), b => b.toString(16).padStart(2, '0')).join('');
  запустить();
  отметить(авто ? 'авто' : 'вход');
}

// 09.10.2026: страница ~2,5 МБ, обработчик — в конце. Пока он не подключён, кнопка неактивна,
// а ранний Enter не перезагружает страницу (onsubmit="return false" в форме).
{ const кн0 = document.getElementById('go'); кн0.disabled = false; кн0.style.opacity = ''; кн0.textContent = 'Открыть'; }
document.getElementById('lockform').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = document.getElementById('err'), кн = document.getElementById('go');
  if (!window.crypto || !crypto.subtle) {
    err.textContent = 'Браузер не даёт расшифровать: откройте отчёт по ссылке https, а не как файл.';
    return;
  }
  err.textContent = ''; кн.disabled = true; кн.textContent = 'Расшифровываю…';
  // 26.09.2026: пароль «не подходил» — прощаем пробелы при копировании и русскую раскладку
  const введено = document.getElementById('pw').value;
  const рус = 'йцукенгшщзхъфывапролджэячсмитьбю.ё', лат = "qwertyuiop[]asdfghjkl;'zxcvbnm,./`";
  const вЛат = s => [...s].map(c => { const i = рус.indexOf(c.toLowerCase()); return i < 0 ? c : лат[i]; }).join('');
  const варианты = [...new Set([введено, введено.trim(), вЛат(введено.trim())])];
  try {
    let вошли = false;
    for (const пароль of варианты) {
      try { await войти(пароль); запомнить(пароль); вошли = true; break; } catch (e) {}
    }
    if (!вошли) throw new Error('пароль');
  } catch (e) {
    забыть();
    err.textContent = 'Неверный пароль';
    кн.disabled = false; кн.textContent = 'Открыть';
    document.getElementById('pw').select();
  }
});

// Если пароль на этом устройстве уже вводили — открываем сразу, без вопросов.
(async () => {
  const сохранённый = вспомнить();
  if (!сохранённый || !window.crypto || !crypto.subtle) {
    document.getElementById('pw').focus();
    return;
  }
  const форма = document.getElementById('lockform');
  форма.style.visibility = 'hidden';
  try {
    await войти(сохранённый, true);
  } catch (e) {
    забыть();
    форма.style.visibility = '';
    document.getElementById('err').textContent = 'Пароль изменился — введите новый';
    document.getElementById('pw').focus();
  }
})();

<div id="свежесть" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:#ff2f6d;color:#fff;padding:11px 16px;font:600 14px/1.4 -apple-system,system-ui,sans-serif;

  <button onclick="location.reload(true)" style="background:#fff;color:#ff2f6d;border:0;border-radius:8px;
    padding:7px 14px;font:700 13px system-ui;cursor:pointer">Обновить</button>
</div>
<script>
const СБОРКА = '17.10.2026 14:49';
async function проверитьСвежесть() {
  try {
    // 10.10.2026: метка — в самом начале файла; читаем первые куски и обрываем загрузку,
    // а не качаем всю страницу заново (на медленном хостинге это тормозило первое открытие)
    const ответ = await fetch(location.pathname + '?v=' + Date.now(), {cache: 'no-store'});
    const чтец = ответ.body.getReader(), дек = new TextDecoder();
    let текст = '', m = null;
    while (!m && текст.length < 4096) {
      const {value, done} = await чтец.read();
      if (done) break;
      текст += дек.decode(value, {stream: true});
      m = текст.match(/<!--СБОРКА:([^>]+)-->/);
    }
    чтец.cancel().catch(() => {});
    if (m && m[1] !== СБОРКА) {
      const п = document.getElementById('свежесть');
      п.style.display = 'flex';
    }
  } catch (e) {}
}
setInterval(проверитьСвежесть, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) проверитьСвежесть(); });
setTimeout(проверитьСвежесть, 60 * 1000);   // не в первую минуту — не мешать загрузке
</script>
