<style>

.up { color: #57c98a; } .down { color: #ff5468; } .gold { color: #f0c34e; } .dim { color: #a69fb3; }

  justify-content:center;background:#0a0810;padding:24px">

    <input id="pw" type="password" autocomplete="current-password" placeholder="Пароль"

<div class="wrap">
  <div class="eyebrow">ГАСТРО-МЮЗИКЛ «О ЧЁМ МОЛЧАТ ЖЕНЩИНЫ» · МЕТЕЛИЦА</div>

    <button class="tab" data-p="prices">События × цены</button>

<script>
let D, К, И, ДНИ, СОБ, В_ПРОДАЖЕ, ПИСЬМО;
function применитьДанные(d) {
  D = d; К = D.кабинет; И = К.итог; ДНИ = К.дни;
  СОБ = К.события; В_ПРОДАЖЕ = СОБ.filter(e => e.в_продаже);
  ПИСЬМО = D.письма ? D.письма.отчёты[D.письма.отчёты.length - 1] : null;
}

const ч = n => Math.round(n).toLocaleString('ru-RU').replace(/,/g, ' ');
const р = n => ч(n) + '\u00a0₽';   // неразрывный пробел: «₽» не уходит на новую строку
const пр = (x, z = 1) => (x * 100).toFixed(z).replace('.', ',') + '\u00a0%';
const эл = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c;
  if (h !== undefined) e.innerHTML = h; return e; };

/* ---------- плитки ---------- */
function плитки() {
  const посл = ДНИ[ДНИ.length - 1], дней = ДНИ.length;
  const всегоДней = (() => {
    const a = ДНИ[0].ключ, b = посл.ключ;
    return Math.round((new Date(b) - new Date(a)) / 86400000) + 1;
  })();
  // 14.10.2026: темп и загрузка — по ПЛАТНЫМ (пригласительные промопоказов давали «163 места/сутки»)
  const плат = d => d.платных !== undefined ? d.платных : d.мест;
  const темп = ДНИ.reduce((a, d) => a + плат(d), 0) / всегоДней;
  const темп7 = ДНИ.slice(-7).reduce((a, d) => a + плат(d), 0) / Math.min(7, дней);
  const темп7всех = ДНИ.slice(-7).reduce((a, d) => a + d.мест, 0) / Math.min(7, дней);
  // 14.10.2026: средние — по платным местам (пригласительные по 0 ₽ размывали цену и чек)
  const срЦена = И.ср_цена_платных || И.ср_цена, платных = И.платных || И.продано;
  const дельтаЦены = срЦена - D.цена_места_в_модели;
  // В модели место и сет — две отдельные позиции: 9 500 + 1 900 = 11 400.
  // Поэтому сет прибавляется не к 9 500, а сравнивается уже с полным билетом.
  const сетНаМесто = платных ? И.сумма_еды / платных : 0;
  const чек = срЦена + сетНаМесто;
  const дельтаЧека = чек - D.цена_билета_в_модели;
  const цель = И.квота * 0.8, надо = цель - (И.платных !== undefined ? И.платных : И.продано);
  // 09.10.2026: билеты за 0 ₽ — отдельной группой (только внутренняя версия: в партнёрской блока нет)
  const Б = К.бесплатные, нольЗа = ключи => Б ? Object.values(Б).reduce((a, г) =>
    a + ключи.reduce((x, к) => x + (г.по_дням[к] || 0), 0), 0) : 0;
  const ноль = Б ? Object.values(Б).reduce((a, г) => a + г.мест, 0) : 0;
  const ноль7 = нольЗа(ДНИ.slice(-7).map(d => d.ключ)), нольВчера = нольЗа([посл.ключ]);
  const k = [
    ['Мест продано', ч(И.продано),
     `<span class="${посл.мест ? 'up' : 'dim'}">+${ч(посл.мест)} за ${посл.дата}</span> · квота ${ч(И.квота)}` +
     (ноль ? `<br>платных ${ч(И.продано - ноль)} · <span class="gold">за 0 ₽ ${ч(ноль)}</span>` : '')],
    ...(И.кабинет ? [['Билетов, как в кабинете', ч(И.кабинет.билетов),
      `места + сеты + ужины + пригл. · ${р(И.кабинет.сумма)}<br>как в отчёте «По каналам продаж»` +
      (И.кабинет.событий_с_отчётом < И.кабинет.событий_в_продаже ? `<br><span class="dim">отчёт есть по ${И.кабинет.событий_с_отчётом} из ${И.кабинет.событий_в_продаже} показов</span>` : '')]] : []),
    // 14.10.2026: проект целиком, как «Финансы → Организаторы» в кабинете (только внутренняя версия)
    ...(И.проект ? [['Проект целиком, нетто', р(И.проект.сумма_нетто),
      `${ч(И.проект.нетто)} бил. · все события и ужины<br>` +
      `возвраты <span class="down">${ч(И.проект.возвращено)} · ${р(И.проект.сумма_возвратов)}</span><br>` +
      `<span class="gold">штрафы ${р(И.проект.сумма_штрафов)}</span> · комиссии ${р(И.проект.комиссия)}`]] : []),
    ['Выручка по местам', р(И.сумма), `с едой <b>${р(И.сумма + И.сумма_еды)}</b> · еда ${р(И.сумма_еды)}` + (И.ужинов ? ` · ужины ${ч(И.ужинов)} на ${р(И.сумма_ужинов)}` : '')],
    ['Средняя цена места', ч(срЦена) + ' <small>₽</small>',
     // в партнёрской версии модели нет — только факт (26.09.2026, решение Ала)
     (D.цена_места_в_модели ? `<span class="${дельтаЦены < 0 ? 'down' : 'up'}">${дельтаЦены < 0 ? '−' : '+'}${ч(Math.abs(дельтаЦены))} ₽ к модели ${ч(D.цена_места_в_модели)}</span> · ` : '') + `без сета · по ${ч(платных)} платным местам`],
    ['Еда в деньгах', р(И.сумма_еды),
     `${ч(И.еды)} сетов · ${пр(И.сумма_еды / (И.сумма + И.сумма_еды))} выручки`],
    ['Средний чек на человека', ч(чек) + ' <small>₽</small>',
     (D.цена_билета_в_модели ? `<span class="${дельтаЧека < 0 ? 'down' : 'up'}">${дельтаЧека < 0 ? '−' : '+'}${ч(Math.abs(дельтаЧека))} ₽ к модели ${ч(D.цена_билета_в_модели)}</span> · ` : '') + `место + сет ${ч(сетНаМесто)}`],
    ['Еда: сетов продано', ч(И.еды), (() => {
      // цвет закреплён за видом меню, а не за местом в списке
      const поМеню = { 'мясное': '#ff5468', 'рыбное': '#eceaf2', 'вегетарианское': '#57c98a' };
      const цвет = имя => поМеню[имя.replace(' меню', '').toLowerCase()] || '#6f6880';
      const меню = Object.entries(К.меню).sort((a, b) => b[1] - a[1]);
      const доля = v => И.еды ? 100 * v / И.еды : 0;
      const пц = v => доля(v) < 1 ? '<1 %' : Math.round(доля(v)) + ' %';
      const полоса = меню.map(([k, v]) =>
        `<i style="width:${доля(v)}%;background:${цвет(k)}"></i>`).join('');
      const легенда = меню.map(([k, v]) =>
        `<span><u style="background:${цвет(k)}"></u>${k.replace(' меню', '').toLowerCase()}` +
        ` <b>${ч(v)}</b> <span class="dim">${пц(v)}</span></span>`).join('');
      return `<div class="edabar">${полоса}</div><div class="edaleg">${легенда}</div>` +
        `<div class="gold" style="margin-top:7px">сет берут к ${пр(И.выкуп_платных !== undefined ? И.выкуп_платных : И.выкуп)} платных мест</div>`;
    })()],
    ['Загрузка блока', пр((И.платных !== undefined ? И.платных : И.продано) / И.квота, 1),
     `платные · с пригл. ${пр(И.загрузка, 1)}<br>до 80 % ещё ${ч(надо)} мест` +
     (темп7 > 0 ? ` · ${ч(Math.ceil(надо / темп7))} дн.` : '') +
     `<br>свободно ${ч(И.свободно)}` + (И.кабинет && И.кабинет.придержано !== undefined ? ` · <span class="gold">придержано ${ч(И.кабинет.придержано)}</span>` : ` · у агента ${ч(И.агент)}`)],
    ['Темп продаж', темп7.toFixed(1).replace('.', ',') + ' <small>мест/сутки</small>',
     `платные, 7 дней · с начала ${темп.toFixed(1).replace('.', ',')}` +
     (темп7всех > темп7 ? `<br><span class="dim">с пригл. ${темп7всех.toFixed(1).replace('.', ',')}</span>` : '')],
    ['Событий в продаже', ч(И.событий_в_продаже) + ' <small>из ' + ч(D.показов_по_договору) + '</small>',
     `заведено в системе ${ч(И.событий_всего)} · остальные ещё не открыты`],
  ];
  const box = document.getElementById('kpis');
  k.forEach(([t, v, d], i) => { const c = эл('div', 'kpi');
    c.append(эл('div', 't', t), эл('div', 'v', v), эл('div', 'd', d)); box.append(c);
    if (i === 0 && ноль) box.append(карточкаНоль(Б, ноль, нольВчера, посл)); });
  box.style.setProperty('--n', Math.ceil(box.querySelectorAll(':scope > .kpi').length / 2));
  полосаВозвратов(box, посл);
  document.getElementById('sub').innerHTML =
    `Выгрузка кабинета Yandex Tickets от <b>${К.собрано}</b> · продажи с <b>${К.первая_продажа}</b> ` +
    `по <b>${К.последняя_продажа}</b> · ${ч(И.возврат)} возвратов мест и ${ч(И.возврат_еды)} сетов учтены`;
}

/* ---------- карточка «Билеты за 0 ₽» (09.10.2026, Ал: не исключать, а выделить группой) ---------- */
function карточкаНоль(Б, ноль, нольВчера, посл) {
  const ИМЯ = { перенос: 'перенос · сотрудники', без_продавца: 'без продавца', агент: 'агент за 0 ₽' };
  const ПОДСКАЗКА = {
    перенос: 'Выписаны сотрудниками кабинета без агента — похоже на перенос гостей с отменённых показов. Подтвердить у КК.',

    ячейка(`<span class="down">−${р(всего)}</span>`, `вернули всего: ${ч(билетов)} билетов (${ч(о.мест + з.мест)} мест · ${ч(о.сетов + з.сетов)} сетов)`,
      `отмена ${р(о.сумма)} · зрители ${р(з.сумма)}`) +

    ячейка(шт(н), 'выдано за 0 ₽ без агента', (Object.keys(н.кто || {}).filter(Boolean).length ? 'вручную: ' + Object.keys(н.кто).filter(Boolean).join(', ') : 'выписаны в кабинете вручную') +
      (В.снято_за_ноль && В.снято_за_ноль.мест ? ` · снято ещё ${шт(В.снято_за_ноль)}` : ''), '',
      н.кто ? 'Билеты за 0 ₽, выписанные сотрудниками кабинета без агента. Похоже на перенос зрителей отменённых показов — подтвердить у КК.' : '') +
    (ком || комЖ ? ячейка(р(ком + комЖ), 'Вопрос к КК: комиссия Яндекса удержана?',
      `${р(ком)} по возвращённым + ${р(комЖ)} по отменённым`, 'vz-q',

      'зависит от договора КК с Яндексом. Запросить у КК пункт договора и акт сверки за сентябрь.') : '') +

/* ---------- таблица ---------- */
function таблица(колонки, ряды, итог) {
  const s = эл('div', 'scroll'), t = эл('table'), thead = эл('thead'), tr = эл('tr');
  колонки.forEach((k, i) => { const th = эл('th', k.подсказка ? 'tip' : '', k.имя);
    if (k.подсказка) th.title = k.подсказка;          // пояснение столбца — при наведении
    if (k.цвет) th.style.color = k.цвет;               // 15.10.2026: цвет потока (билеты / сеты / бар)
    th.onclick = () => сортировать(t, i, k.числовая !== false); tr.append(th); });
  thead.append(tr); t.append(thead);
  const tb = эл('tbody');
  ряды.forEach(r => { const tr = эл('tr', r.класс);
    (r.ячейки || r).forEach((c, i) => { const td = эл('td', c && c.класс, c && c.html !== undefined ? c.html : c);
      if (колонки[i] && колонки[i].цвет && !(c && c.класс)) td.style.color = колонки[i].цвет;
      if (c && c.title) { td.title = c.title; td.style.cursor = 'help'; }   // подсказка при наведении (14.10.2026)
      tr.append(td); });
    tb.append(tr); });
  t.append(tb);
  if (итог) { const tf = эл('tbody'), tr = эл('tr', 'total');
    итог.forEach((c, i) => { const td = эл('td', '', c); if (колонки[i] && колонки[i].цвет) td.style.color = колонки[i].цвет; tr.append(td); });
    tf.append(tr); t.append(tf); }
  s.append(t); return s;
}
function сортировать(t, i, числовая) {
  const tb = t.tBodies[0], ряды = [...tb.rows];
  const было = t.tHead.rows[0].cells[i].classList.contains('sorted');
  [...t.tHead.rows[0].cells].forEach(th => th.classList.remove('sorted', 'asc'));
  const знач = tr => { const s = tr.cells[i].textContent.replace(/\s|₽|%/g, '').replace(',', '.');
    return числовая ? (parseFloat(s) || 0) : tr.cells[i].textContent; };
  ряды.sort((a, b) => было ? (знач(a) > знач(b) ? 1 : -1) : (знач(a) < знач(b) ? 1 : -1));
  t.tHead.rows[0].cells[i].classList.add(было ? 'asc' : 'sorted');
  ряды.forEach(r => tb.append(r));
}
const бар = (доля, текст) =>

/* ---------- график «Загрузка показов» (14.10.2026, Ал): столбец — показ, высота — проданные места по каналам ---------- */
function графикЗагрузки() {
  const пок = СОБ.filter(e => !e.отмена && !e.служебное && (e.в_продаже || e.прошёл) && e.места.квота)
    .sort((a, b) => (a.дата.split('.').reverse().join('') + a.время).localeCompare(b.дата.split('.').reverse().join('') + b.время));
  if (!пок.length) return эл('div');
  const кан = e => e.места.по_каналам && Object.keys(e.места.по_каналам).length ? e.места.по_каналам
    : {'Яндекс Афиша': e.места.платно || 0, 'пригласительные': e.места.пригл || 0};
  const итого = {};
  пок.forEach(e => Object.entries(кан(e)).forEach(([к, v]) => итого[к] = (итого[к] || 0) + v));
  // пригласительные — всегда верхним слоем, платные каналы снизу по убыванию
  const каналы = Object.keys(итого).filter(к => к !== 'пригласительные').sort((a, b) => итого[b] - итого[a]);
  if (итого['пригласительные']) каналы.push('пригласительные');
  let запас = 0; const цвет = {};
  каналы.forEach(к => цвет[к] = ЦВЕТ_ИСТОЧНИКА[к] || ['#b0a4ff', '#ffb38a', '#f58fb0', '#8fd694'][запас++ % 4]);
  const квота = Math.max(...пок.map(e => e.места.квота)), цель = Math.round(квота * D.цель_загрузки);   // 15.10.2026, Ал: зал по схеме — 301
  const шаг = 50, max = Math.ceil(квота / шаг) * шаг;
  const ось = 52, верх = 30, bw = 44, h = 230, w = ось + пок.length * bw + 64;
  const явкаЕсть = пок.some(e => e.кабинет && e.кабинет.явка);
  const низ = 40 + (каналы.length + (явкаЕсть ? 1 : 0)) * 12 + 4;   // место под счётчик каналов и «пришло»
  const Y = v => верх + h - v / max * h;
  let svg = `<div class="scroll"><svg viewBox="0 0 ${w} ${верх + h + низ}" style="width:${w}px;max-width:none;height:${верх + h + низ}px">`;
  for (let v = 0; v <= max; v += шаг)
    svg += `<line x1="${ось - 4}" x2="${w}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v ? '#2a2338' : '#3a3248'}"/>` +
      `<text x="${ось - 7}" y="${Y(v) + 3.5}" font-size="10.5" fill="#b9b2c6" text-anchor="end">${v}</text>`;
  svg += `<line x1="${ось}" x2="${w}" y1="${Y(квота)}" y2="${Y(квота)}" stroke="#d8d2e2" stroke-dasharray="4 3" opacity=".55"/>` +
    `<text x="${w - 4}" y="${Y(квота) - 4}" font-size="10.5" fill="#d8d2e2" text-anchor="end">зал ${квота}</text>` +
    `<line x1="${ось}" x2="${w}" y1="${Y(цель)}" y2="${Y(цель)}" stroke="#f0c34e" stroke-width="1.5"/>` +
    `<text x="${w - 4}" y="${Y(цель) - 4}" font-size="10.5" fill="#f0c34e" text-anchor="end">безубыточность ${Math.round(D.цель_загрузки * 100)} % = ${цель}</text>`;
  каналы.forEach((c, j) => svg += `<rect x="${ось - 14}" y="${верх + h + 34 + j * 12}" width="9" height="9" rx="2" fill="${цвет[c]}"/>`);
  if (явкаЕсть) svg += `<text x="${ось - 4}" y="${верх + h + 46 + каналы.length * 12}" font-size="10.5" font-weight="700" fill="#57c98a" text-anchor="end">пришло</text>`;
  пок.forEach((e, i) => {
    const x = ось + i * bw + 5, ширина = bw - 10, к = кан(e);

      '\n' + каналы.filter(c => к[c]).map(c => `${ИМЯ_ИСТОЧНИКА[c] || c}: ${к[c]}`).join('\n') +
      `\nзагрузка по платным ${пр(плат / e.места.квота, 1)}`;
    svg += `<g><title>${подпись.replace(/</g, '&lt;')}</title>`;
    let y = верх + h;
    каналы.forEach(c => { const v = к[c] || 0; if (!v) return;
      const hh = v / max * h; y -= hh;
      svg += `<rect x="${x}" y="${y}" width="${ширина}" height="${hh}" fill="${цвет[c]}"${e.прошёл ? ' opacity=".45"' : ''}/>`; });   // 15.10: бледный только столбец, цифры яркие
    // 15.10.2026, Ал: над столбцом — «платные/пригласительные», под ними — всего мест
    svg += (к['пригласительные'] ? `<text x="${x + ширина / 2}" y="${Y(всего) - 17}" font-size="10.5" font-weight="700" fill="#eceaf2" text-anchor="middle">${плат}<tspan fill="#e2e27a">/${к['пригласительные']}</tspan></text>` : '') +
      `<text x="${x + ширина / 2}" y="${Y(всего) - 4}" font-size="11" font-weight="700" fill="#eceaf2" text-anchor="middle">${всего}</text>` +
      `<text x="${x + ширина / 2}" y="${верх + h + 14}" font-size="10.5" font-weight="600" fill="#eceaf2" text-anchor="middle">${e.дата.slice(0, 5)}</text>` +
      `<text x="${x + ширина / 2}" y="${верх + h + 26}" font-size="9.5" fill="#b9b2c6" text-anchor="middle">${e.время}</text>` +

      // 15.10.2026, Ал: сколько пришло (вход по билетам и приглашениям) — для прошедших показов
      (e.кабинет && e.кабинет.явка ? `<text x="${x + ширина / 2}" y="${верх + h + 46 + каналы.length * 12}" font-size="10.5" font-weight="800" fill="#57c98a" text-anchor="middle">${e.кабинет.явка.пришло + e.кабинет.явка.пришло_по_приглашениям}</text>` : '') +
      `</g>`;
  });
  // 14.10.2026, Ал: под названием каждого продавца — счётчик «итого за весь период»
  const всего = каналы.reduce((a, c) => a + итого[c], 0);
  const счётчик = c => `<div style="display:flex;flex-direction:column;gap:2px;padding:8px 12px;margin:0 10px 8px 0;border:1px solid #2a2338;border-radius:10px;min-width:120px">` +
    `<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#cfc8da">` +
    `<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${цвет[c]}"></span>${ИМЯ_ИСТОЧНИКА[c] || c}</span>` +
    `<b style="font-size:20px;color:${цвет[c]}">${ч(итого[c])}</b>` +
    `<span style="font-size:11px;color:#a69fb3">${пр(итого[c] / всего, 0)} всех мест</span></div>`;
  return блокГрафика(`<h3 style="margin:6px 0 4px">Загрузка показов</h3>` +
    `<div class="hint">Над столбцом — платные/пригласительные и под ними всего мест. Золотая линия — точка безубыточности, ${Math.round(D.цель_загрузки * 100)} % зала. Под столбцом — сколько мест на показ продал каждый канал; внизу под каждым продавцом — итог за весь период. «Пришло» — вход по билетам и приглашениям. Бледные — прошедшие показы. Наведите на столбец — разбивка.</div>` +
    svg + '</svg></div><div style="display:flex;flex-wrap:wrap;margin-top:8px">' +
    каналы.map(счётчик).join('') + '</div>', w);
}

      // 15.10.2026, Ал: угощения вне iiko — ручной список угощения_вне_iiko.csv
      (и.вне_iiko || []).map(x => стр('&nbsp;&nbsp;+ ' + x.позиция + ' (' + (x.тип || 'вне iiko') + ')', x.сумма != null ? р(x.сумма) : '<span class="gold">уточняется</span>',
        x.кол != null ? ч(x.кол) + ' × ' + р(x.цена) : (x.цена ? 'по ' + р(x.цена) : ''))).join('') +
      ((и.вне_iiko || []).some(x => x.тип === 'фри-продукт') ? `<div class="hint" style="margin-top:4px">Фри-продукт — для нас бесплатно, сумма — оценка поставщика: ${р((и.вне_iiko || []).filter(x => x.тип === 'фри-продукт').reduce((a, x) => a + (x.сумма || 0), 0))}. ` +
        `Договорённость бар-менеджера Романа с поставщиком: фри-продукт на 2 представительских мероприятия — это 1-е.</div>` : ''), ПОТОК.бар) +
    `</div>` + ((s.пометка || '').includes('промопоказ') ? '<div class="hint" style="margin-top:12px">Промопоказ — без плана продаж.</div>' : (() => { const П = планШоу(s);
      return `<div style="margin-top:14px"><div style="font-weight:700;margin-bottom:6px;color:#efeaf4">План / факт</div>` +
        таблицаПланФакт([['Гостей', П.гости, людей, false], ['Билеты (места + ужин)', П.билеты, м.сумма + ужин, true],
          ['Сеты (с билетами + на шоу)', П.сеты, С.проданоР, true], ['Бар', П.бар, идёт ? null : и.бар, true],
          ['Средний чек бара', П.чек, идёт ? null : Math.round(и.бар / Math.max(1, людей)), true]]) +
        `<div class="hint" style="margin-top:4px">План: ${ч(П.гости)} гостей (100 % зала; безубыточность — 80 %) · место ${р(D.цена_места_в_модели || 9500)} · сет на каждого гостя · бар ${р(ПЛАН_ЧЕК_БАРА)} на гостя.</div></div>`; })()) +
    (и.по_оплате && и.кассиры ? `<details style="margin-top:12px"><summary style="cursor:pointer;color:#f0c34e;font-weight:700">iiko подробно</summary>` +
      `<div style="display:flex;flex-wrap:wrap;gap:22px;margin-top:8px">` +
      блок('Оплаты', Object.entries(и.по_оплате).map(([т, v]) => стр(т, р(v))).join('') +
        стр('Скидки при оплате', р(и.скидки)) + стр('Сервисный сбор', р(и.сервис)) +
        стр('Возвраты', р(и.возвраты)) + стр('Сторно', р(и.сторно)) + стр('Удалено позиций', ч(и.удалено))) +
      блок('Без оплаты — по чекам (угощения, неплательщики)', (и.без_оплаты || []).map(x =>
        стр(`чек ${x.чек} · стол ${x.стол} · ${x.время}`, р(x.сумма), x.кассир) +
        `<div class="hint" style="margin:-2px 0 6px">${x.позиции}</div>`).join('') || '<div class="dim">нет</div>') +
      блок('Кассиры (оплачено)', Object.entries(и.кассиры || {}).map(([к, v]) => стр(к, р(v))).join('')) +
      `</div><div class="hint" style="margin-top:6px">Причину списания iiko не хранит: «без оплаты» — только признак. Кто и за что — по столу и кассиру.</div></details>` : '');
  return d;
}

function панельСобытий(p) {
  p.append(эл('h2', '', 'Продажи по событиям, включая еду'),
    эл('div', 'hint', 'Все события, заведённые в билетной системе. Еда — три меню-сектора по 276 позиций на показ: мясное, рыбное, вегетарианское.'),
    (() => { const ряд = эл('div', '', ''); ряд.style.cssText = 'display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start';
      ряд.append(графикЗагрузки(), графикСетов()); return ряд; })());
  const кол = [{имя: 'Показ', числовая: false}, {имя: 'Квота мест'}, {имя: 'Продано', подсказка: 'Платные места (без пригласительных)'},
    {имя: 'Пригл.', подсказка: 'Пригласительные — места по 0 ₽'}, {имя: 'Загрузка', подсказка: 'По платным местам'},
    {имя: 'Выручка мест'}, {имя: 'Ср. цена'}, {имя: 'Сетов'}, {имя: 'Мясн.'}, {имя: 'Рыбн.'},
    {имя: 'Выручка еды'}, {имя: 'Выкуп еды'}, {имя: 'Свободно'}, {имя: 'У агента'}, {имя: 'Возвраты'},
    {имя: 'Ужинов'}, {имя: 'Билетов (каб.)'}, {имя: 'Придержано'}, {имя: 'Явка'}];
  // 15.10.2026, Ал: выручка по каждому шоу — билеты + сеты + ужин (кабинет) + бар (iiko, чеки вечера показа)
  const естьБар = СОБ.some(s => s.iiko);
  if (естьБар) кол.push({имя: 'Бар', подсказка: 'Оплачено гостями в iiko за вечер показа (без сетов). Угощения — при наведении'},
    {имя: 'Выручка шоу', подсказка: 'Места + сеты + ужин (кабинет) + бар (iiko)'});
  const выручкаШоу = s => s.места.сумма + s.еда.сумма + ((s.ужин && s.ужин.сумма) || 0) + (s.iiko ? s.iiko.бар : 0);
  const макс = Math.max(...СОБ.map(s => s.загрузка), 0.0001);
  const ряды = СОБ.map(s => ({
    класс: s.в_продаже ? '' : 'нет',
    ячейки: [
      `${s.дата} <span class="dim">${s.время}</span>` + (s.пометка ? `<span class="tag gold">${s.пометка}</span>` : '') + (s.отмена ? '<span class="tag down">отменён</span>' : прошёл(s) ? '<span class="tag">прошёл</span>' : s.в_продаже ? '' : '<span class="tag">не в продаже</span>'),
      ч(s.места.квота),
      (s.места.платно !== undefined ? s.места.платно : s.места.продано) ? ч(s.места.платно !== undefined ? s.места.платно : s.места.продано) : {класс: 'zero', html: '0'},
      s.места.пригл ? {класс: 'gold', html: ч(s.места.пригл)} : {класс: 'zero', html: '—'},
      бар(s.загрузка / макс, пр(s.загрузка, 1)),
      s.места.сумма ? р(s.места.сумма) : {класс: 'zero', html: '—'},
      s.места.продано ? ч(s.ср_цена) : {класс: 'zero', html: '—'},
      s.еда.продано ? ч(s.еда.продано) : {класс: 'zero', html: '0'},
      s.еда.мясное ? ч(s.еда.мясное) : {класс: 'zero', html: '—'},
      s.еда.рыбное ? ч(s.еда.рыбное) : {класс: 'zero', html: '—'},
      s.еда.сумма ? р(s.еда.сумма) : {класс: 'zero', html: '—'},
      s.места.продано ? пр(s.выкуп, 0) : {класс: 'zero', html: '—'},
      ч(s.места.свободно), s.места.агент ? ч(s.места.агент) : {класс: 'zero', html: '0'},
      s.места.возврат ? {класс: 'down', html: ч(s.места.возврат)} : {класс: 'zero', html: '0'},
      s.ужин && s.ужин.продано ? ч(s.ужин.продано) : {класс: 'zero', html: '—'},
      s.кабинет ? {html: ч(s.кабинет.итого_билетов), title: `в кабинете: показ ${s.кабинет.показ_билетов} + ужин ${s.кабинет.ужин_билетов} · ${р(s.кабинет.итого_сумма)}`} : {класс: 'zero', html: '—'},
      s.кабинет && s.кабинет.придержано_всего ? {html: ч(s.кабинет.придержано_всего), title: Object.entries(s.кабинет.придержано).map(([к, v]) => к + ': ' + v).join(', ')} : {класс: 'zero', html: '—'},
      s.кабинет && s.кабинет.явка ? {html: ч(s.кабинет.явка.пришло + s.кабинет.явка.пришло_по_приглашениям),
        title: `пришло по билетам ${s.кабинет.явка.пришло} из ${s.кабинет.явка.продано}, по приглашениям ${s.кабинет.явка.пришло_по_приглашениям} из ${s.кабинет.явка.приглашений}`} : {класс: 'zero', html: '—'},
      ...(естьБар ? [
        s.iiko ? {html: р(s.iiko.бар) + (s.iiko.смешано && s.iiko.смешано.length ? ' <span class="tag down">смешано</span>' : ''),
          title: `чеков ${s.iiko.чеков} · угощения ${р(s.iiko.угощения)} · окно ${s.iiko.окно}` + (s.iiko.смешано && s.iiko.смешано.length ? '\nв этот день ещё: ' + s.iiko.смешано.join('; ') : '')} : {класс: 'zero', html: '—'},
        s.iiko ? {html: '<b>' + р(выручкаШоу(s)) + '</b>'} : {класс: 'zero', html: '—'}] : []),
    ]}));
  const итог = [`ИТОГО ${И.событий_в_продаже} в продаже`, ч(И.квота), ч(И.платных !== undefined ? И.платных : И.продано), ч(И.за_ноль || 0), пр(И.платных !== undefined && И.квота ? И.платных / И.квота : И.загрузка, 1),
    р(И.сумма), ч(И.ср_цена_платных || И.ср_цена), ч(И.еды),
    ч(К.меню['Мясное меню'] || 0), ч(К.меню['Рыбное меню'] || 0),
    р(И.сумма_еды), пр(И.выкуп_платных !== undefined ? И.выкуп_платных : И.выкуп, 0), ч(И.свободно), ч(И.агент), ч(И.возврат),
    ч(И.ужинов || 0), И.кабинет ? ч(И.кабинет.билетов) : '—', И.кабинет && И.кабинет.придержано !== undefined ? ч(И.кабинет.придержано) : '—', '',
    ...(естьБар ? [р(СОБ.reduce((a, s) => a + (s.iiko ? s.iiko.бар : 0), 0)), р(СОБ.filter(s => s.iiko).reduce((a, s) => a + выручкаШоу(s), 0))] : [])];
  p.append(таблица(кол, ряды, итог));
  const пл = s => s.места.платно !== undefined ? s.места.платно : s.места.продано;   // 14.10.2026: по платным
  const топ = [...В_ПРОДАЖЕ].sort((a, b) => пл(b) - пл(a))[0];
  const пусто = В_ПРОДАЖЕ.filter(s => !пл(s)).length;
  p.append(эл('div', 'note',
    `Лучший показ — <b>${топ.дата} ${топ.время}</b>: ${пл(топ)} платных мест на ${р(топ.места.сумма)}. ` +
    `Без единой платной продажи — <b>${пусто}</b> показов из ${И.событий_в_продаже}. ` +
    `Столбец «У агента» — места, отданные агенту: это ещё не продажа, но и не свободный остаток. ` +
    `«Придержано» — из них служебные квоты кабинета (Склад, «НЕ выводить в продажу»): их никто не продаёт. ` +
    `«Билетов (каб.)» — как считает кабинет: места + сеты + авторский ужин + пригласительные. «Явка» — прошло по СКД.`));
}

/* ---------- 2. дни ---------- */
function график(точки, подписи, цвет, подпись) {
  const w = 100, h = 34, макс = Math.max(...точки), мин = Math.min(...точки, 0);
  const шаг = точки.length > 1 ? w / (точки.length - 1) : 0;
  const y = v => макс === мин ? h / 2 : h - 4 - (v - мин) / (макс - мин) * (h - 10);
  const d = точки.map((v, i) => `${i ? 'L' : 'M'}${(i * шаг).toFixed(2)},${y(v).toFixed(2)}`).join(' ');
  return `<div style="margin:6px 0 2px"><div style="color:#cfc8da;font-size:12px">${подпись}</div>
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:104px;overflow:visible">
      <path d="${d} L${w},${h} L0,${h} Z" fill="${цвет}" opacity=".13"/>
      <path d="${d}" fill="none" stroke="${цвет}" stroke-width="1" vector-effect="non-scaling-stroke"/>
      ${точки.map((v, i) => `<circle cx="${(i*шаг).toFixed(2)}" cy="${y(v).toFixed(2)}" r="1" fill="${цвет}"/>`).join('')}
    </svg>
    <div style="display:flex;justify-content:space-between;color:#a69fb3;font-size:11px">
      <span>${подписи[0]}</span><span>${подписи[подписи.length-1]} · ${ч(точки[точки.length-1])}</span></div></div>`;
}
function панельДней(p) {
  p.append(эл('h2', '', 'Продажи по дням, включая еду'),
    эл('div', 'hint', 'Реальные даты продажи каждого билета — вся история с открытия продаж, а не суточные снимки.'));
  const подписи = ДНИ.map(d => d.дата.slice(0, 5));
  p.append(эл('div', '', '<div style="display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">' +
    график(ДНИ.map(d => d.мест), подписи, '#ff2f6d', 'Мест продано за день') +
    график(ДНИ.map(d => d.накоп_мест), подписи, '#f0c34e', 'Мест нарастающим итогом') +
    график(ДНИ.map(d => d.накоп_сумма), подписи, '#7aa2ff', 'Выручка нарастающим итогом, ₽') +
    '</div>'));
  const кол = [{имя: 'День продаж', числовая: false}, {имя: 'Мест'}, {имя: 'Выручка мест'}, {имя: 'Сетов'},
    {имя: 'Выручка еды'}, {имя: 'Возвраты'}, {имя: 'Мест всего'}, {имя: 'Выручка всего'}];
  const ряды = ДНИ.map(d => [
    d.дата, d.мест ? ч(d.мест) : {класс: 'zero', html: '0'},
    d.сумма ? р(d.сумма) : {класс: 'zero', html: '—'},
    d.еды ? ч(d.еды) : {класс: 'zero', html: '0'},
    d.сумма_еды ? р(d.сумма_еды) : {класс: 'zero', html: '—'},
    d.возвратов ? {класс: 'down', html: ч(d.возвратов)} : {класс: 'zero', html: '0'},
    ч(d.накоп_мест), р(d.накоп_сумма)]);
  p.append(таблица(кол, ряды));
  const лучший = [...ДНИ].sort((a, b) => b.мест - a.мест)[0];
  const посл7 = ДНИ.slice(-7).reduce((a, d) => a + d.мест, 0) / Math.min(7, ДНИ.length);
  p.append(эл('div', 'note',
    `Лучший день — <b>${лучший.дата}</b>: ${лучший.мест} мест на ${р(лучший.сумма)}. ` +
    `Последние 7 дней — <b>${посл7.toFixed(1).replace('.', ',')}</b> места в сутки, ` +
    `это ${(посл7 / И.событий_в_продаже).toFixed(2).replace('.', ',')} на показ при ` +
    `<b>${(И.квота * 0.8 / И.событий_в_продаже / 30).toFixed(1).replace('.', ',')}</b>, ` +
    `нужных для 80 % за месяц до премьеры.`));
}

/* ---------- 3. цены ---------- */
let режим = 'продано';
function панельЦен(p) {
  p.append(эл('h2', '', 'Разбивка по событиям и ценам'),
    эл('div', 'hint', 'Проданное по ценам — из выгрузки кабинета. Квота и остаток по ценам берутся из письма оператора: у непроданных билетов в выгрузке нет номинала.'));
  const sw = эл('div', 'switch');
  const режимы = [['продано', 'Продано'], ['сумма', 'Выручка']];
  if (ПИСЬМО) режимы.push(['квота', 'Квота'], ['свободно', 'Свободно']);
  режимы.forEach(([k, имя]) => { const b = эл('button', режим === k ? 'on' : '', имя);
    b.onclick = () => { режим = k; p.innerHTML = ''; панельЦен(p); }; sw.append(b); });
  p.append(sw);

  const изПисьма = {};
  if (ПИСЬМО) ПИСЬМО.показы.forEach(s => { изПисьма[s.дата + ' ' + s.время] = s; });
  const цены = [...new Set([].concat(
    ...СОБ.map(e => e.цены.map(c => c.цена)),
    ...(ПИСЬМО ? ПИСЬМО.показы.map(s => s.цены.map(c => c.цена)) : [])))].sort((a, b) => a - b);
  const изПисьмаРежим = режим === 'квота' || режим === 'свободно';
  const строки = изПисьмаРежим ? СОБ.filter(e => изПисьма[e.дата + ' ' + e.время]) : СОБ;

  const значение = (e, ц) => {
    if (изПисьмаРежим) {
      const s = изПисьма[e.дата + ' ' + e.время]; if (!s) return 0;
      const c = s.цены.find(x => x.цена === ц); return c ? c[режим] : 0;
    }
    const c = e.цены.find(x => x.цена === ц); return c ? c[режим] : 0;
  };
  const макс = Math.max(...строки.map(e => Math.max(...цены.map(ц => значение(e, ц)))), 1);
  const кол = [{имя: 'Показ', числовая: false}, ...цены.map(c => ({имя: ч(c)})), {имя: 'Итого'}, {имя: 'Еда'}];
  const ряды = строки.map(e => ({
    класс: e.в_продаже ? '' : 'нет',
    ячейки: [
      `${e.дата} <span class="dim">${e.время}</span>`,
      ...цены.map(ц => { const v = значение(e, ц);
        if (!v) return {класс: 'zero', html: '—'};
        const a = (0.10 + 0.55 * v / макс).toFixed(2);
        return {html: `<span style="background:rgba(255,47,109,${a});padding:2px 7px;border-radius:5px">` +
                      `${режим === 'сумма' ? р(v) : ч(v)}</span>`}; }),
      режим === 'сумма' ? р(e.места.сумма) : ч(цены.reduce((a, ц) => a + значение(e, ц), 0)),
      {класс: 'gold', html: режим === 'сумма' ? р(e.еда.сумма) : ч(e.еда[режим === 'квота' ? 'квота' : режим === 'свободно' ? 'свободно' : 'продано'])},
    ]}));
  const по = ц => строки.reduce((a, e) => a + значение(e, ц), 0);
  const итог = ['ИТОГО', ...цены.map(ц => режим === 'сумма' ? р(по(ц)) : ч(по(ц))),
    режим === 'сумма' ? р(строки.reduce((a, e) => a + e.места.сумма, 0)) : ч(цены.reduce((a, ц) => a + по(ц), 0)),
    режим === 'сумма' ? р(строки.reduce((a, e) => a + e.еда.сумма, 0))
      : ч(строки.reduce((a, e) => a + e.еда[режим === 'квота' ? 'квота' : режим === 'свободно' ? 'свободно' : 'продано'], 0))];
  p.append(таблица(кол, ряды, итог));

  const прод = цены.map(ц => ({ц, n: СОБ.reduce((a, e) => a + ((e.цены.find(c => c.цена === ц) || {}).продано || 0), 0)}));
  const топ = [...прод].sort((a, b) => b.n - a.n).slice(0, 3).filter(x => x.n);
  const мёртвые = прод.filter(x => !x.n);
  p.append(эл('div', 'note',
    `Лучше всего уходят уровни <b>${топ.map(x => ч(x.ц) + ' ₽ (' + x.n + ')').join(', ')}</b>. ` +
    (мёртвые.length ? `Ни одной продажи на уровнях ${мёртвые.map(x => ч(x.ц)).join(', ')} ₽. ` : '') +
    (!D.цена_места_в_модели ? `Средняя цена проданного места — <b>${ч(И.ср_цена)} ₽</b>, с едой средний чек <b>${ч(И.ср_цена + И.сумма_еды / И.продано)} ₽</b>.` :
    `Средняя цена проданного места — <b>${ч(И.ср_цена)} ₽</b> против ${ч(D.цена_места_в_модели)} ₽ в модели: ` +
    `на ${ч(И.квота)} мест блока это разница в <b>${р((D.цена_места_в_модели - И.ср_цена) * И.квота)}</b> при полной продаже. ` +
    `Сет сюда не входит ни в факте, ни в модели: зритель платит две отдельные позиции, ` +
    `${ч(D.цена_места_в_модели)} за место и ${ч(D.цена_сета_в_модели)} за сет, полный билет ${ч(D.цена_билета_в_модели)} ₽. ` +
    `С едой средний чек выходит <b>${ч(И.ср_цена + И.сумма_еды / И.продано)} ₽</b> — сравнивать его нужно с ${ч(D.цена_билета_в_модели)} ₽, ` +
    `и разрыв остаётся тот же.`)));
}

/* ---------- 4. прогноз и темп ---------- */
function панельПрогноза(p) {
  const ЦЕЛЬ = D.цель_загрузки, ДЕНЬ = 86400000;
  const СЕГОДНЯ = new Date(D.сегодня + 'T00:00:00');
  const дата = s => new Date(s.split('.').reverse().join('-') + 'T00:00:00');
  const дробь = (x, z = 1) => x.toFixed(z).replace('.', ',');

  // темп: с начала продаж и в скользящих окнах — видно, ускоряемся мы или затухаем
  const днейПродаж = Math.round((дата(ДНИ[ДНИ.length-1].дата) - дата(ДНИ[0].дата)) / ДЕНЬ) + 1;
  const срез = n => ДНИ.slice(-n).reduce((a, d) => a + d.мест, 0) / Math.min(n, ДНИ.length);
  const темпВсего = И.продано / днейПродаж, темп7 = срез(7), темп14 = срез(14);

  // по каждому показу: свой дедлайн и свой нужный темп. Суммарный нужный темп —
  // это сумма по показам, а не общая цель делённая на общий срок: у каждого показа
  // своя дата, и ближние съедают темп быстрее дальних.
  const строки = В_ПРОДАЖЕ.map(e => {
    const квота = e.места.квота, продано = e.места.продано;
    const цель = Math.round(квота * ЦЕЛЬ);
    const нужно = Math.max(0, цель - продано);
    const дней = Math.max(0, Math.round((дата(e.дата) - СЕГОДНЯ) / ДЕНЬ));
    const нужныйТемп = дней > 0 ? нужно / дней : нужно;
    const прогноз = Math.min(квота, продано + (продано / днейПродаж) * дней);
    return {e, квота, продано, цель, нужно, дней, нужныйТемп, прогноз, загр: прогноз / квота};
  }).sort((a, b) => a.дней - b.дней);

  const сум = f => строки.reduce((a, r) => a + f(r), 0);
  const квотаВ = сум(r => r.квота), проданоВ = сум(r => r.продано);
  const цельВ = сум(r => r.цель), нужноВ = сум(r => r.нужно);
  const нужныйТемпВ = сум(r => r.нужныйТемп), прогнозВ = сум(r => r.прогноз);
  const разрыв = темп7 > 0 ? нужныйТемпВ / темп7 : 0;
  const хватитДней = темп7 > 0 ? нужноВ / темп7 : 0;

  p.append(эл('h2', '', 'Прогноз: сколько нужно продавать в день'),
    эл('div', 'hint', `Цель — загрузка ${пр(ЦЕЛЬ, 0)} по каждому показу, как в финмодели. ` +
      `У каждого показа своя дата, поэтому нужный темп считается по нему отдельно и суммируется: ` +
      `ближние показы «съедают» темп быстрее дальних. Дата отсчёта — ${D.сегодня.split('-').reverse().join('.')}.`));

  const kpi = эл('div', 'kpis');
  [['Нужно продавать', дробь(нужныйТемпВ) + ' <small>мест/день</small>',
    `чтобы каждый показ вышел на ${пр(ЦЕЛЬ, 0)}`],
   ['Продаём сейчас', дробь(темп7) + ' <small>мест/день</small>',
    `за 7 дней · за 14 дней ${дробь(темп14)} · с начала ${дробь(темпВсего)}`],
   ['Разрыв', разрыв ? '×' + дробь(разрыв) : '—',
    разрыв > 1 ? `нужно ускориться в ${дробь(разрыв)} раза` : 'темпа достаточно'],
   ['Осталось продать', ч(нужноВ) + ' <small>мест</small>',
    `цель ${ч(цельВ)} · продано ${ч(проданоВ)} из квоты ${ч(квотаВ)}`],
   ['Прогноз при этом темпе', пр(прогнозВ / квотаВ, 1),
    `${ч(Math.round(прогнозВ))} мест против цели ${ч(цельВ)}`],
   ['Хватит ли времени', темп7 > 0 ? ч(Math.ceil(хватитДней)) + ' <small>дней</small>' : '—',
    `столько нужно при нынешнем темпе на весь остаток`],
  ].forEach(([t, v, d]) => { const c = эл('div', 'kpi');
    c.append(эл('div', 't', t), эл('div', 'v', v), эл('div', 'd', d)); kpi.append(c); });
  p.append(kpi);

  // ── план против факта, накопительно ──
  const фактНакоп = ДНИ.map(d => d.накоп_мест);
  const планНакоп = ДНИ.map((d, i) => Math.round(цельВ * (i + 1) / (ДНИ.length + Math.max(1, строки.length ? строки[0].дней : 1))));
  p.append(эл('h2', '', 'План против факта'),
    эл('div', 'hint', 'Накопленные продажи и та линия, по которой надо было идти, чтобы прийти к цели равномерно. ' +
      'Расхождение линий — это и есть отставание, накопленное с начала продаж.'));
  p.append(эл('div', '', '<div style="display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">' +
    график(фактНакоп, ДНИ.map(d => d.дата.slice(0, 5)), '#ff2f6d', 'Факт — накоплено мест') +
    график(планНакоп, ДНИ.map(d => d.дата.slice(0, 5)), '#48c78e', 'План равномерным темпом') +
    '</div>'));

  // ── таблица по показам ──
  p.append(эл('h2', '', 'По каждому показу'),
    эл('div', 'hint', 'Отсортировано по близости даты. «Нужный темп» — сколько мест в день должен ' +
      'набирать именно этот показ начиная с сегодня. «Прогноз» — куда он придёт, если продажи ' +
      'продолжатся тем же темпом, каким шли до сих пор.'));
  const кол = [{имя: 'Показ', числовая: false}, {имя: 'Дней до'}, {имя: 'Квота'}, {имя: 'Продано'},
    {имя: 'Цель 80 %'}, {имя: 'Не хватает'}, {имя: 'Нужный темп'}, {имя: 'Прогноз'},
    {имя: 'Загрузка прогноза'}, {имя: 'Успеваем', числовая: false}];
  const максТемп = Math.max(...строки.map(r => r.нужныйТемп), 0.0001);
  const ряды = строки.map(r => {
    const успеваем = r.загр >= ЦЕЛЬ;
    return {класс: успеваем ? '' : 'warn', ячейки: [
      {класс: 'nowrap', html: `${r.e.дата} <span class="dim">${r.e.время}</span>`},
      ч(r.дней), ч(r.квота), ч(r.продано), ч(r.цель), ч(r.нужно),
      бар(r.нужныйТемп / максТемп, дробь(r.нужныйТемп)),
      ч(Math.round(r.прогноз)), пр(r.загр, 1),
      {класс: успеваем ? 'up' : 'down', html: успеваем ? 'да' : 'нет'}]};
  });
  p.append(таблица(кол, ряды, ['ИТОГО', '', ч(квотаВ), ч(проданоВ), ч(цельВ), ч(нужноВ),
    дробь(нужныйТемпВ), ч(Math.round(прогнозВ)), пр(прогнозВ / квотаВ, 1), '']));

  // ── эффект рекламных кампаний ──
  const среднийДень = И.продано / ДНИ.length;
  p.append(эл('h2', '', 'Что дают рекламные кампании'),
    эл('div', 'hint', `Средний день даёт ${дробь(среднийДень)} мест. Всплеск — день, где продажи ` +
      `в полтора раза выше среднего: такие дни и есть след сработавшей рекламы. ` +
      `Сравнивайте даты запуска кампаний с этими пиками.`));
  const колД = [{имя: 'День', числовая: false}, {имя: 'Мест'}, {имя: 'Выручка'},
    {имя: 'К среднему'}, {имя: 'Накоплено'}, {имя: 'Отметка', числовая: false}];
  const рядыД = [...ДНИ].reverse().map(d => {
    const отн = среднийДень > 0 ? d.мест / среднийДень : 0;
    const всплеск = отн >= 1.5, тихо = d.мест === 0;
    return {класс: всплеск ? 'good' : '', ячейки: [
      {класс: 'nowrap', html: d.дата}, ч(d.мест), р(d.сумма),
      {класс: отн >= 1 ? 'up' : 'down', html: '×' + дробь(отн)},
      ч(d.накоп_мест),
      {класс: всплеск ? 'up' : (тихо ? 'down' : 'dim'),
       html: всплеск ? 'всплеск' : (тихо ? 'ноль' : '')}]};
  });
  p.append(таблица(колД, рядыД));

  // ── горизонт всего проекта ──
  const цельПроекта = D.показов_по_договору * D.мест_в_зале * ЦЕЛЬ;
  const неОткрыто = D.показов_по_договору - И.событий_всего;
  p.append(эл('h2', '', 'Горизонт всего проката'),
    эл('div', 'hint', 'Выше — только показы, уже открытые в продажу. По договору их ' +
      `${ч(D.показов_по_договору)}, зал ${ч(D.мест_в_зале)} мест.`));
  const колГ = [{имя: 'Показатель', числовая: false}, {имя: 'Значение'}, {имя: 'Комментарий', числовая: false}];
  p.append(таблица(колГ, [
    ['Цель по всему прокату', ч(Math.round(цельПроекта)) + ' мест',
     `${ч(D.показов_по_договору)} показов × ${ч(D.мест_в_зале)} × ${пр(ЦЕЛЬ, 0)}`],
    ['Продано', ч(И.продано) + ' мест', пр(И.продано / цельПроекта, 2) + ' от цели проката'],
    ['Открыто в продажу', ч(И.событий_всего) + ' показов',
     `не открыто ещё ${ч(неОткрыто)} — их квота в расчёте темпа не участвует`],
    ['Потенциал открытых показов', ч(квотаВ) + ' мест',
     `это ${пр(квотаВ / (D.показов_по_договору * D.мест_в_зале), 1)} всей ёмкости проката`],
  ]));
}

  цена: 'Цена места — бюджет размещения, делённый на места сверх фона: сколько стоила одна дополнительная продажа.',
};
// Все числа считает реклама_учёт.py (тот же расчёт в утренней сводке) — здесь только показ.
// Цвета источников продаж: известные — постоянные, новые агенты берут следующий цвет из запаса.
const ЦВЕТ_ИСТОЧНИКА = {'Яндекс Афиша': '#ff2f6d', 'Яндекс Виджет (лендинг мероприятия)': '#7aa2ff',
  'Яндекс Виджет (сайт площадки)': '#9ee6d8', 'пригласительные': '#e2e27a'};
const ЗАПАС_ЦВЕТОВ = ['#e2e27a', '#f58fb0', '#8fd694', '#b0a4ff', '#ffb38a', '#9ee6d8'];
const ИМЯ_ИСТОЧНИКА = {'Яндекс Афиша': 'приложение и сайт Афиши', 'Яндекс Виджет (лендинг мероприятия)': 'виджет на womanmusical.ru',
  'Яндекс Виджет (сайт площадки)': 'виджет на metelitsaclub1.ru', 'пригласительные': 'пригласительные (0 ₽)',
  '[69295266/26] Субагент: Афиша.ру — МД "Красный квадрат" (ОЧМЖ)': 'Афиша.ру'};
// Цвета отметок ▲ по типу канала (тип считает реклама_учёт.тип_канала)
const ЦВЕТ_ТИПА = {'Яндекс и медийка': '#ff9f43', 'Telegram': '#5ed1e8', 'соцсети и блогеры': '#c58cff',
  'СМИ и афиши': '#57c98a', 'причина не установлена': '#9b93a8', 'прочее': '#d8d2e2'};
function графикРекламы(пдФакт, Р) {
  // план: нужный темп до 80 % (та же формула, что во вкладке «Прогноз») и контрольные точки из реклама_учёт
  const ДЕНЬ_МС = 86400000, вДату = s => new Date(s.split('.').reverse().join('-') + 'T00:00:00');
  const СЕГ = new Date(D.сегодня + 'T00:00:00');
  const нужныйТемп = В_ПРОДАЖЕ.reduce((a, e) => {
    const нужно = Math.max(0, Math.round(e.места.квота * D.цель_загрузки) - e.места.продано);
    const дней = Math.max(0, Math.round((вДату(e.дата) - СЕГ) / ДЕНЬ_МС));
    return a + (дней > 0 ? нужно / дней : нужно);
  }, 0);
  const точки = ((Р && Р.контрольные_точки) || []).filter(т => вДату(т.дата) >= СЕГ);
  // ось дней продлевается до последней контрольной точки: будущие дни пустые, на них видна линия плана
  const пд = [...пдФакт];
  const последний = точки.length ? вДату(точки[точки.length - 1].дата) : null;
  if (пд.length && последний) {
    for (let t = new Date(вДату(пд[пд.length - 1].дата).getTime() + ДЕНЬ_МС); t <= последний; t = new Date(t.getTime() + ДЕНЬ_МС)) {
      const дд = String(t.getDate()).padStart(2, '0'), мм = String(t.getMonth() + 1).padStart(2, '0');
      пд.push({дата: `${дд}.${мм}.${t.getFullYear()}`, мест: 0, выходы: [], будущее: true, источники: {}});
    }
  }
  const планНаДень = d => {                            // ступенька: минимум ближайшей впереди контрольной точки
    const т = точки.find(т => вДату(d.дата) <= вДату(т.дата));
    return т ? т.минимум : null;
  };
  // источники продаж: из данных кабинета; старые дни без разбивки — «виджет» и остальное как Афиша
  const поДню = пд.map(d => {
    if (d.будущее) return {};
    if (d.источники && Object.keys(d.источники).length) return d.источники;
    const o = {}; const в = d.виджет || 0;
    if (d.мест - в > 0) o['Яндекс Афиша'] = d.мест - в;
    if (в) o['Яндекс Виджет (лендинг мероприятия)'] = в;
    return o;
  });
  const итого = {};
  поДню.forEach(o => Object.entries(o).forEach(([к, v]) => итого[к] = (итого[к] || 0) + v));
  const источники = Object.keys(итого).sort((a, b) => итого[b] - итого[a]);
  let запас = 0;
  const цвет = {};
  источники.forEach(к => цвет[к] = ЦВЕТ_ИСТОЧНИКА[к] || ЗАПАС_ЦВЕТОВ[запас++ % ЗАПАС_ЦВЕТОВ.length]);
  const типыЕсть = new Set();
  const тип = x => typeof x === 'string' ? 'прочее' : x.тип;
  const назв = x => typeof x === 'string' ? x : `${x.кампания} (${x.канал})`;

  // шкала слева: «круглый» шаг, верх шкалы — ближайшее кратное шагу выше максимума
  const пик = Math.max(1, нужныйТемп, ...точки.map(т => т.минимум), ...пд.map(d => d.мест));
  const шаг = [1, 2, 5, 10, 20, 25, 50, 100, 200, 500].find(ш => пик / ш <= 5) || 1000;
  const max = Math.ceil(пик / шаг) * шаг;
  const ось = 34, верх = 8, bw = 18, h = 220;          // ось — место под подписи шкалы, верх — чтобы не резать столбцы
  const w = ось + пд.length * bw + 36;               // справа запас под подпись последней контрольной точки
  const рядОтметок = Math.max(1, ...пд.map(d => new Set(d.выходы.map(тип)).size));
  const низ = верх + h + 6 + рядОтметок * 10;
  const среднее = пдФакт.reduce((a, d) => a + d.мест, 0) / пдФакт.length;
  let s = `<div class="scroll"><svg viewBox="0 0 ${w} ${низ + 16}" style="width:${w}px;max-width:none;height:${низ + 16}px">`;
  for (let v = 0; v <= max; v += шаг) {
    const yy = верх + h - v / max * h;
    s += `<line x1="${ось - 4}" x2="${w}" y1="${yy}" y2="${yy}" stroke="${v ? '#2a2338' : '#3a3248'}" stroke-width="1"/>` +
      `<text x="${ось - 7}" y="${yy + 3.5}" font-size="10" fill="#a69fb3" text-anchor="end">${v}</text>`;
  }
  const Y = v => верх + h - v / max * h;
  const первоеБудущее = пд.findIndex(d => d.будущее);
  if (первоеБудущее >= 0)
    s += `<rect x="${ось + первоеБудущее * bw}" y="${верх}" width="${(пд.length - первоеБудущее) * bw}" height="${h}" fill="#ffffff" opacity=".03"/>` +
      `<text x="${ось + первоеБудущее * bw + 4}" y="${верх + 11}" font-size="10" fill="#a69fb3">впереди</text>`;
  // линия «нужно для 80 %» — сплошная золотая через весь график
  s += `<line x1="${ось}" x2="${w}" y1="${Y(нужныйТемп)}" y2="${Y(нужныйТемп)}" stroke="#f0c34e" stroke-width="1.5"/>` +
    `<text x="${w - 4}" y="${Y(нужныйТемп) - 4}" font-size="10.5" fill="#f0c34e" text-anchor="end">нужно ${Math.round(нужныйТемп)} мест/день для ${Math.round(D.цель_загрузки * 100)} %</text>`;
  // ступенчатый план по контрольным точкам — от сегодняшнего дня до последней точки
  let путь = '';
  пд.forEach((d, i) => {
    if (вДату(d.дата) < СЕГ) return;
    const v = планНаДень(d); if (v == null) return;
    const x0 = ось + i * bw, x1 = x0 + bw;
    путь += (путь ? `L${x0},${Y(v)}` : `M${x0},${Y(v)}`) + `L${x1},${Y(v)}`;
  });
  if (путь) s += `<path d="${путь}" fill="none" stroke="#ff9f43" stroke-width="2" stroke-dasharray="6 3"/>`;
  точки.forEach(т => {
    const i = пд.findIndex(d => d.дата === т.дата); if (i < 0) return;
    const cx = ось + i * bw + bw / 2;
    s += `<circle cx="${cx}" cy="${Y(т.минимум)}" r="3.5" fill="#ff9f43"/>` +
      `<text x="${cx}" y="${Y(т.минимум) - 7}" font-size="10.5" fill="#ff9f43" text-anchor="middle">${т.дата.slice(0, 5)}: ${т.минимум}</text>`;
  });
  const yСр = верх + h - среднее / max * h;
  s += `<line x1="${ось}" x2="${w}" y1="${yСр}" y2="${yСр}" stroke="#d8d2e2" stroke-width="1" stroke-dasharray="4 3" opacity=".55"/>`;
  пд.forEach((d, i) => {
    const x = ось + i * bw + 2, вся = d.мест / max * h;
    const разбивка = источники.filter(к => поДню[i][к]).map(к => `${ИМЯ_ИСТОЧНИКА[к] || к} ${поДню[i][к]}`).join(', ');
    const подпись = `${d.дата}: ${d.мест} мест` + (разбивка ? ` (${разбивка})` : '') + ` · утро 08–11 ${d.утро ?? '—'}` +
      (d.выходы.length ? '\n' + d.выходы.map(x => `▲ ${тип(x)}: ${назв(x)}`).join('\n') : '');
    s += `<g><title>${подпись.replace(/</g, '&lt;')}</title>`;
    let y = верх + h;                                   // столбец снизу вверх: крупные источники ниже
    источники.forEach(к => {
      const v = поДню[i][к] || 0; if (!v) return;
      const hh = v / max * h; y -= hh;
      s += `<rect x="${x}" y="${y}" width="${bw - 4}" height="${hh}" fill="${цвет[к]}"/>`;
    });
    if (d.всплеск) s += `<rect x="${x - 1}" y="${верх + h - вся - 1}" width="${bw - 2}" height="${вся + 1}" fill="none" stroke="#f0c34e" stroke-width="1.5"/>`;
    [...new Set(d.выходы.map(тип))].forEach((т, k) => {
      типыЕсть.add(т);
      s += `<text x="${x + (bw - 4) / 2}" y="${верх + h + 14 + k * 10}" font-size="10" fill="${ЦВЕТ_ТИПА[т] || '#d8d2e2'}" text-anchor="middle">▲</text>`;
    });
    s += `</g>`;
    if (i % 4 === 0) s += `<text x="${x}" y="${низ + 12}" font-size="10" fill="#a69fb3">${d.дата.slice(0, 5)}</text>`;
  });
  // легенда строится из того, что есть в данных: новый агент или тип канала появится в ней сам
  const метка = (стиль, текст) => `<span style="display:inline-flex;align-items:center;gap:6px;margin:0 16px 4px 0">` +
    `<span style="display:inline-block;width:12px;height:12px;border-radius:2px;${стиль}"></span>${текст}</span>`;
  const треуг = (c, текст) => `<span style="display:inline-flex;align-items:center;gap:6px;margin:0 16px 4px 0">` +
    `<span style="color:${c};font-size:13px">▲</span>${текст}</span>`;
  const легПродаж = источники.map(к => метка('background:' + цвет[к], ИМЯ_ИСТОЧНИКА[к] || к)).join('') +
    метка('border:2px solid #f0c34e;width:9px;height:9px', 'всплеск') +
    `<span style="display:inline-flex;align-items:center;gap:6px;margin:0 16px 4px 0"><span style="display:inline-block;width:14px;border-top:1px dashed #d8d2e2"></span>среднее ${среднее.toFixed(1).replace('.', ',')} мест/день</span>` +
    `<span style="display:inline-flex;align-items:center;gap:6px;margin:0 16px 4px 0"><span style="display:inline-block;width:14px;border-top:2px solid #f0c34e"></span>нужно для ${Math.round(D.цель_загрузки * 100)} %</span>` +
    (точки.length ? `<span style="display:inline-flex;align-items:center;gap:6px;margin:0 16px 4px 0"><span style="display:inline-block;width:14px;border-top:2px dashed #ff9f43"></span>план по контрольным точкам</span>` : '') +
    '<span style="margin:0 16px 4px 0">шкала слева — мест в день</span>';
  const легВыходов = Object.keys(ЦВЕТ_ТИПА).filter(т => типыЕсть.has(т)).map(т => треуг(ЦВЕТ_ТИПА[т], т)).join('');
  return эл('div', '', s + '</svg></div>' +
    '<div class="hint" style="display:flex;flex-wrap:wrap;align-items:center;margin-bottom:2px">' +
    '<span style="margin:0 10px 4px 0;color:#efeaf4">Продажи по источникам:</span>' + легПродаж + '</div>' +
    '<div class="hint" style="display:flex;flex-wrap:wrap;align-items:center">' +
    '<span style="margin:0 10px 4px 0;color:#efeaf4">Выходы рекламы:</span>' + легВыходов +
    '<span style="margin-bottom:4px">Наведите на столбец — подробности.</span></div>');
}

      `<b>После выхода:</b> ссылка или скриншот в «подтверждение» — статус сам станет «вышло». Находки автопроверки ` +
      `(«обнаружено») перенесите в журнал, если это ваш выход.<br>` +
      `<b>Атрибуция:</b> свой промокод на каждый канал (название видно в колонке «Скидки»), UTM-метки на ссылках ` +
      `в womanmusical.ru — источник покажет Метрика.<br>` +
      `<b>Раз в неделю:</b> кратность и цена места по каналам. Канал, который стабильно даёт ×1, не работает.<br>` +
      `<b>Колонки журнала:</b> дата_начала;дата_конца;канал;формат;режим;кампания;статус;охват_план;охват_факт;` +
      `бюджет;подтверждение;промокод;примечание`));
}

/* ---------- 6. как покупают — урок для своих продаж ---------- */
// столбики: подпись под каждым, значение над самым высоким и при наведении
function столбики(знач, подписи, цвет, заголовок) {
  const макс = Math.max(...знач, 1), лучший = знач.indexOf(Math.max(...знач));
  const бары = знач.map((v, i) => `<div class="bs" title="${подписи[i]}: ${ч(v)}">` +
    `<div class="bs-v">${i === лучший ? ч(v) : ''}</div>` +
    `<div class="bs-b" style="height:${Math.max(2, 86 * v / макс)}px;background:${цвет};opacity:${i === лучший ? 1 : .55}"></div>` +
    `<div class="bs-l">${подписи[i]}</div></div>`).join('');
  return `<div><div style="color:#cfc8da;font-size:12px;margin-bottom:6px">${заголовок}</div><div class="bars">${бары}</div></div>`;
}

  p.append(эл('h2', '', свои ? 'Как покупают — урок для своих продаж' : 'Как покупают'),
    эл('div', 'hint', `Все платные места, включая позже возвращённые (момент покупки был): ${ч(П.мест)} мест в ${ч(П.заказов)} заказах. ` +
      (свои ? 'Здесь не «сколько продали», а «как ведёт себя покупатель» — это переносится на следующий проект.'
            : 'Здесь не «сколько продали», а «как ведёт себя покупатель».')));
  // за сколько дней до показа — недельными корзинами
  const корз = [[0, 7, '0–7'], [8, 14, '8–14'], [15, 21, '15–21'], [22, 28, '22–28'], [29, 35, '29–35'],
    [36, 42, '36–42'], [43, 56, '43–56'], [57, 999, '57+']];
  const зар = Object.entries(П.заранее).map(([d, n]) => [+d, n]);
  const поКорз = корз.map(([a, b]) => зар.filter(([d]) => d >= a && d <= b).reduce((s, [, n]) => s + n, 0));
  const размеры = Object.entries(П.размер_заказа).map(([k, v]) => [+k, v]);
  const разм = [1, 2, 3, 4, 5].map(k => k < 5 ? (размеры.find(x => x[0] === k) || [0, 0])[1]
    : размеры.filter(x => x[0] >= 5).reduce((s, x) => s + x[1], 0));
  const дни = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
  p.append(эл('div', '', '<div style="display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:10px">' +
    столбики(поКорз, корз.map(x => x[2]), '#ff2f6d', 'За сколько дней до показа купили (мест)') +
    столбики(П.часы, П.часы.map((_, i) => i % 3 ? '' : String(i)), '#f0c34e', 'Час покупки, МСК (мест)') +
    столбики(П.дни_недели, дни, '#7aa2ff', 'День недели покупки (мест)') +
    столбики(разм, ['1', '2', '3', '4', '5+'], '#57c98a', 'Мест в заказе (заказов)') + '</div>'));
  // главное — словами
  const все = зар.flatMap(([d, n]) => Array(n).fill(d)).sort((a, b) => a - b);
  const мед = все.length ? все[Math.floor(все.length / 2)] : 0;
  const зак = П.заказов || 1, пар = (размеры.find(x => x[0] === 2) || [0, 0])[1], чет = (размеры.find(x => x[0] === 4) || [0, 0])[1];
  const пикЧ = [...П.часы.keys()].sort((a, b) => П.часы[b] - П.часы[a]).slice(0, 3).sort((a, b) => a - b);
  const лучшД = П.дни_недели.indexOf(Math.max(...П.дни_недели)), худД = П.дни_недели.indexOf(Math.min(...П.дни_недели));
  p.append(эл('div', 'note',
    `<b>Покупают заранее:</b> половина мест куплена за ${мед} дн. до показа и раньше — рекламу под показ начинать за 5–6 недель. ` +
    `<b>Покупают парами:</b> ${пр(пар / зак, 0)} заказов на двоих, ${пр(чет / зак, 0)} на четверых — продаём вечер для пары и стол на компанию. ` +
    `<b>Когда:</b> пики в ${пикЧ.map(h => h + ':00').join(', ')}; сильнее всего ${дни[лучшД]}, слабее всего ${дни[худД]} — ` +
    `в эти окна ставить рассылки, посты и запуск рекламы.`));

  // ── Д2: свой канал против Афиши (в партнёрской версии данных нет — раздела нет) ──
  const Н = П.недели || [];
  if (Н.length) {
  p.append(эл('h2', '', 'Свой канал против Афиши'),
    эл('div', 'hint', 'Проданные места по неделям. «Виджет» — это womanmusical.ru и наш metelitsaclub1.ru вместе: ' +
      'кабинет их пока не различает (запрошен отдельный clientKey). Комиссия Афиши 8 %, виджета 4 %: ' +
      '«сэкономлено» — сколько взяла бы Афиша с тех же продаж сверх того, что взял виджет.'));
  const экон = н => н.сумма_виджета * 0.08 - н.комиссия_виджета;
  const колК = [{имя: 'Неделя с', числовая: false}, {имя: 'Афиша, мест'}, {имя: 'Виджет, мест'}, {имя: 'Доля виджета'},
    {имя: 'Комиссия Афиши'}, {имя: 'Комиссия виджета'}, {имя: 'Сэкономлено', подсказка: 'сумма продаж виджета × 8 % − фактическая комиссия виджета'}];
  const рядыК = Н.map(н => [н.неделя.slice(8) + '.' + н.неделя.slice(5, 7), ч(н.афиша), ч(н.виджет),
    пр(н.виджет / Math.max(1, н.афиша + н.виджет), 0), р(н.комиссия_афиши), р(н.комиссия_виджета),
    {класс: 'up', html: р(экон(н))}]);
  const с = k => Н.reduce((a, н) => a + н[k], 0);
  p.append(таблица(колК, рядыК, ['ИТОГО', ч(с('афиша')), ч(с('виджет')), пр(с('виджет') / Math.max(1, с('афиша') + с('виджет')), 0),
    р(с('комиссия_афиши')), р(с('комиссия_виджета')), р(Н.reduce((a, н) => a + экон(н), 0))]));
  p.append(эл('div', 'note', `Если бы все проданные места шли через свой сайт по 4 %, комиссия была бы меньше на ` +
    `<b>${р(с('комиссия_афиши') - с('сумма_афиши') * 0.04)}</b>. Это цена вопроса «научиться приводить покупателя на свой сайт».`));
  }

  // ── Д3: спрос по ценам ──
  const квоты = {};
  if (ПИСЬМО) ПИСЬМО.показы.forEach(s => s.цены.forEach(c => { квоты[c.цена] = (квоты[c.цена] || 0) + (c.квота || 0); }));
  const продано = {};
  СОБ.forEach(e => e.цены.forEach(c => { продано[c.цена] = (продано[c.цена] || 0) + c.продано; }));
  // в письме оператора сеты идут в том же списке цен по 2 000 ₽ (≈822 позиции на показ) — это еда, не места
  const цены = [...new Set([...Object.keys(квоты), ...Object.keys(продано)].map(Number))].filter(ц => ц >= 3000).sort((a, b) => a - b);
  const мед2 = Object.fromEntries((П.цены || []).map(x => [x.цена, x.медиана_дней]));
  const всегоП = цены.reduce((a, ц) => a + (продано[ц] || 0), 0) || 1;
  p.append(эл('h2', '', 'Спрос по ценам'),
    эл('div', 'hint', 'Какая ценовая ступень раскупается первой. Квота по ценам — из последнего письма оператора ' +
      (ПИСЬМО ? `(${ПИСЬМО.показы.length} показов)` : '(письма нет)') + ', продано — из выгрузки кабинета. ' +
      '«Покупают за» — медиана дней от покупки до показа: чем больше, тем раньше ступень разбирают.'));
  const рядыЦ = цены.map(ц => { const к = квоты[ц] || 0, п = продано[ц] || 0;
    return [ч(ц) + ' ₽', к ? ч(к) : {класс: 'zero', html: '—'}, п ? ч(п) : {класс: 'zero', html: '0'},
      к ? {html: `<span style="background:rgba(255,47,109,${(0.1 + 0.9 * Math.min(1, п / к)).toFixed(2)});padding:2px 7px;border-radius:5px">${пр(п / к, 1)}</span>`}
        : {класс: 'zero', html: '—'},
      пр(п / всегоП, 0), мед2[ц] != null ? String(мед2[ц]).replace('.', ',') + ' дн.' : {класс: 'zero', html: '—'}]; });
  p.append(таблица([{имя: 'Цена места', числовая: false}, {имя: 'Квота'}, {имя: 'Продано'}, {имя: 'Раскуплено'},
    {имя: 'Доля продаж'}, {имя: 'Покупают за', подсказка: 'медиана дней от покупки до показа'}], рядыЦ));
  const раск = цены.filter(ц => квоты[ц]).map(ц => [ц, (продано[ц] || 0) / квоты[ц]]).sort((a, b) => b[1] - a[1]);
  if (раск.length) p.append(эл('div', 'note', `Быстрее всего раскупается ступень <b>${раск.slice(0, 2).map(x => ч(x[0]) + ' ₽ (' + пр(x[1], 1) + ')').join(', ')}</b>, ` +
    `медленнее всего — <b>${раск.slice(-2).map(x => ч(x[0]) + ' ₽ (' + пр(x[1], 1) + ')').join(', ')}</b>. ` +
    (свои ? 'Для своего проекта: ' : '') + 'объём делает нижняя ступень, дорогие столы продаются штучно и требуют отдельной работы (корпоративы, подарки).'));
}

function панельПросмотров(p) {
  p.append(эл('h2', '', 'Кто смотрит дашборд'),

      'открытии. Имя берётся из личной ссылки <b>…/?от=имя</b> или из списка, который ведём мы: скажите «устройство a3f9c1 — это Анвер». ' +
      '<b>Экран</b> — открыл страницу, <b>вход</b> — ввёл пароль, <b>авто</b> — пароль уже был сохранён.'));
  const box = эл('div', 'note', 'Загружаю журнал просмотров…'); p.append(box);
  if (!window.КЛЮЧ_ПРОСМОТРОВ) { box.textContent = 'Журнал виден только во внутренней версии после ввода пароля.'; return; }
  fetch('https://puls.metelitsaclub1.ru/s.php?k=' + window.КЛЮЧ_ПРОСМОТРОВ, {cache: 'no-store'}).then(r => r.json()).then(Ж => {
    const экр = x => String(x == null ? '' : x).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
    const имена = Ж.имена && !Array.isArray(Ж.имена) ? Ж.имена : {};
    const все = (Ж.просмотры || []).filter(z => z.v === 'п' || z.v === 'н');
    if (!все.length) { box.textContent = 'Пока никто не открывал — журнал ведётся с 15.10.2026.'; return; }
    const дев = ua => {
      const у = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android' : /Mac OS X/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : 'другое';
      const б = /YaBrowser/.test(ua) ? 'Яндекс Браузер' : /Telegram/.test(ua) ? 'Telegram' : /CriOS|Chrome/.test(ua) && !/Edg/.test(ua) ? 'Chrome' : /Edg/.test(ua) ? 'Edge' : /Firefox/.test(ua) ? 'Firefox' : /Safari/.test(ua) ? 'Safari' : '';
      return у + (б ? ' · ' + б : '');
    };
    const уст = {};
    все.forEach(z => {
      const u = уст[z.d] = уст[z.d] || {d: z.d, от: '', экран: 0, вход: 0, первый: z.t, последний: z.t, версии: new Set(), ip: new Set(), ua: z.ua};
      if (z.o) u.от = z.o;
      if (z.e === 'экран') u.экран++; else u.вход++;
      u.последний = z.t; u.версии.add(z.v === 'п' ? 'партнёрская' : 'наша'); u.ip.add(z.ip);
    });
    const ряды = Object.values(уст).sort((a, b) => b.последний.localeCompare(a.последний));
    const дт = t => t.slice(8, 10) + '.' + t.slice(5, 7) + ' ' + t.slice(11, 16);
    box.remove();
    p.append(таблица([{имя: 'Кто', числовая: false}, {имя: 'Устр.', числовая: false}, {имя: 'Устройство', числовая: false},
      {имя: 'Версия', числовая: false}, {имя: 'Открыл'}, {имя: 'Вошёл'}, {имя: 'Первый раз', числовая: false},
      {имя: 'Последний', числовая: false}, {имя: 'IP', числовая: false}],
      ряды.map(u => ({ячейки: [
        имена[u.d] || u.от ? {html: `<b>${экр(имена[u.d] || u.от)}</b>`} : {класс: 'zero', html: 'не определён'},
        экр(u.d), дев(u.ua), [...u.версии].join(', '), ч(u.экран), u.вход ? ч(u.вход) : {класс: 'zero', html: '0'},
        дт(u.первый), дт(u.последний), экр([...u.ip].slice(-2).join(', '))]})),
      null));
    p.append(эл('h3', '', 'Последние открытия'), таблица([{имя: 'Когда', числовая: false}, {имя: 'Кто', числовая: false},
      {имя: 'Событие', числовая: false}, {имя: 'Версия', числовая: false}, {имя: 'Устройство', числовая: false}],
      все.slice(-40).reverse().map(z => ({ячейки: [дт(z.t), экр(имена[z.d] || z.o || z.d), экр(z.e), z.v === 'п' ? 'партнёрская' : 'наша', дев(z.ua)]})), null));
  }).catch(() => { box.textContent = 'Журнал просмотров не загрузился — хостинг не ответил.'; });
}

function панельЗапросов(p) {

  const срок = s => s && s.length === 10 ? s.slice(6) + '-' + s.slice(3, 5) + '-' + s.slice(0, 2) : '';
  const просрочен = z => ['ждём', 'не отправлено'].includes(z.статус) && срок(z.срок) && срок(z.срок) < сег;
  const счёт = {}; З.forEach(z => { счёт[z.статус] = (счёт[z.статус] || 0) + 1; });
  const просроч = З.filter(просрочен).length;
  p.append(эл('h2', '', 'Запросы партнёрам'),

      'Правится в файле <code>отчёты-продаж/запросы-партнёрам.csv</code> (статусы: не отправлено, ждём, получено, отказ).'));
  p.append(эл('div', 'note', Object.entries(счёт).map(([k, v]) => `${k}: <b>${v}</b>`).join(' · ') +
    (просроч ? ` · <span class="down">просрочено: <b>${просроч}</b></span>` : '')));
  const цвет = {получено: 'up', отказ: 'down', ждём: 'gold', 'не отправлено': 'dim'};

    {класс: цвет[z.статус] || '', html: z.статус || ''}, z.ответ || '']}));

    {имя: 'Зачем', числовая: false}, {имя: 'Срок', числовая: false}, {имя: 'Статус', числовая: false},
    {имя: 'Ответ', числовая: false}], ряды));

}

/* ---------- каналы по показам (14.10.2026) — как отчёт кабинета «По каналам продаж» ---------- */
const прошёл = s => { const [д, м, г] = s.дата.split('.'); const т = new Date(); т.setHours(0, 0, 0, 0); return new Date(+г, +м - 1, +д) < т; };
function панельКаналов(p) {
  p.append(эл('h2', '', 'Каналы по показам — как в кабинете'),
    эл('div', 'hint', 'Отчёт кабинета «По событию → по агентам» по каждому показу. Билет = место или сет (как у коллег); ' +
      'в скобках — из них мест. Пригласительные — билеты по 0 ₽. Авторский ужин — отдельное событие на ту же дату.'));
  const сКаб = СОБ.filter(s => s.кабинет && s.кабинет.каналы && !s.отмена && (s.в_продаже || прошёл(s)));
  if (!сКаб.length) { p.append(эл('div', 'note', 'Отчёты по событиям ещё не собраны.')); return; }
  const все = {}; сКаб.forEach(s => Object.entries(s.кабинет.каналы).forEach(([к, x]) => { все[к] = (все[к] || 0) + x.мест + x.сетов; }));
  const имена = Object.keys(все).filter(к => все[к] > 0).sort((a, b) => все[b] - все[a]);   // каналы без продаж не показываем
  const коротко = к => к.replace(/\[\d+\/\d+\] Субагент: /, '').replace(/ — МД .*/, '')
    .replace('Яндекс Виджет (лендинг мероприятия)', 'Виджет лендинг').replace('Яндекс Виджет (сайт площадки)', 'Виджет сайт').replace('Яндекс Виджет', 'Виджет');
  const кол = [{имя: 'Показ', числовая: false}, ...имена.map(к => ({имя: коротко(к)})), {имя: 'Пригласит.'},
    {имя: 'Ужин'}, {имя: 'Итого билетов'}, {имя: 'Сумма'}, {имя: 'Мест (зрит.)'}, {имя: 'Придержано'}, {имя: 'Явка'}];
  const ряды = сКаб.map(s => { const к = s.кабинет; return {
    класс: прошёл(s) ? 'нет' : '',
    ячейки: [`${s.дата} <span class="dim">${s.время}</span>` + (прошёл(s) ? '<span class="tag">прошёл</span>' : ''),
      ...имена.map(и => { const x = к.каналы[и]; return x && (x.мест + x.сетов) ? {html: `${ч(x.мест + x.сетов)} <span class="dim">(${ч(x.мест)})</span>`, title: `${x.мест} мест + ${x.сетов} сетов · ${р(x.сумма)}`} : {класс: 'zero', html: '—'}; }),
      (к.приглашения.мест + к.приглашения.сетов) ? {html: `${ч(к.приглашения.мест + к.приглашения.сетов)} <span class="dim">(${ч(к.приглашения.мест)})</span>`} : {класс: 'zero', html: '—'},
      к.ужин_билетов ? ч(к.ужин_билетов) : {класс: 'zero', html: '—'},
      {html: `<b>${ч(к.итого_билетов)}</b>`}, р(к.итого_сумма), ч(s.места.продано),
      к.придержано_всего ? ч(к.придержано_всего) : {класс: 'zero', html: '—'},
      к.явка ? ч(к.явка.пришло + к.явка.пришло_по_приглашениям) : {класс: 'zero', html: '—'}]}; });
  const ИК = И.кабинет || {каналы: {}};
  const итог = ['ИТОГО в продаже', ...имена.map(и => ИК.каналы[и] ? ч(ИК.каналы[и].мест + ИК.каналы[и].сетов) : '—'),
    ч(ИК.приглашений || 0), ч(ИК.ужинов || 0), ч(ИК.билетов || 0), р(ИК.сумма || 0), ч(И.продано), ч(ИК.придержано || 0), ''];
  p.append(таблица(кол, ряды, итог));
  p.append(эл('div', 'note', 'Сверка: «Итого билетов» по показу совпадает со столбцом «Итого» отчёта кабинета «По каналам продаж» ' +
    '(с пригласительными). «Мест (зрит.)» — сколько людей придёт: места без сетов. «Придержано» — Склад и «НЕ выводить в продажу».'));
}

const ПАМЯТЬ = 'очмж_пароль';   // у каждой версии свой ключ: обе на одном домене и иначе затирали пароль друг другу
const СРОК = 30 * 24 * 60 * 60 * 1000;   // пароль помнится на устройстве месяц
const б64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
// 15.10.2026: учёт просмотров (кто из партнёров смотрит) — журнал на нашем хостинге, во внутренней версии вкладка «Кто смотрит».
// Устройство — случайный номер в браузере; «от» — имя из личной ссылки ?от=имя, запоминается на устройстве.
const ВЕРСИЯ = 'п', СЧЁТ = 'https://puls.metelitsaclub1.ru/v.php';
function устройство() {
  try { let d = localStorage.getItem('очмж_уст');
    if (!d) { d = Array.from(crypto.getRandomValues(new Uint8Array(3)), b => b.toString(16).padStart(2, '0')).join(''); localStorage.setItem('очмж_уст', d); }
    return d; } catch (e) { return ''; }
}
function кто() {
  try { const о = new URLSearchParams(location.search).get('от');
    if (о) { localStorage.setItem('очмж_от', о); return о; }
    return localStorage.getItem('очмж_от') || ''; } catch (e) { return ''; }
}
function отметить(событие) {
  try { const п = СЧЁТ + '?' + new URLSearchParams({e: событие, v: ВЕРСИЯ, o: кто(), d: устройство(), w: screen.width + 'x' + screen.height, h: location.hostname});
    if (!(navigator.sendBeacon && navigator.sendBeacon(п))) fetch(п, {mode: 'no-cors', keepalive: true}); } catch (e) {}
}
отметить('экран');
async function расшифровать(пароль) {
  const км = await crypto.subtle.importKey('raw', new TextEncoder().encode(пароль),
    'PBKDF2', false, ['deriveKey']);
  const ключ = await crypto.subtle.deriveKey(
    {name: 'PBKDF2', salt: б64(ШИФР.соль), iterations: ШИФР.итераций, hash: 'SHA-256'},
    км, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const открыто = await crypto.subtle.decrypt({name: 'AES-GCM', iv: б64(ШИФР.iv)},
    ключ, б64(ШИФР.данные));
  // 10.10.2026: данные сжаты gzip до шифрования (шифротекст не сжимается) — 1,9 МБ → ~0,1 МБ
  if (ШИФР.сжато === 'gzip') {
    const поток = new Blob([открыто]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(поток).text());
  }
  return JSON.parse(new TextDecoder().decode(открыто));
}

// Пароль лежит только в браузере того, кто его ввёл: на сервер не уходит,
// другим устройствам не виден. Через месяц отчёт спросит его снова.
function запомнить(пароль) {
  try { localStorage.setItem(ПАМЯТЬ, JSON.stringify({п: пароль, до: Date.now() + СРОК})); } catch (e) {}
}
function вспомнить() {
  try {
    const с = JSON.parse(localStorage.getItem(ПАМЯТЬ) || 'null');
    if (с && с.до > Date.now() && с.п) return с.п;
    localStorage.removeItem(ПАМЯТЬ);
  } catch (e) {}
  return null;
}
function забыть() { try { localStorage.removeItem(ПАМЯТЬ); } catch (e) {} }

async function войти(пароль, авто) {
  применитьДанные(await расшифровать(пароль));
  document.getElementById('lock').remove();
  // ключ чтения журнала просмотров — SHA-256 пароля внутренней версии (на сервер уходит только он)
  if (ВЕРСИЯ === 'н') window.КЛЮЧ_ПРОСМОТРОВ = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',
    new TextEncoder().encode(пароль))), b => b.toString(16).padStart(2, '0')).join('');
  запустить();
  отметить(авто ? 'авто' : 'вход');
}

// 09.10.2026: страница ~2,5 МБ, обработчик — в конце. Пока он не подключён, кнопка неактивна,
// а ранний Enter не перезагружает страницу (onsubmit="return false" в форме).
{ const кн0 = document.getElementById('go'); кн0.disabled = false; кн0.style.opacity = ''; кн0.textContent = 'Открыть'; }
document.getElementById('lockform').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = document.getElementById('err'), кн = document.getElementById('go');
  if (!window.crypto || !crypto.subtle) {
    err.textContent = 'Браузер не даёт расшифровать: откройте отчёт по ссылке https, а не как файл.';
    return;
  }
  err.textContent = ''; кн.disabled = true; кн.textContent = 'Расшифровываю…';
  // 26.09.2026: пароль «не подходил» — прощаем пробелы при копировании и русскую раскладку
  const введено = document.getElementById('pw').value;
  const рус = 'йцукенгшщзхъфывапролджэячсмитьбю.ё', лат = "qwertyuiop[]asdfghjkl;'zxcvbnm,./`";
  const вЛат = s => [...s].map(c => { const i = рус.indexOf(c.toLowerCase()); return i < 0 ? c : лат[i]; }).join('');
  const варианты = [...new Set([введено, введено.trim(), вЛат(введено.trim())])];
  try {
    let вошли = false;
    for (const пароль of варианты) {
      try { await войти(пароль); запомнить(пароль); вошли = true; break; } catch (e) {}
    }
    if (!вошли) throw new Error('пароль');
  } catch (e) {
    забыть();
    err.textContent = 'Неверный пароль';
    кн.disabled = false; кн.textContent = 'Открыть';
    document.getElementById('pw').select();
  }
});

// Если пароль на этом устройстве уже вводили — открываем сразу, без вопросов.
(async () => {
  const сохранённый = вспомнить();
  if (!сохранённый || !window.crypto || !crypto.subtle) {
    document.getElementById('pw').focus();
    return;
  }
  const форма = document.getElementById('lockform');
  форма.style.visibility = 'hidden';
  try {
    await войти(сохранённый, true);
  } catch (e) {
    забыть();
    форма.style.visibility = '';
    document.getElementById('err').textContent = 'Пароль изменился — введите новый';
    document.getElementById('pw').focus();
  }
})();

<div id="свежесть" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:#ff2f6d;color:#fff;padding:11px 16px;font:600 14px/1.4 -apple-system,system-ui,sans-serif;

  <button onclick="location.reload(true)" style="background:#fff;color:#ff2f6d;border:0;border-radius:8px;
    padding:7px 14px;font:700 13px system-ui;cursor:pointer">Обновить</button>
</div>
<script>
const СБОРКА = '15.10.2026 14:55';
async function проверитьСвежесть() {
  try {
    // 10.10.2026: метка — в самом начале файла; читаем первые куски и обрываем загрузку,
    // а не качаем всю страницу заново (на медленном хостинге это тормозило первое открытие)
    const ответ = await fetch(location.pathname + '?v=' + Date.now(), {cache: 'no-store'});
    const чтец = ответ.body.getReader(), дек = new TextDecoder();
    let текст = '', m = null;
    while (!m && текст.length < 4096) {
      const {value, done} = await чтец.read();
      if (done) break;
      текст += дек.decode(value, {stream: true});
      m = текст.match(/<!--СБОРКА:([^>]+)-->/);
    }
    чтец.cancel().catch(() => {});
    if (m && m[1] !== СБОРКА) {
      const п = document.getElementById('свежесть');
      п.style.display = 'flex';
    }
  } catch (e) {}
}
setInterval(проверитьСвежесть, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) проверитьСвежесть(); });
setTimeout(проверитьСвежесть, 60 * 1000);   // не в первую минуту — не мешать загрузке
</script>
