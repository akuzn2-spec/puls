const pan = [...document.querySelectorAll('div.panel')].find(p => (p.querySelector('h2')||{}).innerText?.startsWith('Отчёты по проведённым'));
if (!pan) return 'нет панели';
if (!document.getElementById('кп-стиль')) { const st = document.createElement('style'); st.id = 'кп-стиль'; st.textContent = CFG.css; document.head.append(st); }

const T = e => (e && (e.innerText || e.textContent) || '').trim(); // textContent — для скрытого в закрытых <details>
const N = e => T(e).replace(/\u00a0/g, ' ');
const EL = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const деталь = (заг, кл) => { const d = EL('details', кл || 'кп-подробнее'); d.append(EL('summary', '', заг)); return d; };
// ---------- отметка план/факт ----------
const пфТабл = tb => { const o = {}; [...tb.rows].slice(1).forEach(r => { const c = [...r.cells].map(T); o[c[0]] = {план:c[1], бу:c[2], факт:c[3], проц:c[4], разн:c[5], tr:r}; }); return o; };
const отм = r => {
 if (!r) return null;
 if (!r.разн || r.разн === '—' || r.факт === '—') return {к:'кп-ждём', т:'ждём данные после показа'};
 const n = r.разн.replace(/^[−+\-]\s*/, '');
 if (/^[−-]/.test(r.разн)) return {к:'кп-нет', т:'✗ не хватает ' + n};
 return {к:'кп-ок', т:'✓ план выполнен' + (n !== '0' ? ', сверх ' + n : '')};
};
const пометитьТабл = tb => { const o = пфТабл(tb); Object.values(o).forEach(r => { const m = отм(r); if (m && m.к !== 'кп-ждём') r.tr.cells[5].innerHTML = `<span class="кп-отм ${m.к}">${m.т}</span>`; }); return o; };
const ПФ_ШАПКА = {'Поток':'Что считаем','План (100 %)':'План','Безубыточность (80 %)':'Без убытка (80 % плана)','Факт':'Сделали','Выполнение':'Выполнили','Разница с планом':'Отметка'};
const ПФ_СТРОКИ = {'Билеты (места)':'Деньги за билеты','Сеты (счёт КК + на шоу)':'Деньги за ужины (сеты)','Средний чек бара':'Бар на одного гостя'};
const упроститьПФ = tb => { [...tb.rows].forEach((r, i) => [...r.cells].forEach((c, j) => { const t = T(c);
  if (i === 0 && ПФ_ШАПКА[t]) c.textContent = ПФ_ШАПКА[t]; if (i > 0 && j === 0 && ПФ_СТРОКИ[t]) c.textContent = ПФ_СТРОКИ[t]; })); };
const главн = (v, подп, r, нетпл) => { const w = EL('div', 'кп-главн-блок');
 const пусто = !v || v === '—' || !/\d/.test(v);
 w.append(EL('div', 'кп-главн' + (пусто ? ' кп-нетданных' : ''), пусто ? 'появится после показа' : v));
 if (подп) w.append(EL('div', 'кп-подп', подп));
 const m = отм(r);
 if (m) w.append(EL('div', 'кп-план', (r.план ? `план ${r.план}` : '') + ` <span class="кп-отм ${m.к}">${m.т}</span>`));
 else if (нетпл) w.append(EL('div', 'кп-план', `<span class="кп-отм кп-ждём">${нетпл}</span>`));
 return w; };
const блоки = []; // [элемент, тема, заголовок, где]
// 16.10.2026, Ал: план — 221 ПЛАТНЫЙ на шоу (80 % от 276), пригласительные в план не идут
const ПЛАН_ПЛ = 221, чс = x => Math.round(x).toLocaleString('ru-RU'), числ = t => +(String(t || '').replace(/[^\d]/g, '') || 0);
const рПл = (пл, план) => ({план: чс(план) + ' платных', факт: чс(пл), разн: (пл >= план ? '+' : '−') + чс(Math.abs(пл - план))});

// ---------- легенда вверху ----------
const h = [...pan.children].find(e => e.classList.contains('hint'));
if (h) { const d = деталь('Откуда берутся цифры', 'кп-подробнее кп-откуда'); h.before(d); d.append(h);
 d.before(EL('div', 'кп-легенда', '<b>Как читать:</b> каждый блок отвечает на один вопрос. Крупная цифра — главное. Рядом план и отметка: <span class="кп-отм кп-ок">✓ выполнили</span> <span class="кп-отм кп-нет">✗ не хватает</span>. Остальное — под «Подробнее».<br><span class="кп-слов">Сет — ужин к спектаклю · организатор — «Красный Квадрат» (КК) · касса бара — iiko · пропуска на входе — СКД</span>')); }

// ---------- сводка ----------
const s = pan.querySelector('div.сжато');
const гр = []; let cur = null;
[...s.children].forEach(c => { const t = T(c);
 if (c.tagName === 'H3') { cur = {к: t === 'Люди' ? 'люди' : 'деньги', эл: [c]}; гр.push(cur); }
 else if (t.startsWith('План / факт')) { cur = {к: 'пф', эл: [c]}; гр.push(cur); }
 else if (cur) cur.эл.push(c); });
s.classList.add('кп-сводка');
s.before(EL('div', 'кп-раздел', 'Все прошедшие показы вместе'));
const итог = tb => { const th = [...tb.querySelectorAll('thead th')].map(e => T(e).toUpperCase()); const tr = tb.querySelector('tr.total');
 const o = {}; if (tr) [...tr.cells].forEach((c, i) => o[th[i]] = (c.querySelector('b') ? T(c.querySelector('b')) : T(c)).split('\n')[0]); return o; };
const TH_ИМЕНА = {'НА ШОУ':'Гостей в зале','КУПИЛИ МЕСТО':'Купили место','ПРИГЛ.':'Пригласи­тельные','С СЕТОМ':'С ужином','БЕЗ СЕТА':'Без ужина','ДОЛЯ С СЕТОМ':'Доля с ужином',
 'СЕТЫ НА ШОУ':'Ужин докупили в зале','СЕТОВ ВСЕГО':'Всего ужинов','СЧЁТ КК':'Ужины: счёт организатору','СЕБЕСТ. СЕТОВ':'Ужины обошлись нам','РЕЗУЛЬТАТ СЕТОВ':'Итог по ужинам',
 'КАРТА':'Картой','НАЛ.':'Наличными','СР. БИЛЕТ':'Средний билет','СР. ЧЕК':'Бар на гостя','БЕЗ ОПЛАТЫ':'Без оплаты (угощения)','ЧЕКОВ':'Чеков в баре'};
гр.forEach(g => { const w = document.createElement('div'); g.эл[0].before(w); g.эл.forEach(e => w.append(e));
 const з = w.querySelector('h3'); const tb = w.querySelector('table');
 if (g.к === 'люди') { const o = итог(tb);
  з.textContent = 'Сколько людей пришло и что купили?';
  const hint = w.querySelector('.hint'); if (hint) hint.remove();
  const гл = главн(o['НА ШОУ'], 'гостей в зале на всех показах'); з.after(гл);
  гл.append(EL('div', 'кп-втор', `купили место <b>${o['КУПИЛИ МЕСТО']}</b> · пригласительные <b>${o['ПРИГЛ.']}</b> · взяли ужин с билетом <b>${o['С СЕТОМ']}</b>`));
  const d = деталь('Подробнее по каждому показу'); гл.after(d); d.append(w.querySelector('.scroll')); if (hint) d.append(hint);
 }
 if (g.к === 'деньги') { const o = итог(tb);
  з.textContent = 'Сколько денег получили?';
  const гл = главн(o['БИЛЕТЫ'], 'за билеты (места) на всех показах'); з.after(гл);
  гл.append(EL('div', 'кп-втор', `за ужины — счёт организатору <b>${o['СЧЁТ КК']}</b> · бар <b>${o['БАР']}</b>`));
  const d = деталь('Подробнее: по показам и способам оплаты'); гл.after(d); d.append(w.querySelector('.scroll'));
 }
 if (g.к === 'пф') { const n = (T(з).match(/\((\d+)\)/) || [])[1];
  з.textContent = 'Выполнили ли план?' + (n ? ` (показов с планом: ${n})` : '');
  const o = пометитьТабл(tb); упроститьПФ(tb);
  // 16.10.2026, Ал: «Гостей» против 276 → платные против 221 × проведённых показов с планом; пригласительные отдельно
  const тлюди = (гр.find(x => x.к === 'люди') || {}).эл; const тб = тлюди && тлюди.map(e => e.querySelector && e.querySelector('table')).find(Boolean);
  const сег = (typeof D !== 'undefined' && D.сегодня) ? D.сегодня.slice(8, 10) + '.' + D.сегодня.slice(5, 7) : '##';
  let плС = 0, пгС = 0, шС = 0;
  if (тб) { const h = [...тб.rows[0].cells].map(c => N(c).toUpperCase()), iПл = h.indexOf('КУПИЛИ МЕСТО'), iПг = h.indexOf('ПРИГЛ.');
    [...тб.rows].slice(1).forEach(r => { const c0 = T(r.cells[0]); if (!/^\d\d\.\d\d/.test(c0) || /промо/i.test(c0) || c0.startsWith(сег)) return;
      шС++; плС += числ(T(r.cells[iПл])); пгС += числ(T(r.cells[iПг])); }); }
  if (o['Гостей'] && шС) { const пг = рПл(плС, ПЛАН_ПЛ * шС); пг.доп = `+ ${чс(пгС)} пригласительных — в план не идут`;
    const нов = {'Платные гости': пг}; Object.keys(o).forEach(k => { if (k !== 'Гостей') нов[k] = o[k]; }); Object.keys(o).forEach(k => delete o[k]); Object.assign(o, нов); }
  const сп = EL('div', 'кп-список');
  Object.entries(o).forEach(([к, r]) => { const m = отм(r);
   сп.append(EL('div', 'кп-строка', `<span class="кп-что">${ПФ_СТРОКИ[к] || к}</span><span class="кп-сколько"><b>${r.факт}</b> · план ${r.план}${r.доп ? '<br><small style="opacity:.8">' + r.доп + '</small>' : ''}</span><span class="кп-отм ${m.к}">${m.т}</span>`)); });
  з.after(сп); const d = деталь('Подробнее: таблица с % и порогом «без убытка»'); сп.after(d); d.append(tb);
  [...w.querySelectorAll(':scope > div > *')].filter(e => e !== з && e !== сп && e !== d).forEach(e => d.append(e));
 }
 блоки.push([w, g.к, з, 'сводка']); });
[...s.querySelectorAll('th')].forEach(th => { const t = N(th).toUpperCase(); if (TH_ИМЕНА[t]) { const tn = [...th.childNodes].find(n => n.nodeType === 3 && n.textContent.trim()); if (tn) tn.textContent = TH_ИМЕНА[t]; else th.firstChild.textContent = TH_ИМЕНА[t]; } });

// ---------- карточки показов ----------
const К = {'Зрители':'люди','Билеты':'билеты','Сеты':'сеты','Бар (iiko)':'бар'};

    км, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const открыто = await crypto.subtle.decrypt({name: 'AES-GCM', iv: б64(ШИФР.iv)},
    ключ, б64(ШИФР.данные));
  // 10.10.2026: данные сжаты gzip до шифрования (шифротекст не сжимается) — 1,9 МБ → ~0,1 МБ
  if (ШИФР.сжато === 'gzip') {
    const поток = new Blob([открыто]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(поток).text());
  }
  return JSON.parse(new TextDecoder().decode(открыто));
}

// Пароль лежит только в браузере того, кто его ввёл: на сервер не уходит,
// другим устройствам не виден. Через месяц отчёт спросит его снова.
function запомнить(пароль) {
  try { localStorage.setItem(ПАМЯТЬ, JSON.stringify({п: пароль, до: Date.now() + СРОК})); } catch (e) {}
}
function вспомнить() {
  try {
    const с = JSON.parse(localStorage.getItem(ПАМЯТЬ) || 'null');
    if (с && с.до > Date.now() && с.п) return с.п;
    localStorage.removeItem(ПАМЯТЬ);
  } catch (e) {}
  return null;
}
function забыть() { try { localStorage.removeItem(ПАМЯТЬ); } catch (e) {} }

async function войти(пароль, авто) {
  применитьДанные(await расшифровать(пароль));
  document.getElementById('lock').remove();
  // ключ чтения журнала просмотров — SHA-256 пароля внутренней версии (на сервер уходит только он)
  if (ВЕРСИЯ === 'н') window.КЛЮЧ_ПРОСМОТРОВ = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',
    new TextEncoder().encode(пароль))), b => b.toString(16).padStart(2, '0')).join('');
  запустить();
  отметить(авто ? 'авто' : 'вход');
}

// 09.10.2026: страница ~2,5 МБ, обработчик — в конце. Пока он не подключён, кнопка неактивна,
// а ранний Enter не перезагружает страницу (onsubmit="return false" в форме).
{ const кн0 = document.getElementById('go'); кн0.disabled = false; кн0.style.opacity = ''; кн0.textContent = 'Открыть'; }
document.getElementById('lockform').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = document.getElementById('err'), кн = document.getElementById('go');
  if (!window.crypto || !crypto.subtle) {
    err.textContent = 'Браузер не даёт расшифровать: откройте отчёт по ссылке https, а не как файл.';
    return;
  }
  err.textContent = ''; кн.disabled = true; кн.textContent = 'Расшифровываю…';
  // 26.09.2026: пароль «не подходил» — прощаем пробелы при копировании и русскую раскладку
  const введено = document.getElementById('pw').value;
  const рус = 'йцукенгшщзхъфывапролджэячсмитьбю.ё', лат = "qwertyuiop[]asdfghjkl;'zxcvbnm,./`";
  const вЛат = s => [...s].map(c => { const i = рус.indexOf(c.toLowerCase()); return i < 0 ? c : лат[i]; }).join('');
  const варианты = [...new Set([введено, введено.trim(), вЛат(введено.trim())])];
  try {
    let вошли = false;
    for (const пароль of варианты) {
      try { await войти(пароль); запомнить(пароль); вошли = true; break; } catch (e) {}
    }
    if (!вошли) throw new Error('пароль');
  } catch (e) {
    забыть();
    err.textContent = 'Неверный пароль';
    кн.disabled = false; кн.textContent = 'Открыть';
    document.getElementById('pw').select();
  }
});

// Если пароль на этом устройстве уже вводили — открываем сразу, без вопросов.
(async () => {
  const сохранённый = вспомнить();
  if (!сохранённый || !window.crypto || !crypto.subtle) {
    document.getElementById('pw').focus();
    return;
  }
  const форма = document.getElementById('lockform');
  форма.style.visibility = 'hidden';
  try {
    await войти(сохранённый, true);
  } catch (e) {
    забыть();
    форма.style.visibility = '';
    document.getElementById('err').textContent = 'Пароль изменился — введите новый';
    document.getElementById('pw').focus();
  }
})();

</script>

<div id="свежесть" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:#ff2f6d;color:#fff;padding:11px 16px;font:600 14px/1.4 -apple-system,system-ui,sans-serif;
  display:none;align-items:center;justify-content:center;gap:14px">
  <span>Появилась свежая сборка дашборда</span>
  <button onclick="location.reload(true)" style="background:#fff;color:#ff2f6d;border:0;border-radius:8px;
    padding:7px 14px;font:700 13px system-ui;cursor:pointer">Обновить</button>
</div>
<script>
const СБОРКА = '16.10.2026 11:31';
async function проверитьСвежесть() {
  try {
    // 10.10.2026: метка — в самом начале файла; читаем первые куски и обрываем загрузку,
    // а не качаем всю страницу заново (на медленном хостинге это тормозило первое открытие)
    const ответ = await fetch(location.pathname + '?v=' + Date.now(), {cache: 'no-store'});
    const чтец = ответ.body.getReader(), дек = new TextDecoder();
    let текст = '', m = null;
    while (!m && текст.length < 4096) {
      const {value, done} = await чтец.read();
      if (done) break;
      текст += дек.decode(value, {stream: true});
      m = текст.match(/<!--СБОРКА:([^>]+)-->/);
    }
    чтец.cancel().catch(() => {});
    if (m && m[1] !== СБОРКА) {
      const п = document.getElementById('свежесть');
      п.style.display = 'flex';
    }
  } catch (e) {}
}
setInterval(проверитьСвежесть, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) проверитьСвежесть(); });
setTimeout(проверитьСвежесть, 60 * 1000);   // не в первую минуту — не мешать загрузке
</script>
