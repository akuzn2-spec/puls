// столбики: подпись под каждым, значение над самым высоким и при наведении
function столбики(знач, подписи, цвет, заголовок) {
  const макс = Math.max(...знач, 1), лучший = знач.indexOf(Math.max(...знач));
  const бары = знач.map((v, i) => `<div class="bs" title="${подписи[i]}: ${ч(v)}">` +
    `<div class="bs-v">${i === лучший ? ч(v) : ''}</div>` +
    `<div class="bs-b" style="height:${Math.max(2, 86 * v / макс)}px;background:${цвет};opacity:${i === лучший ? 1 : .55}"></div>` +
    `<div class="bs-l">${подписи[i]}</div></div>`).join('');
  return `<div><div style="color:#cfc8da;font-size:12px;margin-bottom:6px">${заголовок}</div><div class="bars">${бары}</div></div>`;
}
// 15.10.2026, Ал: прогноз по премьере — один на весь дашборд («Прогноз и темп продаж», вывод «Как покупают»).
// Эталон — премьера: сколько платных мест она добрала с N дней до показа; этот добор прибавляем к продажам показа.
let _докупка;
function докупка() {
  if (_докупка !== undefined) return _докупка;
  const КР = D.кривые || {}, ГРАН = 42;
  const сег = new Date(D.сегодня + 'T00:00:00'), вДату = s => new Date(s.slice(6, 10) + '-' + s.slice(3, 5) + '-' + s.slice(0, 2) + 'T00:00:00');
  const показы = СОБ.filter(s => !s.отмена && !s.служебное && !/ужин/i.test(s.название || '') && КР[s.дата + ' ' + s.время])
    .map(s => { const рас = КР[s.дата + ' ' + s.время];
      const нак = []; let сум = 0; for (let д = ГРАН; д >= 0; д--) { сум += Object.entries(рас).filter(([k]) => (д === ГРАН ? +k >= д : +k === д)).reduce((a, [, v]) => a + v, 0); нак[д] = сум; }
      return {s, нак, осталось: Math.round((вДату(s.дата) - сег) / 86400000), итого: сум}; });
  const эталон = показы.filter(x => x.осталось <= 0 && !(x.s.пометка || '').includes('промо')).sort((a, b) => b.итого - a.итого)[0];
  if (!эталон) return (_докупка = null);
  const нак = д => эталон.нак[Math.min(ГРАН, Math.max(0, д))];
  const доля = д => (эталон.итого - нак(д)) / Math.max(1, эталон.итого);
  const платные = Object.fromEntries(показы.map(x => [x.s.дата + ' ' + x.s.время, x.итого]));
  return (_докупка = {эталон, итого: эталон.итого, было: нак, платные, добор: д => (д <= 0 ? 0 : эталон.итого - нак(д)), п14: доля(14), п7: доля(7)});
}

// 15.10.2026, Ал («кривые нечитабельны» → вариант 4, оранжевый + светло-зелёный): столбик на показ — продано + ожидаемый добор, линия цели
// 15.10.2026, Ал: пригласительные против бизнес-плана — сколько их можно на шоу, чтобы не сорвать план по деньгам.
// Бизнес-план: 129 шоу × 276 мест в продаже, безубыточность 80 % = 221 гость, и все они платят (пригласительных в модели нет).
// Пригласительный занимает место, приносит только бар и стоит нам сет + велком (модель: 1 333 + 100 ₽).
// Бар — по плану, не меньше 2 000 ₽ на любого гостя (Ал, 15.10). Факт 15.10 по столам iiko: пригласительные 960 ₽, платные 2 199 ₽ — справочно.
const БАР_ПРИГЛ = ПЛАН_ЧЕК_БАРА, БАР_ПРИГЛ_ФАКТ_1510 = 960, ЗАТРАТЫ_ПРИГЛ = 1333 + 100;
function лимитПригл(цМеста) {
  const зал = D.мест_в_зале, цель = Math.round(зал * D.цель_загрузки);
  const деньгиПлан = цель * ((D.цена_места_в_модели || 9500) + ЦЕНА_СЕТА_КК + ПЛАН_ЧЕК_БАРА);   // 221 × 13 100 = 2 895 100 ₽
  const платный = цМеста + ЦЕНА_СЕТА_КК + ПЛАН_ЧЕК_БАРА, минус = ЗАТРАТЫ_ПРИГЛ - БАР_ПРИГЛ;
  // P платных + (зал − P) пригласительных: P × платный − (зал − P) × минус ≥ деньгиПлан
  const P = Math.min(зал, Math.ceil((деньгиПлан + зал * минус) / (платный + минус)));
  return {зал, цель, деньгиПлан, платный, минус, P, лимит: Math.max(0, зал - P)};
}
// 16.10.2026: лимит пригласительных на шоу по факту цен (как в блоке ниже); null — нет цен модели (партнёрская версия)

}

      `<text x="${x + w / 2}" y="${ВH + 30}" font-size="11" fill="#7d7590" text-anchor="middle">${r.в}</text>`; });

// 15.10.2026, Ал (шаг 2 «Как покупают»): тепловая карта «день недели × час покупки» по каналам

    let нБ = 0, нВ = 0; for (let д = new Date(ДНИ[0].ключ + 'T00:00:00'); д <= new Date(ДНИ[ДНИ.length - 1].ключ + 'T00:00:00'); д.setDate(д.getDate() + 1)) (д.getDay() % 6 ? нБ++ : нВ++);

const ПАМЯТЬ = 'очмж_пароль';   // у каждой версии свой ключ: обе на одном домене и иначе затирали пароль друг другу
const СРОК = 30 * 24 * 60 * 60 * 1000;   // пароль помнится на устройстве месяц
const б64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
// 15.10.2026: учёт просмотров (кто из партнёров смотрит) — журнал на нашем хостинге, во внутренней версии вкладка «Кто смотрит».
// Устройство — случайный номер в браузере; «от» — имя из личной ссылки ?от=имя, запоминается на устройстве.
const ВЕРСИЯ = 'п', СЧЁТ = 'https://puls.metelitsaclub1.ru/v.php';
function устройство() {
  try { let d = localStorage.getItem('очмж_уст');
    if (!d) { d = Array.from(crypto.getRandomValues(new Uint8Array(3)), b => b.toString(16).padStart(2, '0')).join(''); localStorage.setItem('очмж_уст', d); }
    return d; } catch (e) { return ''; }
}
function кто() {
  try { const о = new URLSearchParams(location.search).get('от');
    if (о) { localStorage.setItem('очмж_от', о); return о; }
    return localStorage.getItem('очмж_от') || ''; } catch (e) { return ''; }
}
function отметить(событие) {
  try { const п = СЧЁТ + '?' + new URLSearchParams({e: событие, v: ВЕРСИЯ, o: кто(), d: устройство(), w: screen.width + 'x' + screen.height, h: location.hostname});
    if (!(navigator.sendBeacon && navigator.sendBeacon(п))) fetch(п, {mode: 'no-cors', keepalive: true}); } catch (e) {}
}
отметить('экран');
async function расшифровать(пароль) {
  const км = await crypto.subtle.importKey('raw', new TextEncoder().encode(пароль),
    'PBKDF2', false, ['deriveKey']);
  const ключ = await crypto.subtle.deriveKey(
    {name: 'PBKDF2', salt: б64(ШИФР.соль), iterations: ШИФР.итераций, hash: 'SHA-256'},
    км, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const открыто = await crypto.subtle.decrypt({name: 'AES-GCM', iv: б64(ШИФР.iv)},
    ключ, б64(ШИФР.данные));
  // 10.10.2026: данные сжаты gzip до шифрования (шифротекст не сжимается) — 1,9 МБ → ~0,1 МБ
  if (ШИФР.сжато === 'gzip') {
    const поток = new Blob([открыто]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(поток).text());
  }
  return JSON.parse(new TextDecoder().decode(открыто));
}

// Пароль лежит только в браузере того, кто его ввёл: на сервер не уходит,
// другим устройствам не виден. Через месяц отчёт спросит его снова.
function запомнить(пароль) {
  try { localStorage.setItem(ПАМЯТЬ, JSON.stringify({п: пароль, до: Date.now() + СРОК})); } catch (e) {}
}
function вспомнить() {
  try {
    const с = JSON.parse(localStorage.getItem(ПАМЯТЬ) || 'null');
    if (с && с.до > Date.now() && с.п) return с.п;
    localStorage.removeItem(ПАМЯТЬ);
  } catch (e) {}
  return null;
}
function забыть() { try { localStorage.removeItem(ПАМЯТЬ); } catch (e) {} }

async function войти(пароль, авто) {
  применитьДанные(await расшифровать(пароль));
  document.getElementById('lock').remove();
  // ключ чтения журнала просмотров — SHA-256 пароля внутренней версии (на сервер уходит только он)
  if (ВЕРСИЯ === 'н') window.КЛЮЧ_ПРОСМОТРОВ = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',
    new TextEncoder().encode(пароль))), b => b.toString(16).padStart(2, '0')).join('');
  запустить();
  отметить(авто ? 'авто' : 'вход');
}

document.getElementById('lockform').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = document.getElementById('err'), кн = document.getElementById('go');
  if (!window.crypto || !crypto.subtle) {
    err.textContent = 'Браузер не даёт расшифровать: откройте отчёт по ссылке https, а не как файл.';
    return;
  }
  err.textContent = ''; кн.disabled = true; кн.textContent = 'Расшифровываю…';
  // 26.09.2026: пароль «не подходил» — прощаем пробелы при копировании и русскую раскладку
  const введено = document.getElementById('pw').value;
  const рус = 'йцукенгшщзхъфывапролджэячсмитьбю.ё', лат = "qwertyuiop[]asdfghjkl;'zxcvbnm,./`";
  const вЛат = s => [...s].map(c => { const i = рус.indexOf(c.toLowerCase()); return i < 0 ? c : лат[i]; }).join('');
  const варианты = [...new Set([введено, введено.trim(), вЛат(введено.trim())])];
  try {
    let вошли = false;
    for (const пароль of варианты) {
      try { await войти(пароль); запомнить(пароль); вошли = true; break; } catch (e) {}
    }
    if (!вошли) throw new Error('пароль');
  } catch (e) {
    забыть();
    err.textContent = 'Неверный пароль';
    кн.disabled = false; кн.textContent = 'Открыть';
    document.getElementById('pw').select();
  }
});

// Если пароль на этом устройстве уже вводили — открываем сразу, без вопросов.
(async () => {
  const сохранённый = вспомнить();
  if (!сохранённый || !window.crypto || !crypto.subtle) {
    document.getElementById('pw').focus();
    return;
  }
  const форма = document.getElementById('lockform');
  форма.style.visibility = 'hidden';
  try {
    await войти(сохранённый, true);
  } catch (e) {
    забыть();
    форма.style.visibility = '';
    document.getElementById('err').textContent = 'Пароль изменился — введите новый';
    document.getElementById('pw').focus();
  }
})();

<div id="свежесть" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:#ff2f6d;color:#fff;padding:11px 16px;font:600 14px/1.4 -apple-system,system-ui,sans-serif;
  display:none;align-items:center;justify-content:center;gap:14px">
  <span>Появилась свежая сборка дашборда</span>
  <button onclick="location.reload(true)" style="background:#fff;color:#ff2f6d;border:0;border-radius:8px;
    padding:7px 14px;font:700 13px system-ui;cursor:pointer">Обновить</button>
</div>
<script>
const СБОРКА = '17.10.2026 21:12';
async function проверитьСвежесть() {
  try {
    // 10.10.2026: метка — в самом начале файла; читаем первые куски и обрываем загрузку,
    // а не качаем всю страницу заново (на медленном хостинге это тормозило первое открытие)
    const ответ = await fetch(location.pathname + '?v=' + Date.now(), {cache: 'no-store'});
    const чтец = ответ.body.getReader(), дек = new TextDecoder();
    let текст = '', m = null;
    while (!m && текст.length < 4096) {
      const {value, done} = await чтец.read();
      if (done) break;
      текст += дек.decode(value, {stream: true});
      m = текст.match(/<!--СБОРКА:([^>]+)-->/);
    }
    чтец.cancel().catch(() => {});
    if (m && m[1] !== СБОРКА) {
      const п = document.getElementById('свежесть');
      п.style.display = 'flex';
    }
  } catch (e) {}
}
setInterval(проверитьСвежесть, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) проверитьСвежесть(); });
setTimeout(проверитьСвежесть, 60 * 1000);   // не в первую минуту — не мешать загрузке
</script>
